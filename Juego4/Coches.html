<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gran Premio Neón · Apuestas de Carreras 3D</title>
<link rel="stylesheet" href="../shared/arcade.css">
<script src="../shared/arcade.js"></script>
<style>
  :root { --car: #22e4ff; --sheet-h: 360px; }
  html, body { background: #07060f; }
  body { overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100dvh; touch-action: none; z-index: 0; }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
  #speedlines { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 3; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(4, 2, 12, .7) 100%); }
  #letterbox::before, #letterbox::after { content: ""; position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 4; transition: height .6s cubic-bezier(.2, .9, .2, 1); pointer-events: none; }
  #letterbox::before { top: 0; } #letterbox::after { bottom: 0; }
  body.cine #letterbox::before, body.cine #letterbox::after { height: 7dvh; }
  #fade { position: fixed; inset: 0; background: #000; z-index: 1500; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  #fade.on { opacity: 1; }

  /* ---------- Boot ---------- */
  #boot { position: fixed; inset: 0; z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(90% 60% at 50% 40%, #2a1050 0%, #07060f 70%); transition: opacity .5s ease; }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .logo { font-size: 64px; filter: drop-shadow(0 0 24px #ff2fb3); animation: ax-float 2s ease-in-out infinite; }
  #boot .t { font-family: var(--ax-display); font-size: clamp(26px, 8vw, 44px); text-align: center; }
  #boot .bar { width: min(70vw, 280px); height: 6px; border-radius: 9px; background: rgba(255,255,255,.1); overflow: hidden; }
  #boot .bar b { display: block; height: 100%; width: 40%; border-radius: 9px; background: linear-gradient(90deg, var(--ax-cyan), var(--ax-magenta)); animation: bootbar 1.1s ease-in-out infinite; }
  @keyframes bootbar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  #boot .msg { color: var(--ax-muted); font-weight: 600; letter-spacing: .08em; font-size: 14px; text-align: center; padding: 0 24px; }

  /* ---------- Garage title ---------- */
  #gTitle { position: fixed; left: 0; right: 0; bottom: calc(var(--sheet-h) + 10px); z-index: 20; text-align: center; pointer-events: none;
    transition: opacity .35s ease, transform .45s cubic-bezier(.2, 1.2, .3, 1); }
  #gTitle.off { opacity: 0; transform: translateY(20px); }
  #gTitle .row { display: inline-flex; align-items: center; gap: 10px; }
  #gTitle .num { font-family: var(--ax-display); font-size: 22px; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 12px; display: grid; place-items: center;
    background: #fff; color: #111; box-shadow: 0 0 0 3px var(--car), 0 0 24px var(--car); }
  #gTitle .name { font-family: var(--ax-display); font-size: clamp(28px, 9vw, 46px); line-height: 1; color: #fff;
    text-shadow: 0 0 10px var(--car), 0 0 30px var(--car), 0 3px 0 rgba(0,0,0,.5); letter-spacing: .02em; }
  #gTitle .tag { margin-top: 6px; font-weight: 800; font-size: 12px; letter-spacing: .3em; color: rgba(255,255,255,.75); text-transform: uppercase; text-shadow: 0 2px 6px #000; }
  #gTitle.pop .name { animation: gpop .45s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes gpop { 0% { transform: scale(.6) translateY(10px); opacity: 0; filter: blur(6px); } 100% { transform: none; opacity: 1; filter: none; } }

  /* ---------- Bottom sheet ---------- */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0 auto; max-width: 560px;
    padding: 12px 14px calc(var(--ax-safe-bottom) + 12px);
    border-radius: 24px 24px 0 0; border: 1px solid var(--ax-stroke-strong); border-bottom: 0;
    background: linear-gradient(180deg, rgba(30, 22, 62, .88), rgba(10, 8, 22, .96));
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 -18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
    transition: transform .55s cubic-bezier(.2, 1.1, .3, 1), opacity .3s ease; touch-action: manipulation; }
  .sheet::before { content: ""; position: absolute; left: 12%; right: 12%; top: -1px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--car), transparent); box-shadow: 0 0 14px var(--car); }
  .sheet.off { transform: translateY(115%); opacity: 0; pointer-events: none; }
  .car-row { display: flex; align-items: stretch; gap: 8px; }
  .nav { width: 44px; flex: none; border-radius: 14px; border: 1px solid var(--ax-stroke-strong); background: rgba(255,255,255,.06); color: #fff;
    font-size: 26px; font-weight: 900; display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform .1s; }
  .nav:active { transform: scale(.9); background: rgba(255,255,255,.14); }
  .card { flex: 1; min-width: 0; border-radius: 16px; padding: 9px 11px; border: 1px solid color-mix(in srgb, var(--car) 55%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--car) 20%, transparent), rgba(255,255,255,.03) 60%);
    box-shadow: inset 0 0 22px color-mix(in srgb, var(--car) 18%, transparent); }
  .card-h { display: flex; align-items: center; gap: 8px; }
  .card-h .n { font-family: var(--ax-display); font-size: 13px; background: #fff; color: #111; border-radius: 7px; padding: 2px 6px; box-shadow: 0 0 0 2px var(--car); }
  .card-h .nm { font-weight: 900; font-size: 17px; letter-spacing: .02em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .odds { font-family: var(--ax-display); font-size: 17px; color: var(--ax-gold); text-shadow: 0 0 12px rgba(255, 204, 51, .55); white-space: nowrap; }
  .odds small { font-family: var(--ax-font); font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--ax-muted); margin-right: 4px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 10px; margin-top: 7px; }
  .stat { display: flex; flex-direction: column; gap: 3px; font-size: 10px; font-weight: 800; letter-spacing: .12em; color: var(--ax-muted); }
  .stat i { display: block; height: 6px; border-radius: 6px; background: rgba(255,255,255,.09); overflow: hidden; }
  .stat b { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--car), #fff); box-shadow: 0 0 8px var(--car); transition: width .5s cubic-bezier(.2, 1, .3, 1); }
  .formline { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; font-size: 12px; font-weight: 700; color: var(--ax-muted); }
  .stars { color: var(--ax-gold); letter-spacing: 1px; font-size: 13px; text-shadow: 0 0 8px rgba(255, 204, 51, .5); }
  .stars .off { color: rgba(255,255,255,.18); text-shadow: none; }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 8px 0 8px; }
  .dots i { width: 7px; height: 7px; border-radius: 9px; background: rgba(255,255,255,.2); transition: all .25s; }
  .dots i.on { width: 22px; background: var(--car); box-shadow: 0 0 10px var(--car); }
  .bet-row { display: flex; gap: 8px; align-items: stretch; }
  .step { width: 52px; flex: none; border-radius: 14px; border: 1px solid var(--ax-stroke-strong); background: rgba(255,255,255,.07); color: #fff; font-size: 28px; font-weight: 800; cursor: pointer; padding: 0; }
  .step:active { transform: scale(.92); }
  .betbox { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; padding: 3px 8px;
    border: 1px solid rgba(255, 204, 51, .45); background: linear-gradient(180deg, rgba(60, 40, 0, .55), rgba(20, 12, 0, .7)); }
  .betbox label { font-size: 10px; font-weight: 800; letter-spacing: .25em; color: #ffd76a; }
  .betbox .v { display: flex; align-items: baseline; gap: 4px; }
  #betInput { width: 100%; max-width: 160px; background: transparent; border: 0; outline: 0; color: #fff; font-family: var(--ax-display); font-size: 24px; text-align: right; padding: 0; font-variant-numeric: tabular-nums; }
  .betbox .eu { font-family: var(--ax-display); font-size: 18px; color: var(--ax-gold); }
  .chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .chip { height: 38px; border-radius: 999px; border: 2px dashed rgba(255,255,255,.35); color: #fff; font-weight: 900; font-size: 13px; cursor: pointer; padding: 0;
    background: radial-gradient(circle at 50% 35%, var(--c1), var(--c2)); box-shadow: 0 3px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .chip:active { transform: translateY(2px) scale(.95); }
  .chip.on { outline: 2px solid #fff; outline-offset: 2px; }
  .winline { display: flex; justify-content: space-between; align-items: center; margin: 9px 2px 9px; font-size: 13px; font-weight: 700; color: var(--ax-muted); }
  .winline b { font-family: var(--ax-display); font-weight: 400; font-size: 16px; color: var(--ax-green); text-shadow: 0 0 10px rgba(43, 255, 136, .5); }
  #startBtn { min-height: 58px; font-size: 18px; font-family: var(--ax-display); font-weight: 400; letter-spacing: .03em; }
  #startBtn .flag { font-size: 22px; }
  @media (max-height: 700px) {
    .stats { margin-top: 5px; } .formline { margin-top: 5px; } .dots { margin: 6px 0; } .chips { margin-top: 6px; } .chip { height: 34px; }
    .winline { margin: 6px 2px; } #startBtn { min-height: 52px; font-size: 16px; } #gTitle .name { font-size: 28px; } #gTitle .num { height: 36px; min-width: 36px; font-size: 18px; }
    #gTitle .tag { display: none; }
  }
  @media (min-width: 900px) and (min-aspect-ratio: 5/4) {
    .sheet { left: auto; right: 24px; bottom: 24px; width: 410px; border-radius: 24px; border-bottom: 1px solid var(--ax-stroke-strong); padding-bottom: 16px; }
    .sheet.off { transform: translateX(120%); }
    #gTitle { left: 24px; right: 458px; bottom: 34px; }
  }

  /* ---------- Race HUD ---------- */
  #raceHud { position: fixed; inset: 0; z-index: 25; pointer-events: none; transition: opacity .4s; }
  #raceHud.off { opacity: 0; }
  #tower { position: absolute; left: calc(var(--ax-safe-left) + 8px); top: calc(var(--ax-safe-top) + 64px); width: 136px; border-radius: 12px; overflow: hidden;
    background: rgba(8, 6, 20, .72); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .tw-h { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 5px; font-size: 10px; font-weight: 900; letter-spacing: .14em;
    background: linear-gradient(90deg, #ff2fb3, #8b5cff); color: #fff; }
  .tw-prog { height: 3px; background: rgba(255,255,255,.12); }
  .tw-prog b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ax-cyan), #fff); box-shadow: 0 0 8px var(--ax-cyan); }
  .tw-rows { position: relative; height: calc(6 * 27px + 4px); }
  .tw-row { position: absolute; left: 4px; right: 4px; top: 2px; height: 25px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 4px; border-radius: 7px;
    font-size: 12px; font-weight: 800; transition: transform .45s cubic-bezier(.2, 1.1, .3, 1), background .3s; font-variant-numeric: tabular-nums; }
  .tw-row .p { width: 16px; text-align: center; font-family: var(--ax-display); font-size: 12px; color: #fff; }
  .tw-row .c { width: 4px; height: 16px; border-radius: 3px; }
  .tw-row .cd { flex: 1; letter-spacing: .06em; }
  .tw-row .g { font-size: 10px; color: var(--ax-muted); font-weight: 700; }
  .tw-row.me { background: linear-gradient(90deg, rgba(255, 204, 51, .38), rgba(255, 204, 51, .08)); box-shadow: inset 0 0 0 1px rgba(255, 204, 51, .7); }
  .tw-row.me .cd { color: #ffe9a6; }
  .tw-row.flash { animation: rowflash .7s ease; }
  @keyframes rowflash { 0% { background: rgba(43, 255, 136, .7); } 100% { } }
  #camLabel { position: absolute; right: calc(var(--ax-safe-right) + 10px); top: calc(var(--ax-safe-top) + 66px); display: flex; align-items: center; gap: 6px;
    padding: 5px 9px; border-radius: 8px; background: rgba(8, 6, 20, .66); border: 1px solid rgba(255,255,255,.14); font-size: 10px; font-weight: 900; letter-spacing: .14em; color: #fff; }
  #camLabel i { width: 8px; height: 8px; border-radius: 50%; background: #ff3b5c; box-shadow: 0 0 8px #ff3b5c; animation: ax-blink 1s infinite; }
  #camLabel.cut { animation: camcut .35s ease; }
  @keyframes camcut { 0% { transform: translateX(14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  #tapHint { position: absolute; right: calc(var(--ax-safe-right) + 10px); top: calc(var(--ax-safe-top) + 96px); font-size: 10px; font-weight: 700; color: rgba(255,255,255,.55); letter-spacing: .08em; transition: opacity .6s; }
  #pstrip { position: absolute; left: calc(var(--ax-safe-left) + 10px); right: calc(var(--ax-safe-right) + 10px); bottom: calc(var(--ax-safe-bottom) + 12px);
    max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 18px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--car) 30%, rgba(8,6,20,.8)), rgba(8, 6, 20, .82)); border: 1px solid color-mix(in srgb, var(--car) 60%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 24px color-mix(in srgb, var(--car) 25%, transparent); pointer-events: auto; }
  .ps-pos { font-family: var(--ax-display); font-size: 30px; line-height: 1; min-width: 58px; text-align: center; color: #fff; text-shadow: 0 0 14px var(--car); }
  .ps-pos.up { animation: pup .6s ease; } .ps-pos.down { animation: pdown .6s ease; }
  @keyframes pup { 30% { transform: scale(1.35); color: var(--ax-green); } }
  @keyframes pdown { 30% { transform: scale(.85); color: var(--ax-red); } }
  .ps-info { flex: 1; min-width: 0; }
  .ps-name { font-weight: 900; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps-bet { font-size: 12px; color: var(--ax-muted); font-weight: 700; }
  .ps-bet b { color: var(--ax-gold); }
  .ps-speed { text-align: right; line-height: 1; }
  .ps-speed b { display: block; font-family: var(--ax-display); font-weight: 400; font-size: 24px; color: #fff; font-variant-numeric: tabular-nums; min-width: 60px; }
  .ps-speed span { font-size: 9px; font-weight: 900; letter-spacing: .2em; color: var(--ax-muted); }
  #ffBtn { width: 46px; height: 46px; flex: none; border-radius: 14px; border: 1px solid var(--ax-stroke-strong); background: rgba(255,255,255,.08); color: #fff; font-weight: 900; font-size: 14px; cursor: pointer; padding: 0; }
  #ffBtn.on { background: var(--ax-cyan); color: #00222e; box-shadow: 0 0 16px var(--ax-cyan); }

  /* ---------- Start lights ---------- */
  #lights { position: fixed; left: 0; right: 0; top: calc(var(--ax-safe-top) + 74px); z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; transition: opacity .3s, transform .4s cubic-bezier(.2,1.3,.3,1); }
  #lights.off { opacity: 0; transform: translateY(-30px); }
  .lt-box { display: flex; gap: 8px; padding: 10px 12px; border-radius: 14px; background: linear-gradient(180deg, #16121f, #050409); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 12px 30px rgba(0,0,0,.6); }
  .lt-col { display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 10px; background: #000; }
  .lt-col i { width: clamp(22px, 7vw, 34px); height: clamp(22px, 7vw, 34px); border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a0b12, #1a0306); transition: background .08s, box-shadow .08s; }
  .lt-col.on i { background: radial-gradient(circle at 40% 35%, #fff0f0, #ff2a3c 45%, #a00010); box-shadow: 0 0 18px #ff2a3c, 0 0 40px rgba(255, 30, 50, .6); }
  .lt-col.go i { background: radial-gradient(circle at 40% 35%, #f0fff6, #2bff88 45%, #008a3a); box-shadow: 0 0 18px #2bff88, 0 0 40px rgba(43, 255, 136, .6); }
  .lt-text { font-family: var(--ax-display); font-size: 16px; letter-spacing: .12em; color: #fff; text-shadow: 0 0 12px rgba(255, 59, 92, .9), 0 2px 0 #000; }

  /* ---------- Callouts / banners ---------- */
  #callout { position: fixed; left: 0; right: 0; top: 38%; z-index: 45; display: flex; justify-content: center; pointer-events: none; }
  .co { padding: 8px 18px 9px; border-radius: 12px; text-align: center; transform: skewX(-10deg); background: linear-gradient(90deg, rgba(255,47,179,.92), rgba(139,92,255,.92));
    box-shadow: 0 0 30px rgba(255, 47, 179, .55), 0 10px 30px rgba(0,0,0,.4); animation: coin .35s cubic-bezier(.2, 1.5, .4, 1) both, coout .35s 1.6s ease forwards; }
  .co.gold { background: linear-gradient(90deg, rgba(255, 190, 40, .95), rgba(255, 120, 0, .95)); box-shadow: 0 0 30px rgba(255, 190, 40, .6); color: #2a1300; }
  .co.red { background: linear-gradient(90deg, rgba(255, 59, 92, .95), rgba(140, 0, 40, .95)); box-shadow: 0 0 30px rgba(255, 59, 92, .55); }
  .co.green { background: linear-gradient(90deg, rgba(43, 255, 136, .95), rgba(10, 160, 90, .95)); box-shadow: 0 0 30px rgba(43, 255, 136, .5); color: #00321a; }
  .co b { display: block; font-family: var(--ax-display); font-weight: 400; font-size: clamp(18px, 6vw, 28px); transform: skewX(10deg); }
  .co span { display: block; font-size: 12px; font-weight: 800; letter-spacing: .14em; transform: skewX(10deg); opacity: .9; }
  @keyframes coin { from { opacity: 0; transform: skewX(-10deg) translateX(-60px) scale(.7); } to { opacity: 1; transform: skewX(-10deg); } }
  @keyframes coout { to { opacity: 0; transform: skewX(-10deg) translateX(60px); } }
  #flagBanner { position: fixed; left: 0; right: 0; top: 30%; z-index: 60; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  #flagBanner .strip { width: 130vw; padding: 14px 0 12px; text-align: center; transform: skewY(-5deg); position: relative; overflow: hidden;
    background: repeating-conic-gradient(#fff 0 25%, #111 0 50%) 0 0 / 36px 36px; box-shadow: 0 0 60px rgba(255,255,255,.4); animation: flagin 2.6s cubic-bezier(.7, 0, .3, 1) forwards; }
  #flagBanner .strip::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.7)); }
  #flagBanner .ft { position: relative; z-index: 1; font-family: var(--ax-display); font-size: clamp(26px, 9vw, 54px); color: #fff; transform: skewY(5deg); text-shadow: 0 0 20px rgba(255,255,255,.8), 0 4px 0 #000; }
  #flagBanner .fs { position: relative; z-index: 1; font-weight: 900; letter-spacing: .2em; font-size: clamp(12px, 3.6vw, 16px); color: #ffe9a6; transform: skewY(5deg); margin-top: 4px; }
  @keyframes flagin { 0% { transform: skewY(-5deg) scaleY(0); opacity: 0; } 12% { transform: skewY(-5deg) scaleY(1); opacity: 1; } 85% { opacity: 1; transform: skewY(-5deg) scaleY(1); } 100% { opacity: 0; transform: skewY(-5deg) scaleY(0); } }
  #photo { position: fixed; inset: 0; z-index: 55; pointer-events: none; display: flex; align-items: flex-start; justify-content: center; }
  #photo .frame { position: absolute; inset: calc(var(--ax-safe-top) + 64px) 12px calc(var(--ax-safe-bottom) + 90px); border: 3px solid rgba(255,255,255,.9); border-radius: 6px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,.25), inset 0 0 40px rgba(255,255,255,.25); animation: photoin .5s ease both, ax-fade-out .5s 2s ease forwards; }
  #photo .stamp { position: absolute; top: calc(var(--ax-safe-top) + 78px); padding: 6px 14px; background: #fff; color: #111; font-family: var(--ax-display); font-size: 18px; border-radius: 6px; transform: rotate(-4deg);
    box-shadow: 0 8px 20px rgba(0,0,0,.5); animation: photostamp .5s cubic-bezier(.2, 1.6, .4, 1) both, ax-fade-out .5s 2s ease forwards; }
  #photo .stamp small { font-family: var(--ax-font); font-weight: 900; font-size: 12px; margin-left: 6px; color: #c4123a; }
  @keyframes photoin { from { transform: scale(1.12); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes photostamp { from { transform: rotate(-20deg) scale(2.4); opacity: 0; } to { transform: rotate(-4deg); opacity: 1; } }
  #slowTag { position: fixed; left: 0; right: 0; top: calc(var(--ax-safe-top) + 120px); z-index: 50; text-align: center; pointer-events: none; font-family: var(--ax-display); font-size: clamp(20px, 7vw, 34px);
    color: #fff; text-shadow: 0 0 16px var(--ax-cyan), 0 0 40px var(--ax-violet); letter-spacing: .1em; animation: ax-pulse .8s ease-in-out infinite; }

  /* ---------- Result ---------- */
  #result .rh { text-align: center; font-family: var(--ax-display); font-size: 22px; margin: 2px 0 8px; }
  #result .list { display: flex; flex-direction: column; gap: 4px; }
  #result .ri { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.05); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  #result .ri .p { font-family: var(--ax-display); width: 22px; text-align: center; }
  #result .ri .c { width: 5px; height: 18px; border-radius: 3px; }

<script type="module">

  const p = w.map((x) => x / sum);
  const odds = p.map((x) => clamp(Math.floor((RTP / x) * 10) / 10, 1.5, 30));
  return { forma, p, odds };
}

  let r = Math.random() * tot;
  for (let i = 0; i < p.length; i++) {

/* =====================================================================
   UTILIDADES DE GEOMETRÍA
   ===================================================================== */
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _p = new THREE.Vector3();
const linColor = (c, k = 1) => { const col = new THREE.Color(c); return [col.r * k, col.g * k, col.b * k]; };
function paint(g, rgb) {
  const n = g.attributes.position.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = rgb[0]; a[i * 3 + 1] = rgb[1]; a[i * 3 + 2] = rgb[2]; }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}
class Bucket {
  constructor(keepUV = false) { this.list = []; this.keepUV = keepUV; }
  add(geo, o = {}, color = '#ffffff', k = 1) {
    let g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (!this.keepUV) { g.deleteAttribute('uv'); }
    if (!g.attributes.normal) g.computeVertexNormals();
    _e.set(o.rx || 0, o.ry || 0, o.rz || 0, 'YXZ');
    _q.setFromEuler(_e);
    _m.compose(_p.set(o.x || 0, o.y || 0, o.z || 0), _q, _s.set(o.sx || 1, o.sy || 1, o.sz || 1));
    g.applyMatrix4(_m);
    if (!g.attributes.color) paint(g, Array.isArray(color) ? color : linColor(color, k));
    this.list.push(g);
    return g;
  }
  build(mat) { const g = mergeGeometries(this.list); this.list = []; return new THREE.Mesh(g, mat); }
}
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

}
/** Plano horizontal con color por vértice función de (u,v) en [-1,1]. */
function glowPlane(w, l, sw, sl, fn) {
  const g = new THREE.PlaneGeometry(w, l, sw, sl).rotateX(-Math.PI / 2);
  const pos = g.attributes.position, n = pos.count, a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const u = pos.getX(i) / (w / 2), v = pos.getZ(i) / (l / 2);
    const c = fn(u, v); a[i * 3] = c[0]; a[i * 3 + 1] = c[1]; a[i * 3 + 2] = c[2];
  }
  g.setAttribute('color', new THREE.BufferAttribute(a, 3));
  return g;
}

/* =====================================================================
   CIRCUITO (óvalo tipo estadio)
   ===================================================================== */
const TL = 240, TR = 75, TW = 20;
const PER = 2 * TL + 2 * Math.PI * TR;
const S_LINE = TL / 2; // línea de meta (x = 0 en la recta principal)
const S_GRID = S_LINE - 2.45;
const LANES = [-7.5, -4.5, -1.5, 1.5, 4.5, 7.5];
const TP = { x: 0, z: 0, tx: 1, tz: 0, nx: 0, nz: 1 };
function trackAt(s, o = TP) {
  s = ((s % PER) + PER) % PER;
  const C = Math.PI * TR;
  if (s < TL) { o.x = -TL / 2 + s; o.z = TR; o.tx = 1; o.tz = 0; }
  else if (s < TL + C) { const th = (s - TL) / TR; o.x = TL / 2 + TR * Math.sin(th); o.z = TR * Math.cos(th); o.tx = Math.cos(th); o.tz = -Math.sin(th); }
  else if (s < 2 * TL + C) { const k = s - TL - C; o.x = TL / 2 - k; o.z = -TR; o.tx = -1; o.tz = 0; }

  o.nx = -o.tz; o.nz = o.tx; // normal hacia el exterior
  return o;
}
const inCurve = (s) => { s = ((s % PER) + PER) % PER; return (s >= TL && s < TL + Math.PI * TR) || s >= 2 * TL + Math.PI * TR; };
function ribbonGeo(lat0, y0, lat1, y1, s0, s1, step, vScale) {
  const n = Math.max(1, Math.ceil((s1 - s0) / step));
  const pos = [], uv = [], idx = [];
  const o = {};
  for (let i = 0; i <= n; i++) {
    const s = s0 + ((s1 - s0) * i) / n;
    trackAt(s, o);
    pos.push(o.x + o.nx * lat0, y0, o.z + o.nz * lat0, o.x + o.nx * lat1, y1, o.z + o.nz * lat1);
    uv.push(0, s / vScale, 1, s / vScale);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

const STRUCT = new Bucket(); // estructuras oscuras
const NEON = new Bucket();   // neones (HDR, sin iluminación)
const ADD = new Bucket();    // conos de luz / charcos (aditivo)

// Asfalto
const asphaltTex = canvasTex(256, 512, (x, w, h) => {

});
asphaltTex.wrapT = THREE.RepeatWrapping;
asphaltTex.wrapS = THREE.ClampToEdgeWrapping;

const track = new THREE.Mesh(ribbonGeo(-13, 0.02, 13, 0.02, 0, PER, 2, 16), trackMat);
track.receiveShadow = Q.shadows;
scene.add(track);

// Pianos (sólo en curvas)
const kerbTex = canvasTex(16, 64, (x, w, h) => { x.fillStyle = '#e8173a'; x.fillRect(0, 0, w, h / 2); x.fillStyle = '#f4f1ff'; x.fillRect(0, h / 2, w, h / 2); });
kerbTex.wrapT = THREE.RepeatWrapping;
{

});
{

{

let composer = null, bloomPass = null;
async function setupBloom() {
  if (!Q.bloom) return;
  try {
    const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
    ]);
    if (!Q.bloom) return;
    const rt = new THREE.WebGLRenderTarget(innerWidth * pixelRatio, innerHeight * pixelRatio, { type: THREE.HalfFloatType, samples: Q.msaa });
    composer = new EffectComposer(renderer, rt);
    composer.setPixelRatio(pixelRatio);
    composer.setSize(innerWidth, innerHeight);
    composer.addPass(new RenderPass(scene, camera));
    bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.5, 0.92);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());
  } catch (e) {
    console.warn('Bloom no disponible', e);
    composer = null;
  }
}
function disableBloom() {
  Q.bloom = false;
  if (composer) { composer.dispose && composer.dispose(); composer = null; bloomPass = null; }
}

const SND = {
  ready: false,
  init() {
    if (this.ready) return;

    this.c = c; this.ready = true;
    const out = (this.out = c.createGain()); out.gain.value = document.hidden ? 0 : 1; out.connect(AX.sfx.master);
    const dist = c.createWaveShaper();

    const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

      const s = c.createBufferSource(); s.buffer = buf; s.loop = true;
      const bf = c.createBiquadFilter(); bf.type = type; bf.frequency.value = f; bf.Q.value = q;
      const g = c.createGain(); g.gain.value = 0;

    this.crowd = loop('bandpass', 1100, 0.5);

const tweens = new Set();

function setupRace() {

    else if (pos > 1) T += rand(0.12, 0.75);
    const c = cars[ci];

function simRace(dt) {
  race.t += dt;
  const t = race.t, D = PER;
  const newly = [];
  cars.forEach((c) => {
    if (!c.finished) {
      const u = t / c.T;
      if (u >= 1) {
        c.finished = true; c.finishT = c.T;
        const vEnd = (D * dF(1, c)) / c.T;
        c.v = vEnd; c.d = D + (t - c.T) * vEnd;
        newly.push(c);
      } else {
        const nd = D * F(u, c);
        const nv = (D * dF(u, c)) / c.T;
        c.acc = (nv - c.v) / Math.max(dt, 1e-4);
        c.v = nv; c.d = Math.max(c.d, nd);
        const vRef = (D / c.T) * 1.04;
        c.boost = lerp(c.boost, clamp((c.v / vRef - 1.0) * 9, 0, 1), damp(4, dt));
        c.brake = clamp(-c.acc * 0.15, 0, 1);
      }
    } else {
      c.v = Math.max(9, c.v - 7 * dt);
      c.d += c.v * dt;
      c.boost = lerp(c.boost, 0, damp(3, dt));
      c.brake = 0.8;
      c.acc = -7;
    }
  });
  newly.sort((a, b) => a.T - b.T).forEach((c) => onCross(c));

  race.prevOrder = race.order;
  race.order = cars.slice().sort((a, b) => (a.finished && b.finished ? a.finishT - b.finishT : b.d - a.d)).map((c) => c.i);
}

    if (c.root.parent !== scene) return;
    const weaveK = smooth01((race.t - 2.5) / 3);
    c.lat = c.lane + Math.sin(race.t * 0.55 + c.weave) * 0.32 * weaveK;
    placeOnTrack(c, S_GRID + c.d, c.lat);
    const curve = inCurve(c.s) ? 1 : 0;
    c.roll = lerp(c.roll, curve * 0.05 * clamp(c.v / 40, 0, 1.2), damp(3, dt));
    c.pitch = lerp(c.pitch, clamp(-(c.acc || 0) * 0.0035, -0.05, 0.04), damp(5, dt));

    const pool = [['chase', 3.2], ['heli', 2.2], ['trackside', 2], ['side', 1.8], ['front', 1.6], ['onboard', 1.6]];
    let tot = 0; const opts = pool.filter(([t]) => t !== this.lastType);
    opts.forEach(([, w]) => (tot += w));
    let r = Math.random() * tot, type = opts[0][0];
    for (const [t, w] of opts) { r -= w; if (r <= 0) { type = t; break; } }
    const mine = cars[stake.car];
    const L = leaderCar();
    const focusMine = Math.random() < 0.65;
    const target = focusMine ? mine.i : L.i;
    const now = performance.now() / 1000;
    let dur = rand(2.8, 4);
    const o = { target };
    if (type === 'side') o.side = Math.random() < 0.5 ? 1 : -1;
    if (type === 'heli') o.side = Math.random() < 0.5 ? 1 : -1;
    if (type === 'front') o.target = Math.random() < 0.5 ? L.i : mine.i;
    if (type === 'trackside') { const T = cars[target]; o.sCam = T.s + 55 + rand(0, 25); o.side = Math.random() < 0.75 ? 1 : -1; o.target = target; dur = 4.5; }
    if (type === 'onboard') o.target = mine.i;
    cut(type, o);
    this.lastType = type;
    this.until = now + dur;
    if (manual) { this.overrideUntil = now + 2.5; AX.sfx.play('click'); }
  },
  update() {
    const now = performance.now() / 1000;
    if (state !== 'race') return;
    const W = cars[race.winner];
    const remain = W.T - race.t;
    if (remain < 1.9 && shot.type !== 'finish') { cut('finish'); return; }
    if (shot.type === 'finish') return;
    if (shot.type === 'trackside') {
      const T = cars[shot.target];
      if (shot.fixed && T.s > shot.sCam + 22) { this.next(); return; }
    }
    if (now > this.until) this.next();
  },
  overtake(c) {
    const now = performance.now() / 1000;
    if (now - lastCut < 1.6 || now < this.overrideUntil || shot.type === 'finish') return;
    const W = cars[race.winner];
    if (W.T - race.t < 3.2) return;
    cut('overtake', { target: c.i, side: Math.random() < 0.5 ? 1 : -1 });
    this.lastType = 'overtake';
    this.until = now + 2.3;
  },
};

function detectOvertakes() {
  if (state !== 'race') return;
  const now = performance.now() / 1000;
  const prev = race.prevOrder, cur = race.order;
  if (prev[0] !== cur[0] && race.t > 3) {
    const c = cars[cur[0]];
    if (!race.lastEvt.lead || now - race.lastEvt.lead > 1.6) {
      race.lastEvt.lead = now;
      callout('¡NUEVO LÍDER!', `#${c.def.num} ${c.def.name.toUpperCase()}`, c.i === stake.car ? 'gold' : '');
      if (c.i === stake.car) { AX.haptic('success'); AX.sfx.play('powerup'); }
      else AX.sfx.play('swoosh');
      SND.cheer();
      director.overtake(c);
      return;
    }
  }
  const pm = prev.indexOf(stake.car), cm = cur.indexOf(stake.car);
  if (pm !== cm && race.t > 3) {
    const k = 'me';
    if (!race.lastEvt[k] || now - race.lastEvt[k] > 1.4) {
      race.lastEvt[k] = now;
      const mine = cars[stake.car];
      if (cm < pm) {
        callout('¡ADELANTAMIENTO!', `#${mine.def.num} SUBE A P${cm + 1}`, 'green');
        AX.haptic('tap'); AX.sfx.play('whoosh');
        director.overtake(mine);
      } else {
        callout('¡TE ADELANTAN!', `#${mine.def.num} CAE A P${cm + 1}`, 'red');
        AX.haptic('light');
      }
    }
  }
}

/* =====================================================================
   LÍNEAS DE VELOCIDAD (2D)
   ===================================================================== */
const sl = $('#speedlines'), slx = sl.getContext('2d');
const SL = Array.from({ length: 46 }, () => ({ a: Math.random() * Math.PI * 2, r: Math.random(), sp: rand(0.8, 1.6), w: rand(0.6, 2.2) }));
let slOn = false;
function resizeSL() { const d = Math.min(1.5, devicePixelRatio || 1); sl.width = innerWidth * d; sl.height = innerHeight * d; slx.setTransform(d, 0, 0, d, 0, 0); }
function drawSpeedLines(dt) {
  let k = 0;
  if ((state === 'race' || state === 'finish') && SPEEDLINE_K[shot.type] && shot.target != null) {
    const c = cars[shot.target];
    k = SPEEDLINE_K[shot.type] * clamp((c.v - 30) / 18, 0, 1) * (0.6 + c.boost * 0.6) * (timeScale < 0.6 ? 0.3 : 1);
  }
  if (k <= 0.02) { if (slOn) { slx.clearRect(0, 0, innerWidth, innerHeight); slOn = false; } return; }
  slOn = true;
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H * 0.46, R = Math.hypot(W, H) * 0.6;
  slx.clearRect(0, 0, W, H);
  slx.lineCap = 'round';
  SL.forEach((p) => {
    p.r += dt * p.sp * 2.4;
    if (p.r > 1) { p.r = 0.25 + Math.random() * 0.2; p.a = Math.random() * Math.PI * 2; }
    const r1 = R * p.r, r2 = r1 + R * 0.22 * p.sp;
    const a = (k * 0.55 * (p.r - 0.25)) / 0.75;
    slx.strokeStyle = `rgba(255,255,255,${a})`;
    slx.lineWidth = p.w;
    slx.beginPath();
    slx.moveTo(cx + Math.cos(p.a) * r1, cy + Math.sin(p.a) * r1);
    slx.lineTo(cx + Math.cos(p.a) * r2, cy + Math.sin(p.a) * r2);
    slx.stroke();
  });
}

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
let last = performance.now(), rafId = 0, running = false;
const perf = { acc: 0, frames: 0, steps: 0 };
function frame(now) {
  rafId = requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0.0001, (now - last) / 1000));
  last = now;
  TIME.value += dt;
  updateTweens(now);

  timeScale = lerp(timeScale, timeScaleTarget, damp(timeScaleTarget < timeScale ? 10 : 3, dt));
  const simDt = dt * timeScale * userSpeed * DEBUG.speed;

  if (state === 'race' || state === 'finish') {
    simRace(simDt);
    poseCars(dt, simDt);
    detectOvertakes();
    director.update();
    if (state === 'race' && race.photo && !race.slowmo) {
      const W = cars[race.winner];
      if (W.T - race.t < 0.7) {
        race.slowmo = true; timeScaleTarget = 0.22;
        AX.fx.slowmo(2600);
        const st = AX.el('div', '', 'FOTO FINISH'); st.id = 'slowTag'; document.body.appendChild(st);
        setTimeout(() => st.remove(), 2600);
        AX.sfx.play('riser');
      }
    }
    updateRaceHud();
    // marcador sobre tu coche
    const mine = cars[stake.car];
    marker.position.copy(mine.root.position).add(_v.set(0, 3.1 + Math.sin(now * 0.006) * 0.15, 0));
    marker.visible = !['onboard', 'chase', 'chaseLow'].includes(shot.type) && state === 'race';
  } else if (state === 'lights' && stake) {
    const mine = cars[stake.car];
    marker.position.copy(mine.root.position).add(_v.set(0, 3.1 + Math.sin(now * 0.006) * 0.15, 0));
    marker.visible = shot.type === 'grid';
    cars.forEach((c) => (c.chassis.position.y = Math.sin(now * 0.05 + c.i * 2) * 0.012));
  } else if (state === 'garage' || state === 'boot' || state === 'toGrid') {
    TT_SPIN.rotation.y += dt * 0.32;
    const c = garage.current >= 0 ? cars[garage.current] : null;
    if (c) c.chassis.position.y = Math.sin(now * 0.04) * 0.006;
  }
  ringFlash *= Math.pow(0.05, dt);
  ttRing.scale.setScalar(1 + ringFlash * 0.08);
  ttRing2.material.color.copy(ttRingMat.color);

  updateShot(dt);
  applyCamera(dt);
  updateCarGlows();
  sparks.update(dt * Math.max(0.25, timeScale));
  smoke.update(dt * Math.max(0.25, timeScale));
  drawSpeedLines(dt);
  updateAudio(dt);

  if (composer) composer.render(dt); else renderer.render(scene, camera);
  adapt(dt);
}
function updateAudio(dt) {
  if (!SND.ready) return;
  if (state === 'race' || state === 'finish') {
    const mine = cars[stake.car];
    const vmax = (PER / race.T0) * 1.25;
    const sf = clamp(mine.v / vmax, 0, 1);
    const g = sf * 5.2, rpm = 0.28 + 0.72 * (g - Math.floor(g));
    const dist = camera.position.distanceTo(mine.root.position);
    const near = ['chase', 'onboard', 'side', 'overtake', 'chaseLow'].includes(shot.type) && shot.target === stake.car;
    SND.engine(state === 'finish' ? 0.35 : rpm, (near ? 0.16 : 0.05 * clamp(1 - dist / 90, 0.2, 1)) * (timeScale < 0.5 ? 0.5 : 1));
    let md = 1e9; cars.forEach((c) => (md = Math.min(md, camera.position.distanceTo(c.root.position))));
    const pk = clamp(1 - md / 60, 0, 1);
    SND.t(SND.pack.g.gain, 0.05 + pk * pk * 0.4, 0.06); SND.t(SND.pack.bf.frequency, 220 + pk * 700, 0.08);
    SND.t(SND.wind.g.gain, near ? 0.03 + mine.boost * 0.04 : 0, 0.1);
    if (pk > 0.75 && shot.type === 'trackside' && !shot.whoosh) { shot.whoosh = true; AX.sfx.play('swoosh'); }
  } else if (state === 'garage') {
    SND.engine(0.06, 0.03);
    SND.t(SND.pack.g.gain, 0, 0.3); SND.t(SND.wind.g.gain, 0, 0.3);
    SND.crowdLevel(0.035, 1);
  } else if (state === 'podium' || state === 'result') {
    SND.t(SND.eg.gain, 0, 0.3); SND.t(SND.pack.g.gain, 0, 0.3); SND.t(SND.wind.g.gain, 0, 0.3);
  }
}
// Calidad adaptativa: si va lento se baja bloom y resolución
function adapt(dt) {
  if (forcedQ || state === 'boot') return;
  perf.acc += dt; perf.frames++;
  if (perf.acc < 2.5) return;
  const fps = perf.frames / perf.acc;
  perf.acc = 0; perf.frames = 0;
  if (fps < 42 && perf.steps < 4) {
    perf.steps++;
    if (Q.bloom && composer) disableBloom();
    else if (pixelRatio > 0.8) { pixelRatio = Math.max(0.75, pixelRatio * 0.8); renderer.setPixelRatio(pixelRatio); onResize(); }
  }
}
function start() { if (running) return; running = true; last = performance.now(); rafId = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop(); SND.mute(true); }
  else { start(); SND.mute(false); }
});
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setPixelRatio(pixelRatio); composer.setSize(innerWidth, innerHeight); }
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  resizeSL();
  if (state === 'garage') { sheetHeight(); computeViewOffset(); }
}
addEventListener('resize', onResize);
resizeSL();

};

  CAM.pos.set(-160, 95, 210); CAM.look.set(0, 0, 0); CAM.hfov = 70;
  start();
  window.__cochesReady = true;
  $('#boot').classList.add('hide');
  setTimeout(() => $('#boot').remove(), 600);
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('400 40px Bungee'), document.fonts.load('800 20px Outfit')]).then(redrawFontTextures).catch(() => {});
  }
  const intro = AX.cine.intro({ title: 'Gran Premio Neón', subtitle: 'Apuesta · Acelera · Gana', icon: '🏎️', color: '#ff2fb3', once: true });
  // vuelo de presentación mientras corre la intro
  const p0 = CAM.pos.clone(), l0 = CAM.look.clone();
  tween(3000, (k) => { CAM.pos.set(lerp(p0.x, 60, k), lerp(p0.y, 70, k), lerp(p0.z, 230, k)); CAM.look.copy(l0).lerp(new THREE.Vector3(0, 10, TR), k); }, (t) => t);
  await intro;
  // vuelo hasta el garaje
  state = 'garage';
  computeViewOffset();
  const a0 = CAM.pos.clone(), b0 = CAM.look.clone();
  const r = garage.r * portraitK();
  const end = new THREE.Vector3(TT_POS.x + Math.sin(garage.ang) * r, 2.2, TT_POS.z + Math.cos(garage.ang) * r);
  const curve = new THREE.CatmullRomCurve3([a0, new THREE.Vector3(-20, 30, 70), new THREE.Vector3(TT_POS.x + 10, 8, TT_POS.z + 22), end]);
  const lookEnd = new THREE.Vector3(TT_POS.x, 0.85, TT_POS.z);
  AX.sfx.play('whoosh');
  await tween(2200, (k) => { curve.getPoint(k, CAM.pos); CAM.look.copy(b0).lerp(lookEnd, AX.ease.inOutCubic(k)); CAM.hfov = lerp(70, 56, k); }, AX.ease.inOutCubic);
  cut('garage');
  showGarageUI(true);
  renderBet();
  AX.sfx.play('swoosh');
  SND.rev(0.6);
}
DEBUG.get = () => ({ state, sel, bet, shot: shot.type, tier: TIER, bloom: !!composer, pixelRatio, t: race.t, winner: race.winner, order: race.order.slice(), photo: race.photo, stake: stake && Object.assign({}, stake) });
DEBUG.select = (i) => { if (state === 'garage') { sel = i; putOnTurntable(sel, false); renderCard(); } };
boot();
</script>
