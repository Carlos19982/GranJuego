<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gran Premio Neón · Apuestas de Carreras 3D</title>
<link rel="stylesheet" href="../shared/arcade.css">
<script src="../shared/arcade.js"></script>
<style>
  :root { --car: #22e4ff; --sheet-h: 360px; }
  html, body { background: #07060f; }
  body { overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100dvh; touch-action: none; z-index: 0; }
  #stage canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }
  #speedlines { position: fixed; inset: 0; width: 100vw; height: 100dvh; pointer-events: none; z-index: 3; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(4, 2, 12, .7) 100%); }
  #letterbox::before, #letterbox::after { content: ""; position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 4; transition: height .6s cubic-bezier(.2, .9, .2, 1); pointer-events: none; }
  #letterbox::before { top: 0; } #letterbox::after { bottom: 0; }
  body.cine #letterbox::before, body.cine #letterbox::after { height: 6dvh; }
  #fade { position: fixed; inset: 0; background: #000; z-index: 1500; pointer-events: none; opacity: 0; transition: opacity .35s ease; }
  #fade.on { opacity: 1; }
  #whip { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(220,235,255,.55) 45%, rgba(255,255,255,.75) 50%, rgba(220,235,255,.55) 55%, rgba(255,255,255,0)); background-size: 300% 100%; }
  #whip.go { animation: whip .26s ease-out; }
  @keyframes whip { 0% { opacity: 0; background-position: 100% 0; } 40% { opacity: .9; } 100% { opacity: 0; background-position: 0 0; } }

  /* ---------- Boot ---------- */
  #boot { position: fixed; inset: 0; z-index: 4000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(90% 60% at 50% 40%, #2a1050 0%, #07060f 70%); transition: opacity .5s ease; }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .logo { font-size: 64px; filter: drop-shadow(0 0 24px #ff2fb3); animation: ax-float 2s ease-in-out infinite; }
  #boot .t { font-family: var(--ax-display); font-size: clamp(26px, 8vw, 44px); text-align: center; }
  #boot .bar { width: min(70vw, 280px); height: 6px; border-radius: 9px; background: rgba(255,255,255,.1); overflow: hidden; }
  #boot .bar b { display: block; height: 100%; width: 40%; border-radius: 9px; background: linear-gradient(90deg, var(--ax-cyan), var(--ax-magenta)); animation: bootbar 1.1s ease-in-out infinite; }
  @keyframes bootbar { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  #boot .msg { color: var(--ax-muted); font-weight: 600; letter-spacing: .08em; font-size: 14px; text-align: center; padding: 0 24px; }

  /* ---------- Garage title ---------- */
  #gTitle { position: fixed; left: 0; right: 0; bottom: calc(var(--sheet-h) + 10px); z-index: 20; text-align: center; pointer-events: none;
    transition: opacity .35s ease, transform .45s cubic-bezier(.2, 1.2, .3, 1); }
  #gTitle.off { opacity: 0; transform: translateY(20px); }
  #gTitle .row { display: inline-flex; align-items: center; gap: 10px; }
  #gTitle .num { font-family: var(--ax-display); font-size: 22px; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 12px; display: grid; place-items: center;
    background: #fff; color: #111; box-shadow: 0 0 0 3px var(--car), 0 0 24px var(--car); }
  #gTitle .name { font-family: var(--ax-display); font-size: clamp(28px, 9vw, 46px); line-height: 1; color: #fff;
    text-shadow: 0 0 10px var(--car), 0 0 30px var(--car), 0 3px 0 rgba(0,0,0,.5); letter-spacing: .02em; }
  #gTitle .tag { margin-top: 6px; font-weight: 800; font-size: 12px; letter-spacing: .22em; color: rgba(255,255,255,.8); text-transform: uppercase; text-shadow: 0 2px 6px #000; }
  #gTitle.pop .name { animation: gpop .45s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes gpop { 0% { transform: scale(.6) translateY(10px); opacity: 0; filter: blur(6px); } 100% { transform: none; opacity: 1; filter: none; } }

  /* ---------- Bottom sheet ---------- */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0 auto; max-width: 560px;
    padding: 10px 12px calc(var(--ax-safe-bottom) + 10px);
    border-radius: 24px 24px 0 0; border: 1px solid var(--ax-stroke-strong); border-bottom: 0;
    background: linear-gradient(180deg, rgba(30, 22, 62, .9), rgba(10, 8, 22, .97));
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 -18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
    transition: transform .55s cubic-bezier(.2, 1.1, .3, 1), opacity .3s ease; touch-action: manipulation; }
  .sheet::before { content: ""; position: absolute; left: 12%; right: 12%; top: -1px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--car), transparent); box-shadow: 0 0 14px var(--car); }
  .sheet.off { transform: translateY(115%); opacity: 0; pointer-events: none; }
  .topline { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .cond { flex: 1; min-width: 0; display: flex; align-items: center; gap: 7px; min-height: 44px; padding: 3px 9px; border-radius: 14px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); font-size: 12px; font-weight: 800; letter-spacing: .02em; line-height: 1.15; }
  .cond .ic { font-size: 20px; flex: none; }
  .cond .tx { min-width: 0; line-height: 1.15; }
  .cond .tx > span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cond .tx small { display: block; color: var(--ax-muted); font-weight: 700; font-size: 10.5px; letter-spacing: .02em; white-space: normal; line-height: 1.1; }
  .seg { display: flex; flex: none; border-radius: 14px; padding: 3px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); }
  .seg button { min-width: 74px; height: 38px; border: 0; border-radius: 11px; background: transparent; color: var(--ax-muted); font-weight: 900; font-size: 12px; letter-spacing: .08em; cursor: pointer; padding: 0 8px; }
  .seg button.on { background: linear-gradient(180deg, #ffd84a, #e8a300); color: #2a1300; box-shadow: 0 2px 10px rgba(255, 190, 40, .45); }
  .car-row { display: flex; align-items: stretch; gap: 8px; }
  .nav { width: 44px; flex: none; border-radius: 14px; border: 1px solid var(--ax-stroke-strong); background: rgba(255,255,255,.06); color: #fff;
    font-size: 26px; font-weight: 900; display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform .1s; }
  .nav:active { transform: scale(.9); background: rgba(255,255,255,.14); }
  .card { flex: 1; min-width: 0; border-radius: 16px; padding: 8px 10px; border: 1px solid color-mix(in srgb, var(--car) 55%, transparent);
    background: linear-gradient(135deg, color-mix(in srgb, var(--car) 20%, transparent), rgba(255,255,255,.03) 60%);
    box-shadow: inset 0 0 22px color-mix(in srgb, var(--car) 18%, transparent); }
  .card-h { display: flex; align-items: center; gap: 7px; }
  .card-h .n { font-family: var(--ax-display); font-size: 13px; background: #fff; color: #111; border-radius: 7px; padding: 2px 6px; box-shadow: 0 0 0 2px var(--car); }
  .card-h .nm { font-weight: 900; font-size: 16px; letter-spacing: .02em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .odds { text-align: right; line-height: 1; white-space: nowrap; }
  .odds b { font-family: var(--ax-display); font-weight: 400; font-size: 18px; color: var(--ax-gold); text-shadow: 0 0 12px rgba(255, 204, 51, .55); }
  .odds small { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .04em; color: var(--ax-muted); margin-top: 2px; }
  .odds b { font-size: 21px; }
  .odds.calc b { font-size: 13px; color: var(--ax-muted); text-shadow: none; animation: ax-pulse 1s ease-in-out infinite; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 8px; margin-top: 6px; }
  .stat { display: flex; flex-direction: column; gap: 3px; font-size: 9.5px; font-weight: 800; letter-spacing: .03em; color: var(--ax-muted); min-width: 0; white-space: nowrap; overflow: hidden; }
  .stat i { display: block; height: 6px; border-radius: 6px; background: rgba(255,255,255,.09); overflow: hidden; }
  .stat b { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--car), #fff); box-shadow: 0 0 8px var(--car); transition: width .5s cubic-bezier(.2, 1, .3, 1); }
  .formline { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 7px; font-size: 11.5px; font-weight: 800; color: var(--ax-muted); }
  .formline .gp { color: #fff; white-space: nowrap; }
  .formline .gp b { color: var(--ax-cyan); }
  .pills { display: inline-flex; gap: 3px; align-items: center; }
  .pills i { width: 19px; height: 19px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 900; color: #fff;
    background: rgba(255,255,255,.1); }
  .pills i.p1 { background: linear-gradient(180deg, #ffe27a, #e0a400); color: #2a1300; box-shadow: 0 0 8px rgba(255, 204, 51, .5); }
  .pills i.p2 { background: linear-gradient(180deg, #f2f5ff, #a9b4d6); color: #1b2238; }
  .pills i.p3 { background: linear-gradient(180deg, #ffc08a, #c06a2a); color: #2a1300; }
  .pills .tr { margin-left: 3px; font-size: 12px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 7px 0 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 9px; background: rgba(255,255,255,.2); transition: all .25s; }
  .dots i.on { width: 22px; background: var(--car); box-shadow: 0 0 10px var(--car); }
  .bet-row { display: flex; gap: 8px; align-items: stretch; }
  .step { width: 52px; flex: none; border-radius: 14px; border: 1px solid var(--ax-stroke-strong); background: rgba(255,255,255,.07); color: #fff; font-size: 28px; font-weight: 800; cursor: pointer; padding: 0; min-height: 48px; }
  .step:active { transform: scale(.92); }
  .betbox { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; padding: 3px 8px;
    border: 1px solid rgba(255, 204, 51, .45); background: linear-gradient(180deg, rgba(60, 40, 0, .55), rgba(20, 12, 0, .7)); }
  .betbox label { font-size: 10px; font-weight: 800; letter-spacing: .25em; color: #ffd76a; }
  .betbox .v { display: flex; align-items: baseline; gap: 4px; }
  #betInput { width: 100%; max-width: 160px; background: transparent; border: 0; outline: 0; color: #fff; font-family: var(--ax-display); font-size: 24px; text-align: right; padding: 0; font-variant-numeric: tabular-nums; }
  .betbox .eu { font-family: var(--ax-display); font-size: 18px; color: var(--ax-gold); }
  .chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .chip { height: 44px; border-radius: 999px; border: 2px dashed rgba(255,255,255,.35); color: #fff; font-weight: 900; font-size: 13px; cursor: pointer; padding: 0;
    background: radial-gradient(circle at 50% 35%, var(--c1), var(--c2)); box-shadow: 0 3px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.3); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .chip:active { transform: translateY(2px) scale(.95); }
  .chip.on { outline: 2px solid #fff; outline-offset: 2px; }
  .winline { display: flex; justify-content: space-between; align-items: center; margin: 8px 2px 8px; font-size: 13px; font-weight: 700; color: var(--ax-muted); }
  .winline b { font-family: var(--ax-display); font-weight: 400; font-size: 16px; color: var(--ax-green); text-shadow: 0 0 10px rgba(43, 255, 136, .5); }
  #startBtn { min-height: 56px; font-size: 18px; font-family: var(--ax-display); font-weight: 400; letter-spacing: .03em; }
  #startBtn .flag { font-size: 22px; }
  @media (max-height: 700px) {
    .topline { margin-bottom: 6px; }
    .stats { margin-top: 5px; } .formline { margin-top: 5px; } .dots { display: none; } .bet-row { margin-top: 7px; } .chips { margin-top: 6px; }
    .winline { margin: 6px 2px; } #startBtn { min-height: 50px; font-size: 16px; } #gTitle .name { font-size: 26px; } #gTitle .num { height: 36px; min-width: 36px; font-size: 18px; }
    #gTitle .tag { display: none; } .betbox label { display: none; }
  }
  @media (max-width: 380px) { .stat { font-size: 8.5px; letter-spacing: 0; } .card { padding: 7px 8px; } .nav { width: 40px; } .seg button { min-width: 64px; font-size: 11px; } .pills i { width: 17px; height: 17px; font-size: 10px; } }
  @media (min-width: 900px) and (min-aspect-ratio: 5/4) {
    .sheet { left: auto; right: 24px; bottom: 24px; width: 420px; border-radius: 24px; border-bottom: 1px solid var(--ax-stroke-strong); padding-bottom: 14px; }
    .sheet.off { transform: translateX(120%); }
    #gTitle { left: 24px; right: 468px; bottom: 34px; }
  }

  /* ---------- Race HUD ---------- */
  #raceHud { position: fixed; inset: 0; z-index: 25; pointer-events: none; transition: opacity .4s; }
  #raceHud.off { opacity: 0; }
  #tower { transition: opacity .4s; position: absolute; left: calc(var(--ax-safe-left) + 8px); top: calc(var(--ax-safe-top) + 62px); width: 148px; border-radius: 12px; overflow: hidden;
    background: rgba(8, 6, 20, .74); border: 1px solid rgba(255,255,255,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .tw-h { display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 6px 8px 5px; font-size: 10px; font-weight: 900; letter-spacing: .08em;
    background: linear-gradient(90deg, #ff2fb3, #8b5cff); color: #fff; }
  .tw-h span { white-space: nowrap; }
  .tw-prog { height: 3px; background: rgba(255,255,255,.12); }
  .tw-prog b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ax-cyan), #fff); box-shadow: 0 0 8px var(--ax-cyan); }
  .tw-rows { position: relative; height: calc(6 * 25px + 4px); }
  .tw-row { position: absolute; left: 4px; right: 4px; top: 2px; height: 23px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 4px; border-radius: 7px;
    font-size: 12px; font-weight: 800; transition: transform .45s cubic-bezier(.2, 1.1, .3, 1), background .3s; font-variant-numeric: tabular-nums; will-change: transform; }
  .tw-row .p { width: 16px; text-align: center; font-family: var(--ax-display); font-size: 12px; color: #fff; }
  .tw-row .c { width: 4px; height: 15px; border-radius: 3px; }
  .tw-row .cd { flex: 1; letter-spacing: .06em; }
  .tw-row .g { font-size: 10.5px; color: var(--ax-muted); font-weight: 700; }
  .tw-row.me { background: linear-gradient(90deg, rgba(255, 204, 51, .38), rgba(255, 204, 51, .08)); box-shadow: inset 0 0 0 1px rgba(255, 204, 51, .7); }
  .tw-row.me .cd { color: #ffe9a6; }
  .tw-row.flash { animation: rowflash .7s ease; }
  @keyframes rowflash { 0% { background: rgba(43, 255, 136, .7); } 100% { } }
  #camLabel { transition: opacity .4s; position: absolute; right: calc(var(--ax-safe-right) + 8px); top: calc(var(--ax-safe-top) + 62px); display: flex; align-items: center; gap: 6px;
    padding: 5px 9px; border-radius: 8px; background: rgba(8, 6, 20, .66); border: 1px solid rgba(255,255,255,.14); font-size: 10px; font-weight: 900; letter-spacing: .12em; color: #fff; }
  #camLabel i { width: 8px; height: 8px; border-radius: 50%; background: #ff3b5c; box-shadow: 0 0 8px #ff3b5c; animation: ax-blink 1s infinite; }
  #camLabel.cut { animation: camcut .35s ease; }
  @keyframes camcut { 0% { transform: translateX(14px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  #minimap { position: absolute; right: calc(var(--ax-safe-right) + 8px); top: calc(var(--ax-safe-top) + 92px); width: 132px; height: 82px; border-radius: 12px;
    background: rgba(8, 6, 20, .62); border: 1px solid rgba(255,255,255,.14); transition: opacity .4s; }
  #tapHint { position: absolute; right: calc(var(--ax-safe-right) + 10px); top: calc(var(--ax-safe-top) + 180px); font-size: 10px; font-weight: 700; color: rgba(255,255,255,.6); letter-spacing: .06em; transition: opacity .6s; text-align: right; text-shadow: 0 1px 4px #000; }
  #meTag { position: absolute; left: 0; top: 0; height: 30px; padding: 0 9px; display: none; align-items: center; gap: 4px; border-radius: 9px; pointer-events: none;
    background: #ffcc33; color: #2a1300; font-weight: 900; font-size: 13px; letter-spacing: .04em; box-shadow: 0 0 14px rgba(255, 204, 51, .7), 0 3px 8px rgba(0,0,0,.5); will-change: transform; white-space: nowrap; }
  #meTag::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #ffcc33; }
  #meTag.on { display: flex; }
  #lapBanner { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; }
  #lapBanner.go { animation: lapb 2.2s ease forwards; }
  #lapBanner b { display: inline-block; font-family: var(--ax-display); font-weight: 400; font-size: clamp(22px, 7vw, 34px); padding: 6px 18px; border-radius: 10px; color: #fff;
    background: linear-gradient(90deg, rgba(139,92,255,.92), rgba(34,228,255,.92)); box-shadow: 0 0 30px rgba(34,228,255,.5); transform: skewX(-8deg); }
  @keyframes lapb { 0% { opacity: 0; transform: scale(1.4); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
  #pstrip { position: absolute; left: calc(var(--ax-safe-left) + 8px); right: calc(var(--ax-safe-right) + 8px); bottom: calc(var(--ax-safe-bottom) + 10px);
    max-width: 580px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 7px 7px 7px 9px; border-radius: 18px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--car) 30%, rgba(8,6,20,.8)), rgba(8, 6, 20, .84)); border: 1px solid color-mix(in srgb, var(--car) 60%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 24px color-mix(in srgb, var(--car) 25%, transparent); pointer-events: auto; }
  .ps-pos { font-family: var(--ax-display); font-size: 28px; line-height: 1; min-width: 50px; text-align: center; color: #fff; text-shadow: 0 0 14px var(--car); }
  .ps-pos.up { animation: pup .6s ease; } .ps-pos.down { animation: pdown .6s ease; }
  @keyframes pup { 30% { transform: scale(1.35); color: var(--ax-green); } }
  @keyframes pdown { 30% { transform: scale(.85); color: var(--ax-red); } }
  .ps-info { flex: 1; min-width: 0; }
  .ps-name { font-weight: 900; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps-bet { font-size: 11.5px; color: var(--ax-muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps-bet b { color: var(--ax-gold); }
  .ps-speed { text-align: right; line-height: 1; min-width: 54px; }
  .ps-speed b { display: block; font-family: var(--ax-display); font-weight: 400; font-size: 21px; color: #fff; font-variant-numeric: tabular-nums; }
  .ps-speed span { font-size: 9px; font-weight: 900; letter-spacing: .1em; color: var(--ax-muted); white-space: nowrap; }
  .ps-speed span i { font-style: normal; color: var(--ax-cyan); }
  .hbtn { width: 46px; height: 46px; flex: none; border-radius: 14px; border: 1px solid var(--ax-stroke-strong); background: rgba(255,255,255,.08); color: #fff; font-weight: 900; font-size: 13px; cursor: pointer; padding: 0; line-height: 1; }
  .hbtn small { display: block; font-size: 8px; letter-spacing: .06em; color: var(--ax-muted); margin-top: 2px; font-weight: 800; }
  .hbtn.on { background: var(--ax-cyan); color: #00222e; box-shadow: 0 0 16px var(--ax-cyan); }
  .hbtn.on small { color: #00384a; }
  @media (max-width: 380px) { #tower { width: 136px; } .ps-pos { min-width: 42px; font-size: 24px; } .hbtn { width: 44px; } #minimap { width: 112px; height: 70px; } }

  /* ---------- Start lights ---------- */
  #lights { position: fixed; left: 0; right: 0; top: calc(var(--ax-safe-top) + 70px); z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; transition: opacity .3s, transform .4s cubic-bezier(.2,1.3,.3,1); }
  #lights.off { opacity: 0; transform: translateY(-30px); }
  .lt-box { display: flex; gap: 7px; padding: 9px 11px; border-radius: 14px; background: linear-gradient(180deg, #16121f, #050409); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 12px 30px rgba(0,0,0,.6); }
  .lt-col { display: flex; flex-direction: column; gap: 6px; padding: 5px; border-radius: 10px; background: #000; }
  .lt-col i { width: clamp(22px, 7vw, 34px); height: clamp(22px, 7vw, 34px); border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a0b12, #1a0306); transition: background .06s, box-shadow .06s; }
  .lt-col.on i { background: radial-gradient(circle at 40% 35%, #fff0f0, #ff2a3c 45%, #a00010); box-shadow: 0 0 18px #ff2a3c, 0 0 40px rgba(255, 30, 50, .6); }

<script type="module">

   ===================================================================== */
const CARS = [
  { name: 'Relámpago', code: 'REL', num: 1, color: '#22e4ff', accent: '#10131c', rim: '#d8f8ff', spd: 90, acc: 72, grip: 80 },
  { name: 'Fénix', code: 'FEN', num: 7, color: '#ff4a2e', accent: '#ffcc33', rim: '#ffcc33', spd: 84, acc: 88, grip: 70 },
  { name: 'Víbora', code: 'VIB', num: 13, color: '#2bff88', accent: '#0d1014', rim: '#9dffcf', spd: 80, acc: 78, grip: 90 },
  { name: 'Pantera', code: 'PAN', num: 23, color: '#ff2fb3', accent: '#f4f1ff', rim: '#ffffff', spd: 76, acc: 92, grip: 76 },
  { name: 'Cometa', code: 'COM', num: 44, color: '#ffcc33', accent: '#141414', rim: '#ffe9a6', spd: 79, acc: 70, grip: 84 },
  { name: 'Tifón', code: 'TIF', num: 88, color: '#8b5cff', accent: '#22e4ff', rim: '#22e4ff', spd: 82, acc: 74, grip: 74 },
];
const NCARS = CARS.length;
const SIM_CARS = CARS.map((c) => ({ spd: c.spd, acc: c.acc, grip: c.grip }));
const RTP = 1; // sin margen de la casa: retorno esperado de cada apuesta = 1
const MC_SIMS = 1500;
const STATS_VER = CARS.map((c) => c.spd + '.' + c.acc + '.' + c.grip).join('|');

/* =====================================================================

   ===================================================================== */
const T = buildCircuit();
const TN = T.N, TL = T.L, TDS = T.ds;
const SIM_TRACK = SIM.buildTrack({ length: T.sim.length, k: T.sim.k, step: T.sim.step });
const RACE_D = TL * LAPS;
const LAT_SCALE = HALF_W - 0.7; // lateral del simulador (±1 = bordes de pista) → metros
// Parrilla: se lee del propio simulador (posiciones en t = 0) para pintar las casillas donde salen los coches
const GRID_OFFSETS = (() => {
  const want = CARS.map((_, k) => ({ dist: -8 - GRID_STEP * k, lateral: k % 2 === 0 ? -0.36 : 0.36 }));
  try {
    const pr = SIM.createRace({ cars: SIM_CARS, track: SIM_TRACK, laps: LAPS, grid: CARS.map((_, i) => i), cond: SIM.rollConditions(() => 0.01), form: CARS.map(() => 3), seed: 1, gridOffsets: want });
    return CARS.map((_, k) => ({ dist: pr.cars[k].dist, lateral: pr.cars[k].lateral }));

function trackAt(s, o = TP) {

  o.x = T.x[i] + (T.x[j] - T.x[i]) * f; o.y = T.y[i] + (T.y[j] - T.y[i]) * f; o.z = T.z[i] + (T.z[j] - T.z[i]) * f;
  let tx = T.tx[i] + (T.tx[j] - T.tx[i]) * f, tz = T.tz[i] + (T.tz[j] - T.tz[i]) * f; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
  o.tx = tx; o.tz = tz; o.nx = tz; o.nz = -tx; o.k = T.k[i]; o.sl = T.slope[i]; o.i = i;
  return o;
}
const yawAt = (o) => Math.atan2(o.tx, o.tz);
// Distancia de los muros a cada lado (L = +lateral / izquierda, R = −lateral / derecha)
const WALL_L = new Float32Array(TN), WALL_R = new Float32Array(TN);
{
  const inL = new Float32Array(TN), inR = new Float32Array(TN);
  for (let i = 0; i < TN; i++) { const k = T.k[i]; inL[i] = k < -1 / 200 ? 1 : 0; inR[i] = k > 1 / 200 ? 1 : 0; }
  const gs = (a, sig) => { const n = a.length, R = Math.ceil(sig * 2.5), o = new Float32Array(n); for (let i = 0; i < n; i++) { let acc = 0, ws = 0; for (let k = -R; k <= R; k += 2) { const w = Math.exp(-(k * k) / (2 * sig * sig)); acc += a[(i + k + n) % n] * w; ws += w; } o[i] = acc / ws; } return o; };
  const sL = gs(inL, 22), sR = gs(inR, 22);
  for (let i = 0; i < TN; i++) {
    let wl = 12 + 15 * Math.min(1, sL[i] * 1.6), wr = 12 + 15 * Math.min(1, sR[i] * 1.6);
    const k = T.k[i];

    if (k < -0.002) wr = Math.min(wr, 0.8 / -k);

    if (s > T.meta.tunnel[0] - 20 && s < T.meta.tunnel[1] + 20) { wl = 11; wr = 11; }
    WALL_L[i] = Math.max(10.5, wl); WALL_R[i] = Math.max(10.5, wr);
  }
}
function wallAt(side, s) { let u = s / TDS; u -= Math.floor(u / TN) * TN; const i = u | 0, f = u - i, j = (i + 1) % TN; const A = side > 0 ? WALL_L : WALL_R; return A[i % TN] + (A[j] - A[i % TN]) * f; }

   ===================================================================== */
const stage = $('#stage');

const PSCALE = { value: 400 };

function buildMinimap() {

  mm.ox = W / 2 - ((x0 + x1) / 2) * mm.sx; mm.oz = H / 2 - ((z0 + z1) / 2) * mm.sx;
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;

  const path = () => { x.beginPath(); for (let i = 0; i <= TN; i += 6) { const j = i % TN; const px = T.x[j] * mm.sx + mm.ox, pz = T.z[j] * mm.sx + mm.oz; i ? x.lineTo(px, pz) : x.moveTo(px, pz); } x.closePath(); };

}

}

  $('#ffBtn').firstChild.textContent = '×' + userSpeed;
  $('#ffBtn').classList.toggle('on', userSpeed > 1);
  AX.sfx.play('tap'); AX.haptic('light');
});
function setCamMode(m, silent) {
  director.mode = m;
  $('#camMode').textContent = CAM_MODE_TXT[m];
  $('#camBtn').classList.toggle('on', m !== 'auto');
  if (!silent && state === 'race' && shot.type !== 'start' && shot.type !== 'finish') { if (m === 'auto') director.next(); else director.applyMode(); }
}
$('#camBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  setCamMode(CAM_MODES[(CAM_MODES.indexOf(director.mode) + 1) % CAM_MODES.length]);
  AX.sfx.play('click'); AX.haptic('light');
  $('#tapHint').style.opacity = 0;
});

/* =====================================================================
   LÍNEAS DE VELOCIDAD (2D)
   ===================================================================== */
const sl = $('#speedlines'), slx = sl.getContext('2d');
const SL = Array.from({ length: 40 }, () => ({ a: Math.random() * Math.PI * 2, r: Math.random(), sp: rand(0.8, 1.6), w: rand(0.6, 2.2) }));
let slOn = false;
function resizeSL() { const d = Math.min(1.5, devicePixelRatio || 1); sl.width = innerWidth * d; sl.height = innerHeight * d; slx.setTransform(d, 0, 0, d, 0, 0); }
function drawSpeedLines(dt) {
  let k = 0;
  if ((state === 'race' || state === 'finish') && SPEEDLINE_K[shot.type] && shot.target != null) {
    const c = cars[shot.target];
    k = SPEEDLINE_K[shot.type] * clamp((c.v - 55) / 30, 0, 1) * (timeScale < 0.6 ? 0.3 : 1);
  }
  if (k <= 0.02) { if (slOn) { slx.clearRect(0, 0, innerWidth, innerHeight); slOn = false; } return; }
  slOn = true;
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H * 0.46, R = Math.hypot(W, H) * 0.6;
  slx.clearRect(0, 0, W, H);
  slx.lineCap = 'round';
  for (const p of SL) {
    p.r += dt * p.sp * 2.4;
    if (p.r > 1) { p.r = 0.25 + Math.random() * 0.2; p.a = Math.random() * Math.PI * 2; }
    const r1 = R * p.r, r2 = r1 + R * 0.22 * p.sp;
    slx.strokeStyle = `rgba(255,255,255,${(k * 0.6 * (p.r - 0.25)) / 0.75})`;
    slx.lineWidth = p.w;
    slx.beginPath(); slx.moveTo(cx + Math.cos(p.a) * r1, cy + Math.sin(p.a) * r1); slx.lineTo(cx + Math.cos(p.a) * r2, cy + Math.sin(p.a) * r2); slx.stroke();
  }
}

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
let last = performance.now(), rafId = 0, running = false;
const perf = { ema: 16.7, acc: 0, frames: 0, steps: 0, ms: [], drawCalls: 0, tris: 0, upAcc: 0 };
function frame(now) {
  rafId = requestAnimationFrame(frame);
  const rawDt = (now - last) / 1000;
  const dt = Math.min(0.1, Math.max(0.0001, rawDt));
  last = now;
  TIME.value += dt;
  updateTweens(now);
  timeScale = lerp(timeScale, timeScaleTarget, damp(timeScaleTarget < timeScale ? 10 : 3, dt));
  const simDt = dt * timeScale * userSpeed * DEBUG.speed;

  if ((state === 'race' || state === 'finish') && race.sim) {
    stepRace(simDt, dt);
    handleEvents();
    director.update();
    // foto-finish: cámara lenta si el final va a estar apretado
    if (state === 'race' && !race.slowmo && race.lap === LAPS) {
      const Lc = cars[race.order[0]];
      if (RACE_D - Lc.s < 70 && race.order.length > 1 && race.gaps[race.order[1]] < 0.25) {
        race.slowmo = true; timeScaleTarget = 0.22;
        AX.fx.slowmo(2400);
        const st = AX.el('div', '', 'FOTO FINISH'); st.id = 'slowTag'; document.body.appendChild(st);
        setTimeout(() => st.remove(), 2600);
        AX.sfx.play('riser');
      }
    }
    if (state === 'race' || state === 'finish') updateRaceHud();
    perf.upAcc += dt; if (perf.upAcc > 1 / 20 && mm.ctx) { perf.upAcc = 0; drawMinimap(); }
    const mine = cars[stake.car];
    updateMeTag(state === 'race' ? mine : null, 'P' + (race.order.indexOf(stake.car) + 1));
    cars.forEach((c) => (c.fx.visible = !((shot.type === 'onboard' || shot.type === 'tcam') && shot.target === c.i)));
  } else if (state === 'lights' && stake) {
    const mine = cars[stake.car];
    updateMeTag(mine, 'P' + (market.grid.indexOf(stake.car) + 1));
    cars.forEach((c, i) => { c.chassis.position.y = Math.sin(now * 0.05 + i * 2) * 0.012; c.vel.set(0, 0, 0); c.gear = 1; });
  } else if (state === 'garage' || state === 'boot' || state === 'toGrid') {
    TT_SPIN.rotation.y += dt * 0.32;
    const c = garage.current >= 0 ? cars[garage.current] : null;
    if (c) {
      c.chassis.position.y = Math.sin(now * 0.04) * 0.006;
      c.vel.set(0, 0, 0);
    }
  }
  ringFlash *= Math.pow(0.05, dt);
  ttRing.scale.setScalar(1 + ringFlash * 0.08);

  updateShot(dt);
  applyCamera(dt);
  updateCarInstances();
  sparks.update(dt * Math.max(0.25, timeScale));
  smoke.update(dt * Math.max(0.25, timeScale));
  rain.update(dt, camera.position);
  drawSpeedLines(dt);
  AUD.update(dt, (state === 'race' || state === 'finish' || state === 'lights') ? 'race' : 'silent');

  renderer.info.reset();
  if (composer) composer.render(dt); else renderer.render(scene, camera);
  perf.drawCalls = renderer.info.render.calls; perf.tris = renderer.info.render.triangles;
  governor(rawDt);
}
// Regulador de calidad: si el tiempo de fotograma sube, baja la resolución (y el bloom en modo automático)
const GOV = params.get('gov') !== '0';
function governor(rawDt) {
  if (state === 'boot' || rawDt > 0.5) return;
  if (!GOV) { perf.ema = perf.ema * 0.95 + rawDt * 50; perf.ms.push(rawDt * 1000); if (perf.ms.length > 240) perf.ms.shift(); return; }
  const ms = rawDt * 1000;
  perf.ema = perf.ema * 0.95 + ms * 0.05;
  perf.ms.push(ms); if (perf.ms.length > 240) perf.ms.shift();
  perf.acc += rawDt;
  if (perf.acc < 2) return;
  perf.acc = 0;
  if (perf.ema > 24 && perf.steps < 6) {
    perf.steps++;
    if (Q.bloom && composer && !forcedQ) disableBloom();
    else if (pixelRatio > Q.minDpr + 0.01) { pixelRatio = Math.max(Q.minDpr, pixelRatio * 0.85); renderer.setPixelRatio(pixelRatio); onResize(); }
  } else if (perf.ema < 12 && pixelRatio < Math.min(devicePixelRatio || 1, Q.dpr) - 0.05 && perf.steps > 0) {
    pixelRatio = Math.min(Math.min(devicePixelRatio || 1, Q.dpr), pixelRatio * 1.1); renderer.setPixelRatio(pixelRatio); onResize();
  }
}
function start() { if (running) return; running = true; last = performance.now(); rafId = requestAnimationFrame(frame); }
function stop() { running = false; cancelAnimationFrame(rafId); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stop(); AUD.call('suspend'); }
  else { start(); AUD.call('resume'); }
});
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  if (composer) { composer.setPixelRatio(pixelRatio); composer.setSize(innerWidth, innerHeight); }
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  resizeSL();
  if (state === 'garage') { sheetHeight(); computeViewOffset(); }
}
addEventListener('resize', onResize);
resizeSL();

// Salir: si hay carrera en marcha se avisa; la carrera se termina de simular y se liquida igual
window.__cochesOnBack = async () => {
  if (stake && !stake.settled && (state === 'toGrid' || state === 'lights' || state === 'race' || state === 'finish')) {
    const ok = await AX.confirm('¿Salir de la carrera?', `Tu apuesta de <b>${AX.money(stake.bet)}</b> sigue en juego: la carrera se completa sin ti y, si aciertas, cobrarás <b>${AX.money(stake.payout)}</b>.`, 'Salir', 'Seguir viendo');
    if (!ok) return false;
  }
  if (stake && !stake.settled && race.sim) settle();
  if (stake && stake.pendingShow) { stake.pendingShow = false; hud.setBalance(AX.getBalance(), false); }
  return true;
};

/* =====================================================================
   ARRANQUE
   ===================================================================== */
async function boot() {
  settleLeftover();
  market = restoreMarket() || newMarket(history);
  cars.forEach((c, i) => parkOnGrid(c, market.grid.indexOf(i)));
  putOnTurntable(sel, false);
  spot.position.set(TT_POS.x, 7, TT_POS.z + 2);
  spot.intensity = 9;
  renderCard();
  setBet(Math.min(bet, Math.max(1, AX.getBalance())));
  garageJumbo();
  await setupBloom();
  try { renderer.compile(scene, camera); } catch (e) {}
  shot = { type: 'manual' };
  CAM.pos.set(-260, 150, -140); CAM.look.set(0, 0, 120); CAM.fov = 50;
  updateCarInstances();
  start();
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(r))));
  window.__cochesReady = true;
  $('#boot').classList.add('hide');
  setTimeout(() => $('#boot').remove(), 600);
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('400 40px Bungee'), document.fonts.load('800 20px Outfit')]).then(redrawFontTextures).catch(() => {});
  const intro = AX.cine.intro({ title: 'Gran Premio Neón', subtitle: 'Apuesta · Acelera · Gana', icon: '🏎️', color: '#ff2fb3', once: true });
  const p0 = CAM.pos.clone(), l0 = CAM.look.clone(), p1 = new THREE.Vector3(140, 85, -150), l1 = trackAt(0, {});
  const lEnd = new THREE.Vector3(l1.x, 8, l1.z);
  tween(3200, (k) => { CAM.pos.lerpVectors(p0, p1, k); CAM.look.lerpVectors(l0, lEnd, k); }, (t) => t);
  await intro;
  state = 'garage';
  computeViewOffset();
  const a0 = CAM.pos.clone(), b0 = CAM.look.clone();
  const r = garage.r;
  const end = new THREE.Vector3(TT_POS.x + Math.sin(garage.ang) * r, 2.2, TT_POS.z + Math.cos(garage.ang) * r);
  const curve = new THREE.CatmullRomCurve3([a0, new THREE.Vector3(60, 40, 10), new THREE.Vector3(TT_POS.x + 10, 8, TT_POS.z + 22), end]);
  const lookEnd = new THREE.Vector3(TT_POS.x, 0.85, TT_POS.z);
  const f0 = CAM.fov, f1 = fitFov(r, 5.4, 2.2, 0.62);
  AX.sfx.play('whoosh');
  await tween(2200, (k) => { curve.getPoint(k, CAM.pos); CAM.look.copy(b0).lerp(lookEnd, AX.ease.inOutCubic(k)); CAM.fov = lerp(f0, f1, k); }, AX.ease.inOutCubic);
  cut('garage');
  showGarageUI(true);
  renderBet();
  AX.sfx.play('swoosh');
  AUD.setIdle(0.5); AUD.setCrowd(0.12); AUD.call('rev', 0.6);
}
const _proj = new THREE.Vector3();
DEBUG.get = () => {
  let subj = null;
  if (shot.type === 'start') { packCenter(_proj); subj = _proj.clone(); } else if (shot.target != null) subj = cars[shot.target].pos.clone();
  let inFrame = null;
  if (subj) { _proj.copy(subj).project(camera); inFrame = Math.abs(_proj.x) < 1 && Math.abs(_proj.y) < 1 && _proj.z < 1; }
  return {
    calls: perf.drawCalls, tris: perf.tris, state, sel, bet, betKind, shot: shot.type, camMode: director.mode, tier: TIER, bloom: !!composer, pixelRatio,
    t: race.t, winner: race.winner, order: race.order.slice(), photo: race.photo, stake: stake && Object.assign({}, stake),
    cam: camera.position.toArray(), inFrame, marketReady: !!(market && market.ready), odds: market && market.ready ? { win: market.oddsWin, pod: market.oddsPodium, pWin: market.pWin, pPod: market.pPodium } : null,
    grid: market && market.grid, cond: market && market.cond, mcPath, mcMs: market && market.mcMs, frameMs: perf.ema, lapLen: TL, raceD: RACE_D, tvCams: TV_CAMS.length, crowd: CROWD.length,
    audio: AUD.ra ? Object.assign({}, AUD.ra.stats, { voiceCar: Array.from(AUD.ra.stats.voiceCar || []) }) : null,
    msP50: perf.ms.slice().sort((a, b) => a - b)[Math.floor(perf.ms.length / 2)] || 0,
  };
};
DEBUG.scene = scene; DEBUG.THREE = THREE; DEBUG.camera = camera; DEBUG.garage = garage; DEBUG.race = race; DEBUG.renderer = renderer;
DEBUG.select = (i) => { if (state === 'garage') { sel = i; putOnTurntable(sel, false); renderCard(); } };
DEBUG.setCam = (m) => setCamMode(m);
DEBUG.view = (p, l, fov = 50) => { shot = { type: 'manual' }; CAM.pos.set(p[0], p[1], p[2]); CAM.look.set(l[0], l[1], l[2]); CAM.fov = fov; };
DEBUG.trackAt = (s, lat = 0, h = 0) => { const o = trackAt(s, {}); return [o.x + o.nx * lat, o.y + h, o.z + o.nz * lat]; };
DEBUG.cut = (type, target) => { const o = director.shotFor(type, target != null ? target : stake ? stake.car : 0); if (o) cut(type, o); return !!o; };
boot();
</script>
