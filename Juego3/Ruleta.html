<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Ruleta Europea</title>
<link rel="stylesheet" href="../shared/arcade.css">
<style>
  :root {
    --hud: calc(58px + var(--ax-safe-top));
    --line: rgba(255, 214, 120, 0.42);
    --felt-a: #0f6a4b;
    --felt-b: #06392a;
    --felt-c: #03251b;
  }

  /* ------------------------------------------------------------ LAYOUT */
  #app {
    position: absolute;
    top: var(--hud);
    bottom: 0;
    left: 0;
    right: 0;
    margin: 0 auto;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 2px calc(10px + var(--ax-safe-right)) 0 calc(10px + var(--ax-safe-left));
  }

  #stage {
    flex: none;
    height: clamp(124px, calc(100dvh - var(--hud) - var(--ax-safe-bottom) - 636px), 330px);
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  #wheelSlot {
    position: relative;
    height: 100%;
    aspect-ratio: 1 / 1;
    flex: none;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle, rgba(255, 47, 179, 0.18) 0%, rgba(139, 92, 255, 0.12) 55%, transparent 72%);
  }
  #wheelSlot::after {
    content: "";
    position: absolute;
    inset: -6%;
    border-radius: 50%;
    box-shadow: 0 0 32px rgba(255, 204, 51, 0.18), 0 0 60px rgba(255, 47, 179, 0.15);
    pointer-events: none;
  }
  .slot-hint {
    position: absolute;
    left: 50%;
    bottom: 2px;
    transform: translate(-50%, 0);
    z-index: 801;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #ffe9a6;
    background: rgba(20, 12, 0, 0.85);
    border: 1px solid rgba(255, 204, 51, 0.5);
    padding: 2px 8px;
    border-radius: 99px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  body.has-bets:not(.spinning) .slot-hint { opacity: 1; animation: ax-blink 1.6s ease-in-out infinite; }

  #info {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 7px;
    padding: 8px 10px;
    cursor: pointer;
    overflow: hidden;
  }
  .last-row { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .last-txt { min-width: 0; }
  .last-k { font-size: 9px; letter-spacing: 0.22em; font-weight: 800; color: var(--ax-muted); text-transform: uppercase; }
  .last-d { font-size: 12px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip { display: flex; gap: 3px; overflow: hidden; min-height: 20px; align-items: center; -webkit-mask: linear-gradient(90deg, #000 80%, transparent); mask: linear-gradient(90deg, #000 80%, transparent); }
  .strip .badge, .hc .badge { width: 20px; height: 20px; font-size: 8.5px; }
  .strip .empty { font-size: 11px; color: var(--ax-muted); }
  .hc { display: flex; align-items: center; gap: 3px; min-height: 20px; overflow: hidden; }
  .hc .lbl { font-size: 13px; width: 16px; text-align: center; flex: none; }
  .hc .sep { flex: 1; min-width: 4px; }
  .rb { display: flex; height: 6px; border-radius: 9px; overflow: hidden; background: rgba(255, 255, 255, 0.08); }
  .rb i { display: block; height: 100%; transition: width 0.6s ease; }
  .rb .r { background: linear-gradient(90deg, #ff4d6a, #c8102e); }
  .rb .z { background: #19c16f; }
  .rb .b { background: linear-gradient(90deg, #3a3650, #14121f); }
  .rb-legend { display: flex; justify-content: space-between; font-size: 9px; font-weight: 800; color: var(--ax-muted); margin-top: -3px; }

  .badge {
    flex: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--ax-display);
    font-size: 9px;
    color: #fff;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 220, 140, 0.35);
  }
  .badge.r { background: radial-gradient(circle at 35% 30%, #ff6b80, #c8102e 60%, #7a0619); }
  .badge.b { background: radial-gradient(circle at 35% 30%, #4a4562, #15131f 60%, #050408); }
  .badge.z { background: radial-gradient(circle at 35% 30%, #5dffb0, #0f9d58 60%, #05502b); }
  .badge.big { width: 42px; height: 42px; font-size: 16px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35), 0 0 0 2px rgba(255, 214, 120, 0.8), 0 0 16px rgba(255, 204, 51, 0.45); }
  .badge.big.none { background: rgba(255, 255, 255, 0.06); color: var(--ax-muted); }
  .badge.fresh { animation: badgeIn 0.6s cubic-bezier(0.2, 1.5, 0.4, 1) both; }
  .badge.hot { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 0 0 1px #ff9f1c, 0 0 8px rgba(255, 120, 30, 0.7); }
  .badge.cold { box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.35), 0 0 0 1px #22e4ff, 0 0 8px rgba(34, 228, 255, 0.6); }
  @keyframes badgeIn { from { transform: scale(0) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ------------------------------------------------------------- MESA */
  #tableWrap {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    border-radius: 18px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #tableWrap::-webkit-scrollbar { display: none; }

  #table {
    position: relative;
    min-height: 100%;
    display: grid;
    grid-template-columns: 46px 36px repeat(3, minmax(0, 1fr));
    grid-template-rows: 34px repeat(12, minmax(32px, 1fr)) 30px;
    gap: 2px;
    padding: 6px;
    border-radius: 18px;
    background:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.012) 0 2px, transparent 2px 5px),
      radial-gradient(130% 70% at 50% 0%, var(--felt-a), var(--felt-b) 60%, var(--felt-c));
    border: 1px solid rgba(255, 214, 120, 0.5);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.55), inset 0 0 0 3px rgba(0, 0, 0, 0.25), 0 0 0 3px #2a1206, 0 0 0 4px rgba(255, 204, 51, 0.35), 0 0 30px rgba(43, 255, 136, 0.12);
  }
  #table.lose { animation: tableLose 0.7s ease; }
  @keyframes tableLose {
    0%, 100% { box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.55), 0 0 0 3px #2a1206, 0 0 0 4px rgba(255, 204, 51, 0.35); transform: none; }
    15% { transform: translateX(-6px); }
    30% { box-shadow: inset 0 0 80px rgba(255, 0, 40, 0.6), 0 0 0 3px #2a1206, 0 0 30px 4px rgba(255, 59, 92, 0.7); transform: translateX(5px); }
    45% { transform: translateX(-3px); }
    60% { transform: translateX(2px); }
  }

  .cell {
    position: relative;
    margin: 0;
    padding: 0 0 0 0;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.035);
    color: #fff;
    font-family: var(--ax-display);
    font-size: 15px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
    transition: transform 0.1s ease, filter 0.2s ease, box-shadow 0.25s ease, opacity 0.25s;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .cell:active { transform: scale(0.95); filter: brightness(1.35); }
  .cell.n { padding-right: 22px; }
  .cell.r { background: linear-gradient(180deg, #e62e48, #a10e27); border-color: rgba(255, 190, 150, 0.45); }
  .cell.b { background: linear-gradient(180deg, #2c2942, #0d0b17); }
  .cell.zero {
    background: linear-gradient(180deg, #22d07c, #077a40);
    border-radius: 50% 50% 8px 8px / 100% 100% 8px 8px;
    padding-right: 0;
    font-size: 17px;
  }
  .cell.out { font-family: var(--ax-font); font-weight: 900; font-size: 11px; letter-spacing: 0.02em; flex-direction: column; gap: 3px; }
  .cell.out small { font-size: 8px; font-weight: 800; color: rgba(255, 255, 255, 0.6); letter-spacing: 0.08em; }
  .cell.doz { font-family: var(--ax-font); font-weight: 900; font-size: 11px; letter-spacing: 0.12em; padding-bottom: 12px; }
  .cell.doz span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  .cell.col { font-size: 12px; }
  .cell.col .stk { right: 4px; }
  .diamond { width: 18px; height: 18px; transform: rotate(45deg); border-radius: 3px; border: 1px solid rgba(255, 230, 170, 0.7); }
  .diamond.r { background: linear-gradient(135deg, #ff5a72, #b30f2b); box-shadow: 0 0 10px rgba(255, 40, 80, 0.6); }
  .diamond.b { background: linear-gradient(135deg, #4a4562, #0b0a12); box-shadow: 0 0 8px rgba(0, 0, 0, 0.8); }
  .deco {
    border: 1px dashed rgba(255, 214, 120, 0.25);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 233, 166, 0.75);
    text-align: center;
    line-height: 1.2;
    padding: 0 2px;
    pointer-events: none;
  }
  .deco b { font-size: 12px; letter-spacing: 0; color: #fff; font-family: var(--ax-font); font-weight: 900; }

  /* Estados de la mesa */
  .cell.cover { filter: brightness(1.45); box-shadow: 0 0 0 1px #fff3b0, 0 0 12px rgba(255, 220, 120, 0.7); }
  #table.result .cell:not(.lit) { filter: brightness(0.5) saturate(0.6); }
  .cell.lit { box-shadow: 0 0 0 1px rgba(255, 236, 170, 0.95), 0 0 12px rgba(255, 204, 51, 0.55); z-index: 1; }
  .cell.won { z-index: 2; animation: wonPulse 0.55s ease-in-out infinite alternate; }
  @keyframes wonPulse {
    from { box-shadow: 0 0 0 2px #ffe680, 0 0 14px rgba(255, 204, 51, 0.8); filter: brightness(1.15); }
    to { box-shadow: 0 0 0 3px #fff, 0 0 30px rgba(255, 204, 51, 1), 0 0 50px rgba(255, 159, 28, 0.6); filter: brightness(1.45); }
  }
  .cell.hit { z-index: 3; box-shadow: 0 0 0 2px #fff, 0 0 18px #fff, 0 0 36px rgba(255, 204, 51, 0.9); filter: brightness(1.3); }
  .dolly {
    position: absolute;
    left: calc((100% - 22px) / 2 - 7px);
    top: -13px;
    width: 14px;
    height: 20px;
    z-index: 4;
    pointer-events: none;
    animation: dollyDrop 0.55s cubic-bezier(0.3, 1.6, 0.5, 1) both;
  }
  .dolly::before {
    content: "";
    position: absolute;
    left: 2px;
    right: 2px;
    bottom: 0;
    height: 9px;
    border-radius: 3px 3px 5px 5px;
    background: linear-gradient(90deg, rgba(220, 240, 255, 0.7), #fff, rgba(200, 225, 255, 0.6));
    box-shadow: 0 0 8px #fff;
  }
  .dolly::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0;
    width: 10px;
    height: 10px;
    margin-left: -5px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #cfe6ff 60%, #8fb6e6);
    box-shadow: 0 0 10px #fff;
  }
  @keyframes dollyDrop { from { transform: translateY(-60px) scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Pilas de fichas */
  .stk { position: absolute; right: 5px; top: 50%; width: 24px; height: 24px; margin-top: -12px; pointer-events: none; z-index: 2; }
  .cell.doz .stk { right: auto; left: 50%; margin-left: -12px; top: auto; bottom: 3px; margin-top: 0; }
  .cell.out .stk { right: -4px; top: auto; bottom: -3px; margin-top: 0; }
  .cell.has { z-index: 2; }
  .cell.zero .stk { right: 14%; }
  .cell.zero .dolly { left: calc(50% - 7px); }
  .stk .chip { position: absolute; left: 0; --s: 24px; font-size: 8.5px; }
  .stk.pop { animation: stkPop 0.32s cubic-bezier(0.2, 1.6, 0.4, 1); }
  @keyframes stkPop { 0% { transform: translateY(-10px) scale(1.35); } 100% { transform: none; } }

  /* --------------------------------------------------------- FICHAS */
  .chip {
    --s: 40px;
    --c: #e8e6f0;
    --st: #fff;
    position: relative;
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--ax-font);
    font-weight: 900;
    font-size: calc(var(--s) * 0.3);
    letter-spacing: -0.03em;
    color: #fff;
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
    background:
      radial-gradient(circle, var(--c) 0 54%, rgba(0, 0, 0, 0.28) 55%, var(--c) 58%, transparent 59%),
      repeating-conic-gradient(from 7deg, var(--c) 0 30deg, var(--st) 30deg 45deg);
    box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, 0.3), inset 0 2px 1px rgba(255, 255, 255, 0.4), inset 0 -2px 2px rgba(0, 0, 0, 0.3), 0 2px 0 rgba(0, 0, 0, 0.5), 0 4px 8px rgba(0, 0, 0, 0.45);
  }
  .chip::before { content: ""; position: absolute; inset: 21%; border-radius: 50%; border: 1px dashed rgba(255, 255, 255, 0.55); }
  .chip.c1 { --c: #ecebf4; --st: #5e5a7e; color: #2a2740; text-shadow: none; }
  .chip.c1::before, .chip.c1000::before { border-color: rgba(0, 0, 0, 0.3); }
  .chip.c5 { --c: #d91f3d; --st: #fff; }
  .chip.c25 { --c: #0fa15a; --st: #fff; }
  .chip.c100 { --c: #1d1a2c; --st: #ffcc33; color: #ffe9a6; }
  .chip.c500 { --c: #7a3cff; --st: #efe6ff; }
  .chip.c1000 { --c: #ffb51f; --st: #7a3d00; color: #3a1d00; text-shadow: none; }
  .chip.c5000 { --c: #0bb5d6; --st: #eafdff; }
  .chip.fly { position: fixed; left: 0; top: 0; z-index: 850; pointer-events: none; --s: 30px; will-change: transform; }

  /* ------------------------------------------------------ BARRA INFERIOR */
  #bar { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 2px 0 calc(var(--ax-safe-bottom) + 10px); }
  #chips { display: flex; justify-content: space-between; align-items: center; gap: 3px; padding: 4px 2px 0; }
  .chipBtn {
    --s: min(46px, calc((100vw - 52px) / 7.3));
    padding: 0;
    border: 0;
    background: none;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.2, 1.5, 0.4, 1), filter 0.2s;
    filter: saturate(0.75) brightness(0.85);
  }
  .chipBtn .chip { --s: inherit; width: var(--s); height: var(--s); }
  .chipBtn.sel { transform: translateY(-5px) scale(1.1); filter: none; }
  .chipBtn.sel .chip { box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(255, 204, 51, 0.9), 0 0 18px rgba(255, 204, 51, 0.8), 0 6px 10px rgba(0, 0, 0, 0.5); }
  .chipBtn:disabled { opacity: 0.35; filter: grayscale(1); }
  #actions { display: flex; gap: 6px; align-items: stretch; }
  .act { width: 50px; min-height: 52px; padding: 0; flex: none; flex-direction: column; gap: 2px; font-size: 9px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 14px; }
  .act svg { width: 20px; height: 20px; }
  .act b { font-family: var(--ax-display); font-weight: 400; font-size: 17px; line-height: 20px; }
  #spinBtn { flex: 1; min-width: 0; min-height: 52px; flex-direction: column; gap: 0; padding: 0 10px; }
  #spinBtn .sp-main { font-family: var(--ax-display); font-weight: 400; font-size: 20px; letter-spacing: 0.06em; line-height: 1.05; }
  #spinBtn .sp-sub { font-size: 11px; font-weight: 800; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  body.has-bets:not(.spinning) #spinBtn { animation: spinGlow 1.4s ease-in-out infinite; }
  @keyframes spinGlow {
    0%, 100% { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55), 0 6px 0 #8a4b00, 0 10px 28px rgba(255, 160, 0, 0.35); }
    50% { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55), 0 6px 0 #8a4b00, 0 0 34px rgba(255, 204, 51, 0.85); }
  }
  #bar.nudge { animation: nudge 0.4s ease; }
  @keyframes nudge { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }

  /* ----------------------------------------------------- CANVAS / ESCENA */
  #wheelCv { position: fixed; left: 0; top: 0; z-index: 800; pointer-events: none; }
  #backdrop {
    position: fixed;
    inset: 0;
    z-index: 790;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.6s ease, visibility 0s linear 0.6s;
    background:
      radial-gradient(60% 45% at 50% var(--by, 50%), rgba(255, 190, 60, 0.16), transparent 70%),
      radial-gradient(120% 80% at 50% var(--by, 50%), rgba(40, 18, 70, 0.75), rgba(3, 2, 8, 0.97) 70%);
  }
  #backdrop.on { opacity: 1; visibility: visible; transition: opacity 0.6s ease; }
  #backdrop::before {
    content: "";
    position: absolute;
    left: 50%;
    top: var(--by, 50%);
    width: 200vmax;
    height: 200vmax;
    margin: -100vmax 0 0 -100vmax;
    background: repeating-conic-gradient(from 0deg, rgba(255, 210, 63, 0.05) 0 6deg, transparent 6deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 0, transparent 45%);
    mask: radial-gradient(circle, #000 0, transparent 45%);
    animation: ax-spin 40s linear infinite;
  }
  #spinInfo {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(var(--ax-safe-bottom) + 22px);
    z-index: 810;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s, transform 0.4s;
  }
  body.spinning #spinInfo { opacity: 1; transform: none; }
  #spinInfo .si-bet { font-family: var(--ax-display); font-size: 18px; color: #ffe9a6; text-shadow: 0 0 14px rgba(255, 190, 40, 0.7); }
  #spinInfo .si-hint { margin-top: 4px; font-size: 10px; letter-spacing: 0.24em; font-weight: 800; text-transform: uppercase; color: rgba(255, 255, 255, 0.5); animation: ax-blink 1.6s ease-in-out infinite; }
  body.turbo #spinInfo .si-hint { color: var(--ax-cyan); animation: none; opacity: 1; }

  /* --------------------------------------------------------- REVELACIÓN */
  #reveal {
    position: fixed;
    inset: 0;
    z-index: 2050;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    pointer-events: none;
    visibility: hidden;
  }
  #reveal.show { visibility: visible; }
  #reveal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 48%, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.2) 45%, transparent 70%);
  }
  .rv-rays {
    position: absolute;
    left: 50%;
    top: 48%;
    width: 200vmax;
    height: 200vmax;
    margin: -100vmax 0 0 -100vmax;
    background: repeating-conic-gradient(from 0deg, var(--rv-ray) 0 7deg, transparent 7deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 0, transparent 38%);
    mask: radial-gradient(circle, #000 0, transparent 38%);
    animation: ax-spin 12s linear infinite, ax-fade-in 0.5s ease both;
  }
  .rv-disc {
    position: relative;
    width: min(54vw, 240px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--ax-display);
    font-size: min(27vw, 120px);
    color: #fff;
    border: 4px solid #ffd76a;
    text-shadow: 0 6px 0 rgba(0, 0, 0, 0.35), 0 0 26px rgba(255, 255, 255, 0.55);
    box-shadow: 0 0 0 7px rgba(0, 0, 0, 0.55), 0 0 0 9px rgba(255, 214, 106, 0.6), 0 0 50px var(--rv-glow), 0 0 140px var(--rv-glow), inset 0 -16px 34px rgba(0, 0, 0, 0.5), inset 0 12px 26px rgba(255, 255, 255, 0.28);
    animation: rvIn 0.75s cubic-bezier(0.2, 1.5, 0.35, 1) both;
  }
  .rv-disc::after {
    content: "";
    position: absolute;
    inset: 6%;
    border-radius: 50%;
    border: 2px dashed rgba(255, 255, 255, 0.35);
    animation: ax-spin 8s linear infinite;
  }
  #reveal.r { --rv-glow: rgba(255, 40, 80, 0.85); --rv-ray: rgba(255, 60, 90, 0.16); }
  #reveal.b { --rv-glow: rgba(160, 140, 255, 0.75); --rv-ray: rgba(170, 150, 255, 0.13); }
  #reveal.z { --rv-glow: rgba(43, 255, 136, 0.85); --rv-ray: rgba(43, 255, 136, 0.16); }
  #reveal.r .rv-disc { background: radial-gradient(circle at 35% 28%, #ff6b82, #c8102e 55%, #5e0414); }
  #reveal.b .rv-disc { background: radial-gradient(circle at 35% 28%, #5a5478, #191626 55%, #040307); }
  #reveal.z .rv-disc { background: radial-gradient(circle at 35% 28%, #6dffb8, #0f9d58 55%, #033d1f); }
  .rv-tags { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 92vw; }
  .rv-tags span {
    padding: 6px 12px;

  .stats-pill.c { color: #bff6ff; }
  .stats-bars { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; font-weight: 700; }
  .stats-bars .bar { height: 8px; border-radius: 9px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  .stats-bars .bar i { display: block; height: 100%; background: var(--ax-gold-grad); }

  /* ------------------------------------------------------ ESCRITORIO */
  @media (min-width: 900px) and (min-aspect-ratio: 5/4) {
    #app {
      max-width: 1180px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(380px, 450px);

    #wheelSlot { height: auto; width: min(100%, calc(100dvh - var(--hud) - 210px)); }

  }
</style>
