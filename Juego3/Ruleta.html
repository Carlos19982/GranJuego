<script src="../shared/arcade.js"></script>
<script>
(() => {
  "use strict";

  /* =====================================================================
     DATOS DE LA RULETA EUROPEA
     ===================================================================== */
  const TAU = Math.PI * 2;
  const ORDER = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
  const IDX = {};
  ORDER.forEach((n, i) => (IDX[n] = i));
  const PA = TAU / 37; // ángulo de cada casilla
  const REDS = new Set([1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]);
  const colorOf = (n) => (n === 0 ? "z" : REDS.has(n) ? "r" : "b");

  const HISTORY_KEY = "rouletteNumberHistory_v1"; // misma clave que la versión anterior
  const LASTBETS_KEY = "ruletaLastBets_v1";
  const PENDING_KEY = "ruletaPendingSpin_v1";
  const CHIP_KEY = "ruletaChip_v1";
  const MAX_HISTORY = 50;
  const CHIPS = [1, 5, 25, 100, 500, 1000, 5000];

  /* Tipos de apuesta (mismos que la versión original) y multiplicador total
     (incluye la apuesta devuelta): pleno 36 (35:1), docenas/columnas 3 (2:1),
     sencillas 2 (1:1). Con el 0 solo gana el pleno al 0. */
  const BETS = {};
  for (let n = 0; n <= 36; n++) BETS["n" + n] = { type: "number", value: n, name: "Pleno al " + n, mult: 36, wins: (x) => x === n };
  const def = (k, type, name, mult, fn) => (BETS[k] = { type, value: null, name, mult, wins: fn });
  def("low", "low", "Falta (1-18)", 2, (x) => x >= 1 && x <= 18);
  def("even", "even", "Par", 2, (x) => x !== 0 && x % 2 === 0);
  def("red", "color-red", "Rojo", 2, (x) => REDS.has(x));
  def("black", "color-black", "Negro", 2, (x) => x !== 0 && !REDS.has(x));
  def("odd", "odd", "Impar", 2, (x) => x % 2 === 1);
  def("high", "high", "Pasa (19-36)", 2, (x) => x >= 19 && x <= 36);
  def("d1", "dozen-1", "1ª Docena (1-12)", 3, (x) => x >= 1 && x <= 12);
  def("d2", "dozen-2", "2ª Docena (13-24)", 3, (x) => x >= 13 && x <= 24);
  def("d3", "dozen-3", "3ª Docena (25-36)", 3, (x) => x >= 25 && x <= 36);
  def("c1", "column-1", "Columna 1", 3, (x) => x !== 0 && x % 3 === 1);
  def("c2", "column-2", "Columna 2", 3, (x) => x !== 0 && x % 3 === 2);
  def("c3", "column-3", "Columna 3", 3, (x) => x !== 0 && x % 3 === 0);

  const describe = (n) => {
    if (n === 0) return ["Cero", "Verde"];
    return [REDS.has(n) ? "Rojo" : "Negro", n % 2 ? "Impar" : "Par", n <= 18 ? "Falta" : "Pasa", Math.ceil(n / 12) + "ª Docena"];
  };

  /* =====================================================================
     UTILIDADES
     ===================================================================== */
  const $ = (s) => document.querySelector(s);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mod = (a, m) => ((a % m) + m) % m;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const rndi = (a, b) => Math.floor(rnd(a, b + 1));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const E = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    outQuad: (t) => 1 - (1 - t) * (1 - t),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  };
  const compact = (n) => {
    if (n >= 1e6) return (Math.round(n / 1e5) / 10).toString().replace(".", ",") + "M";
    if (n >= 1000) return (Math.round(n / 100) / 10).toString().replace(".", ",") + "K";
    return String(n);
  };
  const chipLabel = (v) => (v >= 1000 ? v / 1000 + "K" : String(v));
  const chipClass = (v) => "c" + v;
  const breakdown = (amt) => {
    const out = [];
    for (let i = CHIPS.length - 1; i >= 0 && out.length < 6; i--) {
      while (amt >= CHIPS[i] && out.length < 6) {
        out.push(CHIPS[i]);
        amt -= CHIPS[i];
      }
    }
    return out;
  };
  function seeded(seed) {
    return () => {
      seed |= 0;
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const store = {
    get(k, d) {
      try {
        const v = JSON.parse(localStorage.getItem(k));
        return v == null ? d : v;
      } catch (e) {
        return d;
      }
    },
    set(k, v) {
      try {
        localStorage.setItem(k, JSON.stringify(v));
      } catch (e) {}
    },
    del(k) {
      try {
        localStorage.removeItem(k);
      } catch (e) {}
    },
  };

  /* =====================================================================
     ESTADO
     ===================================================================== */
  let state = "idle"; // idle | spin | result
  let bets = {}; // clave -> importe
  let undoStack = [];
  let lastBets = sanitizeBets(store.get(LASTBETS_KEY, {}));
  let history = loadHistory();
  let chipValue = CHIPS.includes(store.get(CHIP_KEY, 25)) ? store.get(CHIP_KEY, 25) : 25;
  let guided = false; // "Modo guiado" de la versión original (doble toque en el saldo)
  let marksOn = false;

  function sanitizeBets(o) {
    const out = {};
    if (o && typeof o === "object")
      for (const k in o) if (BETS[k] && Number.isFinite(o[k]) && o[k] > 0) out[k] = Math.floor(o[k]);
    return out;
  }
  function loadHistory() {
    const a = store.get(HISTORY_KEY, []);
    return Array.isArray(a) ? a.filter((n) => Number.isInteger(n) && n >= 0 && n <= 36).slice(0, MAX_HISTORY) : [];
  }
  function saveHistory() {
    store.set(HISTORY_KEY, history.slice(0, MAX_HISTORY));
  }
  const totalOf = (b) => Object.values(b).reduce((a, v) => a + v, 0);
  const payoutOf = (b, n) => Object.keys(b).reduce((a, k) => a + (BETS[k].wins(n) ? b[k] * BETS[k].mult : 0), 0);

  /* Protección local: en el kit, la primera iteración del bucle de partículas
     puede tener dt < 0 (marca de tiempo de rAF anterior a performance.now()),
     lo que da un radio negativo en las ondas expansivas y detiene el bucle.
     Arrancamos antes el bucle con una partícula invisible y añadimos la onda
     dos frames después, cuando el bucle ya calcula dt entre frames reales. */
  const _shockwave = AX.fx.shockwave;
  AX.fx.shockwave = (x, y, o) => {
    AX.fx.burst(-60, -60, { count: 1, speed: 1, gravity: 0, life: 0.6, colors: ["rgba(0,0,0,0)"] });
    requestAnimationFrame(() => requestAnimationFrame(() => _shockwave(x, y, o)));
  };

  /* =====================================================================
     HUD
     ===================================================================== */
  const helpBtn = document.createElement("button");
  helpBtn.className = "ax-icon-btn";
  helpBtn.setAttribute("aria-label", "Ayuda");
  helpBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.9"/><path d="M12 17.3h.01"/></svg>`;
  const hud = AX.hud({ title: "RULETA", back: "../index.html", right: helpBtn });

  /* =====================================================================
     SONIDO PERSONALIZADO (bola rodando, golpes en trastes, rombos)
     ===================================================================== */
  const S = AX.sfx;
  let lastClack = 0;
  function sClack(v = 1) {
    const now = performance.now();
    if (now - lastClack < 28) return;
    lastClack = now;
    S.noise(0.035, { freq: 2600 + Math.random() * 1600, q: 3, vol: 0.26 * v });
    S.tone(1300 + Math.random() * 900, 0.035, { type: "triangle", vol: 0.07 * v });
  }
  function sTick(v = 1) {
    const now = performance.now();
    if (now - lastClack < 22) return;
    lastClack = now;
    S.tone(2400 + Math.random() * 500, 0.02, { type: "square", vol: 0.035 * v, filter: { freq: 3500 } });
    S.noise(0.02, { freq: 5000, q: 5, vol: 0.12 * v });
  }
  function sDiamond() {
    S.tone(2900, 0.16, { type: "sine", vol: 0.09 });
    S.tone(4350, 0.1, { type: "sine", vol: 0.05 });
    S.noise(0.04, { freq: 6000, q: 4, vol: 0.25 });
  }
  function sLaunch() {
    S.noise(0.6, { freq: 400, to: 2600, q: 1.2, vol: 0.28, attack: 0.08 });
    S.tone(180, 0.5, { type: "sawtooth", to: 520, vol: 0.04, filter: { freq: 1200 } });
  }
  function sSettle() {
    S.tone(170, 0.25, { type: "sine", to: 70, vol: 0.4 });
    S.noise(0.06, { freq: 2200, q: 2, vol: 0.3 });
  }
  const roll = {};
  function rollStart() {
    try {
      const c = S.ctx();
      if (!c || !S.master) return;
      const len = c.sampleRate * 2;
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        last = (last + 0.04 * (Math.random() * 2 - 1)) / 1.04;
        d[i] = last * 3;
      }
      roll.src = c.createBufferSource();
      roll.src.buffer = buf;
      roll.src.loop = true;
      roll.bp = c.createBiquadFilter();
      roll.bp.type = "bandpass";
      roll.bp.frequency.value = 700;
      roll.bp.Q.value = 0.8;
      roll.am = c.createGain();
      roll.am.gain.value = 0.7;
      roll.lfo = c.createOscillator();
      roll.lfo.frequency.value = 10;
      const lg = c.createGain();
      lg.gain.value = 0.3;
      roll.lfo.connect(lg);
      lg.connect(roll.am.gain);
      roll.g = c.createGain();
      roll.g.gain.value = 0.0001;
      roll.src.connect(roll.bp);
      roll.bp.connect(roll.am);
      roll.am.connect(roll.g);
      roll.g.connect(S.master);
      roll.src.start();
      roll.lfo.start();
      roll.c = c;
    } catch (e) {}
  }
  function rollSet(vol, freq, lfo) {
    if (!roll.g) return;
    const t = roll.c.currentTime;
    roll.g.gain.setTargetAtTime(Math.max(0.0001, vol), t, 0.08);
    roll.bp.frequency.setTargetAtTime(freq, t, 0.1);
    roll.lfo.frequency.setTargetAtTime(lfo, t, 0.1);
  }
  function rollStop() {
    if (!roll.g) return;
    try {
      const t = roll.c.currentTime;
      roll.g.gain.setTargetAtTime(0.0001, t, 0.12);
      roll.src.stop(t + 0.8);
      roll.lfo.stop(t + 0.8);
    } catch (e) {}
    for (const k in roll) delete roll[k];
  }

  /* =====================================================================
     RUEDA EN CANVAS (capas pre-renderizadas + bola animada)
     ===================================================================== */
  const cv = $("#wheelCv");
  const ctx = cv.getContext("2d");
  const slotEl = $("#wheelSlot");
  const backdrop = $("#backdrop");
  const M = 1.12; // margen de las capas (sombra exterior)
  const ZMAX = 1.6; // zoom máximo de la "cámara"
  // Radios relativos al radio exterior R
  const R_TRACK = 0.866, R_POCKET = 0.61, R_BALL = 0.031;

  let W = 0, H = 0, DPR = 1, hudBottom = 58;
  let slotG = { x: 0, y: 0, R: 50 }, bigG = { x: 0, y: 0, R: 150 };
  let layers = null, layerR = 0;

  const scene = {
    rot: -Math.PI / 2,
    omega: 0.32,
    ball: { psi: null, r: R_POCKET }, // ángulo relativo al rotor cuando reposa
    ballWorld: null, // {phi, r} durante el giro
    e: 0, // 0 = mesa, 1 = rueda a pantalla completa
    cam: { k: 0, fx: 0, fy: 0 },
    glowIdx: null,
    glowAmt: 0,
    trail: [],
    speed: 0,
  };

  function goldLinear(g, r) {
    const lg = g.createLinearGradient(-r, -r, r, r);
    lg.addColorStop(0, "#fff6c4");
    lg.addColorStop(0.22, "#ffd23f");
    lg.addColorStop(0.45, "#a86a05");
    lg.addColorStop(0.62, "#ffe48a");
    lg.addColorStop(0.82, "#c27c00");
    lg.addColorStop(1, "#5e3500");
    return lg;
  }
  function ringPath(g, r1, r2) {
    g.beginPath();
    g.arc(0, 0, r2, 0, TAU);
    g.arc(0, 0, r1, 0, TAU, true);
  }
  function sector(g, r1, r2, a0, a1) {
    g.beginPath();
    g.arc(0, 0, r2, a0, a1);
    g.arc(0, 0, r1, a1, a0, true);
    g.closePath();
  }
  function mkCanvas(s) {
    const c = document.createElement("canvas");
    c.width = c.height = s;
    return c;
  }

  function drawBowl(g, C, r) {
    const rand = seeded(11);
    g.save();
    g.translate(C, C);
    // sombra exterior + halo
    let gr = g.createRadialGradient(0, 0, r * 0.94, 0, 0, r * M);
    gr.addColorStop(0, "rgba(0,0,0,0.8)");
    gr.addColorStop(0.45, "rgba(0,0,0,0.35)");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr;
    g.beginPath();
    g.arc(0, 0, r * M, 0, TAU);
    g.fill();
    // madera exterior
    gr = g.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.2, 0, 0, r);
    gr.addColorStop(0, "#9a4a1f");
    gr.addColorStop(0.7, "#5c240c");
    gr.addColorStop(0.92, "#3d1606");
    gr.addColorStop(1, "#1c0902");
    g.fillStyle = gr;
    g.beginPath();
    g.arc(0, 0, r, 0, TAU);
    g.fill();
    // vetas de la madera
    g.save();
    ringPath(g, r * 0.93, r);
    g.clip("evenodd");
    for (let i = 0; i < 110; i++) {
      const rr = r * (0.93 + rand() * 0.07);
      const a0 = rand() * TAU;
      g.strokeStyle = rand() < 0.5 ? `rgba(255,190,140,${0.03 + rand() * 0.06})` : `rgba(0,0,0,${0.06 + rand() * 0.12})`;
      g.lineWidth = r * (0.0015 + rand() * 0.004);
      g.beginPath();
      g.arc(0, 0, rr, a0, a0 + 0.4 + rand() * 2.2);
      g.stroke();
    }
    g.restore();
    // bisel exterior
    let lg = g.createLinearGradient(-r, -r, r, r);
    lg.addColorStop(0, "rgba(255,225,190,0.6)");
    lg.addColorStop(0.45, "rgba(255,225,190,0)");
    lg.addColorStop(1, "rgba(0,0,0,0.6)");
    g.strokeStyle = lg;
    g.lineWidth = r * 0.014;
    g.beginPath();
    g.arc(0, 0, r * 0.99, 0, TAU);
    g.stroke();
    // aro dorado
    g.fillStyle = goldLinear(g, r);
    ringPath(g, r * 0.912, r * 0.935);
    g.fill("evenodd");
    g.strokeStyle = "rgba(60,30,0,0.7)";
    g.lineWidth = r * 0.003;
    g.beginPath();
    g.arc(0, 0, r * 0.912, 0, TAU);
    g.stroke();
    // pista de la bola (inclinada)
    gr = g.createRadialGradient(0, 0, r * 0.78, 0, 0, r * 0.912);
    gr.addColorStop(0, "#080403");
    gr.addColorStop(0.3, "#25140a");
    gr.addColorStop(0.72, "#4f2d16");
    gr.addColorStop(0.9, "#2e1709");
    gr.addColorStop(1, "#0f0703");
    g.fillStyle = gr;
    ringPath(g, r * 0.78, r * 0.912);
    g.fill("evenodd");
    // brillo de la pista
    g.save();
    ringPath(g, r * 0.78, r * 0.912);
    g.clip("evenodd");
    lg = g.createLinearGradient(-r, -r, r * 0.5, r * 0.5);
    lg.addColorStop(0, "rgba(255,230,200,0.22)");
    lg.addColorStop(0.55, "rgba(255,230,200,0)");
    g.fillStyle = lg;
    g.fillRect(-r, -r, 2 * r, 2 * r);
    g.strokeStyle = "rgba(255,220,180,0.08)";
    g.lineWidth = r * 0.004;
    g.beginPath();
    g.arc(0, 0, r * 0.885, 0, TAU);
    g.stroke();
    // sombra del rotor sobre la pista
    gr = g.createRadialGradient(0, 0, r * 0.775, 0, 0, r * 0.83);
    gr.addColorStop(0, "rgba(0,0,0,0.75)");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr;
    g.fillRect(-r, -r, 2 * r, 2 * r);
    g.restore();
    // rombos deflectores
    for (let k = 0; k < 8; k++) {
      const a = (k * TAU) / 8 + TAU / 16;
      const vert = k % 2 === 0;
      g.save();
      g.rotate(a);
      g.translate(r * 0.828, 0);
      if (!vert) g.rotate(Math.PI / 2);
      const L = r * (vert ? 0.05 : 0.034), w = r * (vert ? 0.02 : 0.026);
      const cg = g.createLinearGradient(-L, -w, L, w);
      cg.addColorStop(0, "#ffffff");
      cg.addColorStop(0.35, "#c9cfdd");
      cg.addColorStop(0.55, "#666e82");
      cg.addColorStop(0.8, "#eef1f7");
      cg.addColorStop(1, "#8890a3");
      g.shadowColor = "rgba(0,0,0,0.7)";
      g.shadowBlur = r * 0.02;
      g.shadowOffsetX = r * 0.006;
      g.shadowOffsetY = r * 0.008;
      g.fillStyle = cg;
      g.beginPath();
      g.moveTo(L, 0);
      g.lineTo(0, w);
      g.lineTo(-L, 0);
      g.lineTo(0, -w);
      g.closePath();
      g.fill();
      g.shadowColor = "transparent";
      g.strokeStyle = "rgba(255,255,255,0.5)";
      g.lineWidth = r * 0.002;
      g.stroke();
      g.restore();
    }
    // hueco del rotor
    g.fillStyle = "#050302";
    g.beginPath();
    g.arc(0, 0, r * 0.782, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawRotor(g, C, r) {
    const rand = seeded(29);
    g.save();
    g.translate(C, C);
    // aro dorado del rotor
    g.fillStyle = goldLinear(g, r);
    g.beginPath();
    g.arc(0, 0, r * 0.78, 0, TAU);
    g.fill();
    // anillo de números
    const numG = {}, pocG = {};
    const mk = (r1, r2, stops) => {
      const gg = g.createRadialGradient(0, 0, r1, 0, 0, r2);
      stops.forEach(([o, c]) => gg.addColorStop(o, c));
      return gg;
    };
    numG.r = mk(r * 0.665, r * 0.765, [[0, "#7a0a1c"], [0.45, "#dc2541"], [1, "#8d0c22"]]);
    numG.b = mk(r * 0.665, r * 0.765, [[0, "#050507"], [0.45, "#2a2737"], [1, "#09080e"]]);
    numG.z = mk(r * 0.665, r * 0.765, [[0, "#044d28"], [0.45, "#1cc271"], [1, "#076334"]]);
    pocG.r = mk(r * 0.553, r * 0.665, [[0, "#3c040d"], [0.5, "#a6132d"], [0.85, "#6c0918"], [1, "#2a0207"]]);
    pocG.b = mk(r * 0.553, r * 0.665, [[0, "#000"], [0.5, "#1e1b29"], [0.85, "#0a0910"], [1, "#000"]]);
    pocG.z = mk(r * 0.553, r * 0.665, [[0, "#022b16"], [0.5, "#109a52"], [0.85, "#055c2e"], [1, "#011a0c"]]);
    for (let i = 0; i < 37; i++) {
      const a0 = i * PA - PA / 2, a1 = a0 + PA;
      const c = colorOf(ORDER[i]);
      g.fillStyle = numG[c];
      sector(g, r * 0.665, r * 0.766, a0, a1 + 0.002);
      g.fill();
      g.fillStyle = pocG[c];
      sector(g, r * 0.553, r * 0.665, a0, a1 + 0.002);
      g.fill();
      // sombra interna del bolsillo (lado de entrada)
      const sg = g.createLinearGradient(Math.cos(a0) * r * 0.6, Math.sin(a0) * r * 0.6, Math.cos(a0 + PA * 0.5) * r * 0.6, Math.sin(a0 + PA * 0.5) * r * 0.6);
      sg.addColorStop(0, "rgba(0,0,0,0.45)");
      sg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = sg;
      sector(g, r * 0.553, r * 0.665, a0, a1);
      g.fill();
    }
    // separadores dorados del anillo de números
    g.strokeStyle = "rgba(255,214,110,0.85)";
    g.lineWidth = r * 0.004;
    for (let i = 0; i < 37; i++) {
      const a = i * PA + PA / 2;
      g.beginPath();
      g.moveTo(Math.cos(a) * r * 0.665, Math.sin(a) * r * 0.665);
      g.lineTo(Math.cos(a) * r * 0.766, Math.sin(a) * r * 0.766);
      g.stroke();
    }
    // números
    const fs = Math.round(r * 0.062);
    g.font = `${fs}px Bungee, Outfit, "Arial Black", sans-serif`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    for (let i = 0; i < 37; i++) {
      g.save();
      g.rotate(i * PA);
      g.translate(r * 0.716, 0);
      g.rotate(Math.PI / 2);
      g.fillStyle = "rgba(0,0,0,0.55)";
      g.fillText(ORDER[i], fs * 0.05, fs * 0.08);
      g.fillStyle = "#fffaf0";
      g.fillText(ORDER[i], 0, 0);
      g.restore();
    }
    // anillo cromado entre números y bolsillos
    g.strokeStyle = "#d7dce8";
    g.lineWidth = r * 0.007;
    g.beginPath();
    g.arc(0, 0, r * 0.665, 0, TAU);
    g.stroke();
    // trastes metálicos
    for (let i = 0; i < 37; i++) {
      const a = i * PA + PA / 2;
      const c = Math.cos(a), s = Math.sin(a);
      g.lineCap = "round";
      g.strokeStyle = "rgba(0,0,0,0.6)";
      g.lineWidth = r * 0.02;
      g.beginPath();
      g.moveTo(c * r * 0.556 + r * 0.004, s * r * 0.556 + r * 0.006);
      g.lineTo(c * r * 0.664 + r * 0.004, s * r * 0.664 + r * 0.006);
      g.stroke();
      g.strokeStyle = "#7d8496";
      g.lineWidth = r * 0.015;
      g.beginPath();
      g.moveTo(c * r * 0.556, s * r * 0.556);
      g.lineTo(c * r * 0.664, s * r * 0.664);
      g.stroke();
      g.strokeStyle = "#f7f9ff";
      g.lineWidth = r * 0.006;
      g.beginPath();
      g.moveTo(c * r * 0.558 - r * 0.002, s * r * 0.558 - r * 0.002);
      g.lineTo(c * r * 0.662 - r * 0.002, s * r * 0.662 - r * 0.002);
      g.stroke();
    }
    // aro interior dorado
    g.fillStyle = goldLinear(g, r);
    ringPath(g, r * 0.532, r * 0.556);
    g.fill("evenodd");
    // cono de madera
    let gr = g.createRadialGradient(-r * 0.1, -r * 0.12, r * 0.02, 0, 0, r * 0.534);
    gr.addColorStop(0, "#b4632e");
    gr.addColorStop(0.45, "#76331a");
    gr.addColorStop(0.85, "#3f1707");
    gr.addColorStop(1, "#1e0a02");
    g.fillStyle = gr;
    g.beginPath();
    g.arc(0, 0, r * 0.533, 0, TAU);
    g.fill();
    g.save();
    g.beginPath();
    g.arc(0, 0, r * 0.533, 0, TAU);
    g.clip();
    for (let i = 0; i < 70; i++) {
      const rr = r * (0.12 + rand() * 0.41);
      const a0 = rand() * TAU;
      g.strokeStyle = rand() < 0.5 ? `rgba(255,190,140,${0.025 + rand() * 0.05})` : `rgba(0,0,0,${0.05 + rand() * 0.1})`;
      g.lineWidth = r * (0.0015 + rand() * 0.003);
      g.beginPath();
      g.arc(0, 0, rr, a0, a0 + 0.3 + rand() * 1.8);
      g.stroke();
    }
    g.restore();
    // incrustaciones doradas en el cono
    g.strokeStyle = "rgba(255,210,90,0.75)";
    g.lineWidth = r * 0.006;
    g.beginPath();
    g.arc(0, 0, r * 0.45, 0, TAU);
    g.stroke();
    g.strokeStyle = "rgba(255,210,90,0.45)";
    g.lineWidth = r * 0.003;
    g.beginPath();
    g.arc(0, 0, r * 0.43, 0, TAU);
    g.stroke();
    // torreta: 4 brazos
    for (let k = 0; k < 4; k++) {
      g.save();
      g.rotate((k * Math.PI) / 2 + Math.PI / 4);
      g.shadowColor = "rgba(0,0,0,0.6)";
      g.shadowBlur = r * 0.02;
      g.shadowOffsetX = r * 0.008;
      g.shadowOffsetY = r * 0.012;
      const lg = g.createLinearGradient(0, -r * 0.03, 0, r * 0.03);
      lg.addColorStop(0, "#fff3b0");
      lg.addColorStop(0.45, "#e0a92a");
      lg.addColorStop(1, "#6e4200");
      g.fillStyle = lg;
      g.beginPath();
      g.moveTo(r * 0.06, -r * 0.032);
      g.quadraticCurveTo(r * 0.2, -r * 0.016, r * 0.3, -r * 0.012);
      g.lineTo(r * 0.3, r * 0.012);
      g.quadraticCurveTo(r * 0.2, r * 0.016, r * 0.06, r * 0.032);
      g.closePath();
      g.fill();
      const kg = g.createRadialGradient(r * 0.305, -r * 0.012, r * 0.004, r * 0.315, 0, r * 0.03);
      kg.addColorStop(0, "#fffbe0");
      kg.addColorStop(0.5, "#ffc93a");
      kg.addColorStop(1, "#7a4a00");
      g.fillStyle = kg;
      g.beginPath();
      g.arc(r * 0.315, 0, r * 0.03, 0, TAU);
      g.fill();
      g.restore();
    }
    // cúpula central
    gr = g.createRadialGradient(-r * 0.035, -r * 0.04, r * 0.01, 0, 0, r * 0.11);
    gr.addColorStop(0, "#fffbe0");
    gr.addColorStop(0.35, "#ffd23f");
    gr.addColorStop(0.75, "#b8740a");
    gr.addColorStop(1, "#5e3500");
    g.fillStyle = gr;
    g.beginPath();
    g.arc(0, 0, r * 0.11, 0, TAU);
    g.fill();
    g.strokeStyle = "rgba(60,30,0,0.6)";
    g.lineWidth = r * 0.004;
    g.beginPath();
    g.arc(0, 0, r * 0.075, 0, TAU);
    g.stroke();
    gr = g.createRadialGradient(-r * 0.012, -r * 0.014, r * 0.003, 0, 0, r * 0.042);
    gr.addColorStop(0, "#ffffff");
    gr.addColorStop(0.5, "#ffe27a");
    gr.addColorStop(1, "#a86a05");
    g.fillStyle = gr;
    g.beginPath();
    g.arc(0, 0, r * 0.042, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawLight(g, C, r) {
    g.save();
    g.translate(C, C);
    // profundidad del rotor
    let gr = g.createRadialGradient(0, 0, r * 0.4, 0, 0, r * 0.785);
    gr.addColorStop(0, "rgba(0,0,0,0)");
    gr.addColorStop(0.75, "rgba(0,0,0,0.08)");
    gr.addColorStop(1, "rgba(0,0,0,0.38)");
    g.fillStyle = gr;
    g.beginPath();
    g.arc(0, 0, r * 0.785, 0, TAU);
    g.fill();
    // luz direccional (arriba-izquierda)
    const lg = g.createLinearGradient(-r * 0.75, -r * 0.75, r * 0.75, r * 0.75);
    lg.addColorStop(0, "rgba(255,246,228,0.17)");
    lg.addColorStop(0.42, "rgba(255,246,228,0)");
    lg.addColorStop(0.58, "rgba(0,0,0,0)");
    lg.addColorStop(1, "rgba(0,0,0,0.3)");
    g.fillStyle = lg;
    g.beginPath();
    g.arc(0, 0, r * 0.935, 0, TAU);
    g.fill();
    // reflejo especular
    g.save();
    g.translate(-r * 0.3, -r * 0.42);
    g.rotate(-0.62);
    g.scale(1, 0.42);
    gr = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.45);
    gr.addColorStop(0, "rgba(255,255,255,0.2)");
    gr.addColorStop(0.6, "rgba(255,255,255,0.05)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr;
    g.beginPath();
    g.arc(0, 0, r * 0.45, 0, TAU);
    g.fill();
    g.restore();
    // brillo fijo en la cúpula
    gr = g.createRadialGradient(-r * 0.035, -r * 0.045, 0, -r * 0.035, -r * 0.045, r * 0.05);
    gr.addColorStop(0, "rgba(255,255,255,0.85)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr;
    g.beginPath();
    g.arc(-r * 0.035, -r * 0.045, r * 0.05, 0, TAU);
    g.fill();
    // brillo del aro dorado
    g.strokeStyle = "rgba(255,255,240,0.7)";
    g.lineWidth = r * 0.006;
    g.shadowColor = "#fff6c4";
    g.shadowBlur = r * 0.03;
    g.beginPath();
    g.arc(0, 0, r * 0.924, Math.PI * 1.02, Math.PI * 1.48);
    g.stroke();
    g.beginPath();
    g.arc(0, 0, r * 0.772, Math.PI * 1.08, Math.PI * 1.42);
    g.stroke();
    g.restore();
  }

  function prerender(Rd) {
    const S2 = Math.ceil(2 * Rd * M);
    const C = S2 / 2;
    const bowl = mkCanvas(S2), rotor = mkCanvas(S2), light = mkCanvas(S2);
    drawBowl(bowl.getContext("2d"), C, Rd);
    drawRotor(rotor.getContext("2d"), C, Rd);
    drawLight(light.getContext("2d"), C, Rd);
    layers = { bowl, rotor, light };
    layerR = Rd;
  }
  function wantedLayerR() {
    return Math.min(900, Math.ceil(Math.max(bigG.R * ZMAX, slotG.R) * DPR));
  }

  function measure() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    hudBottom = hud.root.getBoundingClientRect().bottom || 58;
    const r = slotEl.getBoundingClientRect();
    slotG = { x: r.left + r.width / 2, y: r.top + r.height / 2, R: (r.width / 2) * 0.97 };
    const avH = H - hudBottom;
    bigG = { x: W / 2, y: hudBottom + avH * 0.47, R: Math.min(W * 0.46, avH * 0.4, 430) };
    backdrop.style.setProperty("--by", bigG.y + "px");
    const want = wantedLayerR();
    if (!layers || want > layerR * 1.15 || want < layerR * 0.6) prerender(want);
  }

  function geom() {
    const e = scene.e;
    return { x: lerp(slotG.x, bigG.x, e), y: lerp(slotG.y, bigG.y, e), R: lerp(slotG.R, bigG.R, e) };
  }
  function ballScreen() {
    const g = geom();
    const bw = scene.ballWorld || (scene.ball.psi != null ? { phi: scene.rot + scene.ball.psi, r: scene.ball.r } : null);
    if (!bw) return { x: g.x, y: g.y };
    const p = { x: g.x + Math.cos(bw.phi) * bw.r * g.R, y: g.y + Math.sin(bw.phi) * bw.r * g.R };
    // aplicar cámara
    const c = camera(g);
    return { x: (p.x - c.fx) * c.Z + c.sx, y: (p.y - c.fy) * c.Z + c.sy };
  }
  function camera(g) {
    const k = scene.cam.k;
    const Z = 1 + (ZMAX - 1) * k;
    const fx = lerp(g.x, scene.cam.fx, k), fy = lerp(g.y, scene.cam.fy, k);
    const sx = lerp(g.x, lerp(scene.cam.fx, g.x, 0.55), k), sy = lerp(g.y, lerp(scene.cam.fy, g.y, 0.55), k);
    return { Z, fx, fy, sx, sy };
  }

  function drawLayer(img, x, y, R, rot, alpha) {
    const s = R * M;
    if (rot) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      if (alpha != null) ctx.globalAlpha = alpha;
      ctx.drawImage(img, -s, -s, 2 * s, 2 * s);
      ctx.restore();
    } else ctx.drawImage(img, x - s, y - s, 2 * s, 2 * s);
  }

  function render(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!layers) return;
    const g = geom();
    const c = camera(g);
    ctx.setTransform(DPR * c.Z, 0, 0, DPR * c.Z, DPR * (c.sx - c.fx * c.Z), DPR * (c.sy - c.fy * c.Z));
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";

    drawLayer(layers.bowl, g.x, g.y, g.R, 0);
    drawLayer(layers.rotor, g.x, g.y, g.R, scene.rot);
    // desenfoque de movimiento del rotor a gran velocidad
    const w = Math.abs(scene.omega);
    if (w > 1.2) {
      const a = Math.min(0.35, (w - 1.2) * 0.25);
      drawLayer(layers.rotor, g.x, g.y, g.R, scene.rot - scene.omega * 0.016, a);
      drawLayer(layers.rotor, g.x, g.y, g.R, scene.rot - scene.omega * 0.032, a * 0.6);
    }
    // casilla ganadora iluminada
    if (scene.glowIdx != null && scene.glowAmt > 0.01) {
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(scene.rot);
      ctx.globalCompositeOperation = "lighter";
      const a = scene.glowIdx * PA;
      const pulse = (0.42 + 0.22 * Math.sin(now / 160)) * scene.glowAmt;
      ctx.fillStyle = `rgba(255,214,90,${pulse})`;
      sector(ctx, g.R * 0.553, g.R * 0.766, a - PA / 2, a + PA / 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(255,250,220,${pulse * 1.4})`;
      ctx.lineWidth = g.R * 0.008;
      ctx.stroke();
      ctx.restore();
    }
    drawLayer(layers.light, g.x, g.y, g.R, 0);

    // bola
    const bw = scene.ballWorld || (scene.ball.psi != null ? { phi: scene.rot + scene.ball.psi, r: scene.ball.r } : null);
    if (bw) {
      const br = R_BALL * g.R;
      // estela
      if (scene.speed > 3 && scene.trail.length > 1) {
        ctx.save();
        ctx.lineCap = "round";
        for (let i = 1; i < scene.trail.length; i++) {
          const p0 = scene.trail[i - 1], p1 = scene.trail[i];
          const al = (i / scene.trail.length) * Math.min(0.35, (scene.speed - 3) * 0.05);
          ctx.strokeStyle = `rgba(255,255,255,${al})`;
          ctx.lineWidth = br * 2 * (0.4 + (0.6 * i) / scene.trail.length);
          ctx.beginPath();
          const rr = ((p0.r + p1.r) / 2) * g.R;
          const a0 = p0.phi, a1 = p1.phi;
          ctx.arc(g.x, g.y, rr, Math.min(a0, a1), Math.max(a0, a1));
          ctx.stroke();
        }
        ctx.restore();
      }
      const bx = g.x + Math.cos(bw.phi) * bw.r * g.R;
      const by = g.y + Math.sin(bw.phi) * bw.r * g.R;
      const lift = Math.max(0, bw.r - R_POCKET) * (bw.r < 0.78 ? 1 : 0);
      const so = br * 0.35 + lift * g.R * 0.45;
      let gr = ctx.createRadialGradient(bx + so, by + so * 1.2, 0, bx + so, by + so * 1.2, br * 1.35);
      gr.addColorStop(0, "rgba(0,0,0,0.6)");
      gr.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(bx + so, by + so * 1.2, br * 1.35, 0, TAU);
      ctx.fill();
      const sc = 1 + lift * 2.2;
      gr = ctx.createRadialGradient(bx - br * 0.35, by - br * 0.4, br * 0.08, bx, by, br * sc);
      gr.addColorStop(0, "#ffffff");
      gr.addColorStop(0.35, "#f3f3f8");
      gr.addColorStop(0.78, "#b7bacb");
      gr.addColorStop(1, "#6f7388");
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(bx, by, br * sc, 0, TAU);
      ctx.fill();
      if (state === "spin") {
        ctx.globalCompositeOperation = "lighter";
        gr = ctx.createRadialGradient(bx, by, 0, bx, by, br * 3);
        gr.addColorStop(0, "rgba(255,255,255,0.22)");
        gr.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(bx, by, br * 3, 0, TAU);
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";
      }
    }
  }

  /* ---------------------------------------------------- TWEENS */
  const tweens = new Set();
  function tween(ms, fn, ease = E.inOut) {
    return new Promise((res) => tweens.add({ t0: performance.now(), ms, fn, ease, res }));
  }
  function tweenVal(obj, key, to, ms, ease) {
    const from = obj[key];
    return tween(ms, (k) => (obj[key] = from + (to - from) * k), ease);
  }

  /* =====================================================================
     FÍSICA DEL GIRO
     El número ganador se decide ANTES por RNG; la animación se construye
     para que la bola caiga exactamente en esa casilla.
     ===================================================================== */
  function buildSpin(n) {
    const idx = IDX[n];
    const alphaT = idx * PA; // ángulo de la casilla en el marco del rotor
    const th0 = scene.rot, wi = scene.omega;
    const wp = rnd(2.1, 2.6), td = 8.5, ta = 0.7;
    const theta = (t) => th0 + wp * td * (1 - Math.exp(-t / td)) - (wp - wi) * ta * (1 - Math.exp(-t / ta));
    const omega = (t) => wp * Math.exp(-t / td) - (wp - wi) * Math.exp(-t / ta);
    const t2 = rnd(4.7, 5.3), t1 = t2 - 1.25;
    // Rebotes entre casillas (en unidades de casilla; negativo = contra el rotor)
    const hops = [{ s: -rndi(2, 4), d: rnd(0.34, 0.42), h: 0.055, first: true }];
    const nh = rndi(1, 4);
    for (let i = 0; i < nh; i++) {
      const back = i > 0 && Math.random() < 0.3;
      hops.push({ s: back ? 1 : -1, d: rnd(0.2, 0.27) * (1 + i * 0.18), h: 0.034 * Math.pow(0.68, i) });
    }
    const Ssum = hops.reduce((a, h) => a + h.s, 0) * PA;
    const psiStart = alphaT - Ssum;
    const resting = scene.ball.psi != null;
    const phi0 = resting ? th0 + scene.ball.psi : th0 + Math.random() * TAU;
    const r0 = resting ? scene.ball.r : R_TRACK;
    const need = psiStart + theta(t2);
    const Amin = rnd(36, 43);
    let A = mod(phi0 - need, TAU);
    while (A < Amin) A += TAU;
    const c = 0.18;
    const gfn = (u) => (1 - c) * (1 - (1 - u) * (1 - u)) + c * u;
    let tt = t2, ps = psiStart;
    hops.forEach((h) => {
      h.t0 = tt;
      h.p0 = ps;
      tt += h.d;
      ps += h.s * PA;
    });
    const tH = tt, tEnd = tH + 0.75;
    const wob = 0.14 * PA * Math.sign(hops[hops.length - 1].s);
    const tDiamond = t1 + 0.33 * (t2 - t1);

    function ball(t) {
      if (t <= t2) {
        const u = t / t2;
        const phi = phi0 - A * gfn(u);
        let r;
        if (t < 0.5) r = r0 + (R_TRACK - r0) * E.out(t / 0.5);
        else if (t < t1) r = R_TRACK + 0.003 * Math.sin(t * 23);
        else {
          const v = (t - t1) / (t2 - t1);
          r = R_TRACK + (R_POCKET - R_TRACK) * Math.pow(v, 1.5) + 0.03 * Math.exp(-Math.pow((v - 0.33) / 0.07, 2));
        }
        return { phi, psi: phi - theta(t), r, phase: t < t1 ? 0 : 1 };
      }
      if (t < tH) {
        let i = 0;
        while (i < hops.length - 1 && t >= hops[i].t0 + hops[i].d) i++;
        const h = hops[i];
        const u = clamp((t - h.t0) / h.d, 0, 1);
        const e = h.first ? E.outQuad(u) : E.inOutSine(u);
        const psi = h.p0 + h.s * PA * e;
        return { psi, phi: psi + theta(t), r: R_POCKET + h.h * Math.sin(Math.PI * u), phase: 2, hop: i };
      }
      const tau = t - tH;
      const psi = alphaT + wob * Math.exp(-7 * tau) * Math.sin(17 * tau);
      return { psi, phi: psi + theta(t), r: R_POCKET, phase: 3 };
    }
    return { n, idx, alphaT, theta, omega, ball, t1, t2, tH, tEnd, hops, tDiamond };
  }

  let run = null; // giro en curso
  function startRun(n) {
    return new Promise((resolve) => {
      run = { b: buildSpin(n), t: 0, scale: 1, turbo: 1, resolve, fired: {}, fret: null, hop: -1, lastPhi: null };
      scene.trail = [];
    });
  }
  function updateRun(dt) {
    const R = run, b = R.b;
    const slowZone = R.t > b.t1 - 0.5 && R.t < b.tH + 0.15;
    const target = slowZone ? 0.62 : 1;
    R.scale += (target - R.scale) * Math.min(1, dt * 4);
    const sdt = dt * R.scale * R.turbo;
    R.t = Math.min(b.tEnd, R.t + sdt);
    const t = R.t;
    scene.rot = b.theta(t);
    scene.omega = b.omega(t);
    const st = b.ball(t);
    scene.ballWorld = { phi: st.phi, r: st.r };
    // velocidad angular de la bola (mundo)
    if (R.lastPhi != null && sdt > 0) scene.speed = scene.speed * 0.7 + 0.3 * Math.abs(mod(st.phi - R.lastPhi + Math.PI, TAU) - Math.PI) / sdt;
    R.lastPhi = st.phi;
    scene.trail.push({ phi: st.phi, r: st.r });
    if (scene.trail.length > 7) scene.trail.shift();
    if (st.phase > 0) scene.trail.length = Math.min(scene.trail.length, st.phase === 1 ? 4 : 0);

    // sonido de rodadura
    if (st.phase === 0) rollSet(Math.min(0.55, 0.05 + scene.speed * 0.035), 380 + scene.speed * 85, 4 + scene.speed * 1.6);
    else if (st.phase === 1) rollSet(0.18, 1400, 18);
    else rollSet(0.0001, 800, 8);

    // ticks al cruzar trastes cuando la bola está abajo
    const fi = Math.floor(st.psi / PA + 0.5);
    if (R.fret != null && fi !== R.fret && Math.abs(fi - R.fret) < 4 && st.r < 0.74) {
      sTick(st.phase === 1 ? 0.7 : 1);
    }
    R.fret = fi;

    // eventos
    const once = (k, cond, fn) => {
      if (!R.fired[k] && cond) {
        R.fired[k] = true;
        fn();
      }
    };
    once("zoom", t > b.t1 - 0.35, () => {
      const p = ballWorldXY();
      scene.cam.fx = p.x;
      scene.cam.fy = p.y;
      tweenVal(scene.cam, "k", 1, 1100, E.inOut);
      AX.fx.slowmo(2600);
      S.play("riser");
    });
    once("drop", t > b.t1, () => {
      S.noise(0.25, { freq: 1800, to: 600, q: 1, vol: 0.15 });
    });
    once("diamond", t > b.tDiamond, () => {
      sDiamond();
      AX.haptic("light");
      const p = ballScreen();
      AX.fx.sparks(p.x, p.y, { count: 14, speed: 380, colors: "ice", size: 2 });
    });
    once("land", t > b.t2, () => {
      sClack(1.2);
      AX.haptic("tap");
    });
    if (st.phase === 2 && st.hop !== R.hop) {
      if (R.hop >= 0) {
        sClack(0.9 - R.hop * 0.08);
        AX.haptic("light");
      }
      R.hop = st.hop;
    }
    once("settle", t > b.tH, () => {
      sClack(0.7);
      sSettle();
      AX.haptic("medium");
    });
    if (t >= b.tEnd) {
      scene.ball.psi = mod(b.alphaT, TAU);
      scene.ball.r = R_POCKET;
      scene.ballWorld = null;
      scene.speed = 0;
      const res = R.resolve;
      run = null;
      res(b);
    }
  }
  function ballWorldXY() {
    const g = geom();
    const bw = scene.ballWorld || (scene.ball.psi != null ? { phi: scene.rot + scene.ball.psi, r: scene.ball.r } : { phi: 0, r: 0 });
    return { x: g.x + Math.cos(bw.phi) * bw.r * g.R, y: g.y + Math.sin(bw.phi) * bw.r * g.R };
  }

  /* ---------------------------------------------------- BUCLE */
  let lastT = performance.now(), frameSkip = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = clamp((now - lastT) / 1000, 0, 0.1);
    lastT = now;
    for (const tw of tweens) {
      const k = Math.min(1, (now - tw.t0) / tw.ms);
      tw.fn(tw.ease(k));
      if (k >= 1) {
        tweens.delete(tw);
        tw.res();
      }
    }
    if (run) updateRun(dt);
    else {
      // rotor en reposo: gira lentamente
      scene.omega += (0.32 - scene.omega) * (1 - Math.exp(-dt / 2.2));
      scene.rot += scene.omega * dt;
    }
    // la cámara sigue a la bola con suavidad
    if (scene.cam.k > 0) {
      const p = ballWorldXY();
      const f = 1 - Math.exp(-dt * 4.5);
      scene.cam.fx += (p.x - scene.cam.fx) * f;
      scene.cam.fy += (p.y - scene.cam.fy) * f;
    }
    // en reposo basta con ~30 fps
    const busy = run || tweens.size || scene.e > 0;
    if (!busy && ++frameSkip % 2) return;
    render(now);
  }

  /* =====================================================================
     MESA DE APUESTAS (vertical, 3 columnas x 12 filas)
     ===================================================================== */
  const table = $("#table");
  const cells = {};
  function addCell(key, cls, html, area) {
    const b = document.createElement("button");
    b.className = "cell " + cls;
    b.dataset.k = key;
    b.innerHTML = html + '<div class="stk"></div>';
    b.style.gridArea = area;
    b.setAttribute("aria-label", BETS[key].name);
    table.appendChild(b);
    cells[key] = b;
  }
  function buildTable() {
    const deco1 = document.createElement("div");
    deco1.className = "deco";
    deco1.style.gridArea = "1 / 1 / 2 / 3";
    deco1.innerHTML = `En mesa<b id="tblTotal">0 €</b>`;
    table.appendChild(deco1);
    addCell("n0", "zero z", "0", "1 / 3 / 2 / 6");
    for (let r = 0; r < 12; r++)
      for (let c = 0; c < 3; c++) {
        const n = r * 3 + c + 1;
        addCell("n" + n, "n " + colorOf(n), String(n), `${r + 2} / ${c + 3} / ${r + 3} / ${c + 4}`);
      }
    const dz = ["1ª Docena", "2ª Docena", "3ª Docena"];
    for (let d = 0; d < 3; d++) addCell("d" + (d + 1), "doz", `<span>${dz[d]}</span>`, `${2 + d * 4} / 2 / ${6 + d * 4} / 3`);
    const outs = [
      ["low", "1-18<small>FALTA</small>"],
      ["even", "PAR"],
      ["red", '<div class="diamond r"></div><small>ROJO</small>'],
      ["black", '<div class="diamond b"></div><small>NEGRO</small>'],
      ["odd", "IMPAR"],
      ["high", "19-36<small>PASA</small>"],
    ];
    outs.forEach(([k, h], i) => addCell(k, "out", h, `${2 + i * 2} / 1 / ${4 + i * 2} / 2`));
    for (let c = 0; c < 3; c++) addCell("c" + (c + 1), "col", "2:1", `14 / ${c + 3} / 15 / ${c + 4}`);
    const deco2 = document.createElement("div");
    deco2.className = "deco";
    deco2.style.gridArea = "14 / 1 / 15 / 3";
    deco2.innerHTML = "Pleno 35:1";
    table.appendChild(deco2);
  }

  function renderStack(key, pop) {
    const stk = cells[key].querySelector(".stk");
    const amt = bets[key] || 0;
    cells[key].classList.toggle("has", amt > 0);
    if (!amt) {
      stk.innerHTML = "";
      return;
    }
    const parts = breakdown(amt).slice(0, 4).reverse(); // abajo la menor, arriba la mayor
    stk.innerHTML = parts
      .map((v, i) => `<div class="chip ${chipClass(v)}" style="bottom:${i * 3}px">${i === parts.length - 1 ? compact(amt) : ""}</div>`)
      .join("");
    if (pop) {
      stk.classList.remove("pop");
      void stk.offsetWidth;
      stk.classList.add("pop");
    }
  }
  function renderAllStacks() {
    for (const k in cells) renderStack(k);
  }

  /* ---------------------------------------------------- SELECTOR DE FICHAS */
  const chipsEl = $("#chips");
  const chipBtns = {};
  CHIPS.forEach((v) => {
    const b = document.createElement("button");
    b.className = "chipBtn";
    b.setAttribute("aria-label", "Ficha de " + v);
    b.innerHTML = `<div class="chip ${chipClass(v)}">${chipLabel(v)}</div>`;
    b.addEventListener("click", () => {
      if (chipValue !== v) {
        chipValue = v;
        store.set(CHIP_KEY, v);
        S.play("chip");
        AX.haptic("light");
      }
      refreshChips();
    });
    chipsEl.appendChild(b);
    chipBtns[v] = b;
  });
  function refreshChips() {
    const avail = AX.getBalance() - totalOf(bets);
    CHIPS.forEach((v) => {
      chipBtns[v].classList.toggle("sel", v === chipValue);
      chipBtns[v].disabled = state !== "idle";
      chipBtns[v].style.opacity = v > avail && state === "idle" ? 0.45 : "";
    });
  }

  /* ---------------------------------------------------- UI GENERAL */
  const undoBtn = $("#undoBtn"), clearBtn = $("#clearBtn"), repeatBtn = $("#repeatBtn"), doubleBtn = $("#doubleBtn"), spinBtn = $("#spinBtn");
  function refreshUI(animateHud) {
    const total = totalOf(bets);
    const bal = AX.getBalance();
    $("#tblTotal").textContent = AX.money(total);
    $("#spinSub").textContent = total ? "Apuesta " + AX.money(total) : "Coloca tus fichas";
    document.body.classList.toggle("has-bets", total > 0);
    const idle = state === "idle";
    undoBtn.disabled = !idle || !undoStack.length;
    clearBtn.disabled = !idle || !total;
    repeatBtn.disabled = !idle || !Object.keys(lastBets).length;
    doubleBtn.disabled = !idle || !total;
    spinBtn.disabled = !idle;
    hud.setBalance(Math.max(0, bal - (idle ? total : 0)), !!animateHud);
    refreshChips();
  }

  function clearMarks() {
    if (!marksOn) return;
    marksOn = false;
    table.classList.remove("result");
    table.querySelectorAll(".lit,.won,.hit").forEach((c) => c.classList.remove("lit", "won", "hit"));
    table.querySelectorAll(".dolly").forEach((d) => d.remove());
  }

  function snapshot() {
    undoStack.push(Object.assign({}, bets));
    if (undoStack.length > 60) undoStack.shift();
  }

  function flash(keys) {
    keys.forEach((k) => cells[k] && cells[k].classList.add("cover"));
    setTimeout(() => keys.forEach((k) => cells[k] && cells[k].classList.remove("cover")), 260);
  }
  function coveredNumbers(key) {
    const out = [];
    for (let n = 0; n <= 36; n++) if (BETS[key].wins(n)) out.push("n" + n);
    return out;
  }

  function placeBet(key, fromEl) {
    if (state !== "idle") return;
    clearMarks();
    const avail = AX.getBalance() - totalOf(bets);
    let amount = chipValue;
    if (amount > avail) {
      S.play("error");
      AX.haptic("error");
      AX.toast(avail > 0 ? `Saldo insuficiente para una ficha de ${AX.money(amount)}` : "No te queda saldo disponible", "error");
      return;
    }
    snapshot();
    bets[key] = (bets[key] || 0) + amount;
    if (BETS[key].type !== "number") flash(coveredNumbers(key));
    flyChip(fromEl || chipBtns[chipValue], cells[key], amount, () => {
      renderStack(key, true);
      S.play("chip");
      AX.haptic("light");
    });
    refreshUI(true);
  }

  function removeBet(key) {
    if (state !== "idle" || !bets[key]) return;
    snapshot();
    delete bets[key];
    renderStack(key);
    S.play("swoosh");
    AX.haptic("medium");
    const c = AX.center(cells[key]);
    AX.fx.burst(c.x, c.y, { count: 14, speed: 220, colors: "gold", gravity: 300 });
    refreshUI(true);
  }

  /* Ficha volando del selector a la mesa (curva de Bézier) */
  function flyChip(fromEl, toCell, val, done) {
    const a = AX.center(fromEl);
    const b = AX.center(toCell.querySelector(".stk"));
    const f = document.createElement("div");
    f.className = "chip fly " + chipClass(val);
    f.textContent = chipLabel(val);
    document.body.appendChild(f);
    const mx = (a.x + b.x) / 2 + (b.x - a.x) * 0.1, my = Math.min(a.y, b.y) - 70;
    const t0 = performance.now(), dur = 300;
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur);
      const e = E.out(t);
      const x = (1 - e) * (1 - e) * a.x + 2 * (1 - e) * e * mx + e * e * b.x;
      const y = (1 - e) * (1 - e) * a.y + 2 * (1 - e) * e * my + e * e * b.y;
      const s = 1.15 - 0.35 * t;
      f.style.transform = `translate(${x - 15}px,${y - 15}px) scale(${s}) rotate(${t * 220}deg)`;
      if (t < 1) requestAnimationFrame(step);
      else {
        f.remove();
        done && done();
      }
    };
    requestAnimationFrame(step);
  }

  /* Eventos de la mesa: toque = ficha; pulsación larga = retirar */
  let lp = null, suppressClick = false;
  table.addEventListener("pointerdown", (e) => {
    const c = e.target.closest(".cell");
    if (!c) return;
    lp = { c, x: e.clientX, y: e.clientY, t: setTimeout(() => {
      if (bets[c.dataset.k]) {
        removeBet(c.dataset.k);
        suppressClick = true;
      }
      lp = null;
    }, 520) };
  });
  const cancelLp = (e) => {
    if (!lp) return;
    if (e && e.type === "pointermove" && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) < 10) return;
    clearTimeout(lp.t);
    lp = null;
  };
  table.addEventListener("pointermove", cancelLp);
  table.addEventListener("pointerup", cancelLp);
  table.addEventListener("pointercancel", cancelLp);
  table.addEventListener("contextmenu", (e) => e.preventDefault());
  table.addEventListener("click", (e) => {
    const c = e.target.closest(".cell");
    if (!c) return;
    if (suppressClick) {
      suppressClick = false;
      return;
    }
    placeBet(c.dataset.k);
  });

  undoBtn.addEventListener("click", () => {
    if (state !== "idle" || !undoStack.length) return;
    bets = undoStack.pop();
    renderAllStacks();
    S.play("swoosh");
    AX.haptic("light");
    refreshUI(true);
  });
  clearBtn.addEventListener("click", () => {
    if (state !== "idle" || !totalOf(bets)) return;
    snapshot();
    Object.keys(bets).forEach((k, i) => sweepStack(k, i * 25, slotG));
    bets = {};
    S.play("swoosh");
    AX.haptic("medium");
    refreshUI(true);
  });
  repeatBtn.addEventListener("click", () => {
    if (state !== "idle") return;
    const t = totalOf(lastBets);
    if (!t) return;
    if (t > AX.getBalance()) {
      S.play("error");
      AX.toast(`Saldo insuficiente para repetir (${AX.money(t)})`, "error");
      return;
    }
    clearMarks();
    snapshot();
    bets = Object.assign({}, lastBets);
    Object.keys(bets).forEach((k, i) =>
      setTimeout(() => flyChip(chipBtns[chipValue], cells[k], breakdown(bets[k] || 1)[0] || chipValue, () => {
        renderStack(k, true);
        S.play("chip");
      }), i * 60)
    );
    renderAllStacks();
    AX.haptic("tap");
    refreshUI(true);
  });
  doubleBtn.addEventListener("click", () => {
    if (state !== "idle") return;
    const t = totalOf(bets);
    if (!t) return;
    if (t * 2 > AX.getBalance()) {
      S.play("error");
      AX.toast("Saldo insuficiente para doblar", "error");
      return;
    }
    snapshot();
    for (const k in bets) {
      bets[k] *= 2;
      renderStack(k, true);
    }
    S.play("powerup");
    AX.haptic("tap");
    const c = AX.center(table);
    AX.fx.floatText(c.x, c.y, "x2", { color: "#ffcc33", size: 44 });
    refreshUI(true);
  });

  /* Fichas que se recogen (hacia la rueda) */
  function sweepStack(key, delay, to) {
    const stk = cells[key].querySelector(".stk");
    if (!stk.innerHTML) return;
    const clone = stk.cloneNode(true);
    const r = stk.getBoundingClientRect();
    clone.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;margin:0;right:auto;bottom:auto;z-index:850;`;
    document.body.appendChild(clone);
    stk.innerHTML = "";
    cells[key].classList.remove("has");
    const dx = to.x - (r.left + r.width / 2), dy = to.y - (r.top + r.height / 2);
    clone.animate(
      [{ transform: "none", opacity: 1 }, { transform: `translate(${dx * 0.3}px,${dy * 0.3 - 20}px) scale(1.1)`, opacity: 1, offset: 0.3 }, { transform: `translate(${dx}px,${dy}px) scale(.3)`, opacity: 0 }],
      { duration: 560, delay, easing: "cubic-bezier(.5,0,.6,1)", fill: "both" }
    ).onfinish = () => clone.remove();
  }

  /* =====================================================================
     PANEL DE HISTORIAL / CALIENTES Y FRÍOS
     ===================================================================== */
  const badge = (n, extra = "") => `<span class="badge ${colorOf(n)} ${extra}">${n}</span>`;
  function hotCold() {
    const counts = new Array(37).fill(0), lastSeen = new Array(37).fill(Infinity);
    history.forEach((n, i) => {
      counts[n]++;
      if (lastSeen[n] === Infinity) lastSeen[n] = i;
    });
    const nums = [...Array(37).keys()];
    const hot = nums.filter((n) => counts[n] > 0).sort((a, b) => counts[b] - counts[a] || lastSeen[a] - lastSeen[b]);
    const cold = nums.slice().sort((a, b) => counts[a] - counts[b] || lastSeen[b] - lastSeen[a] || a - b);
    return { counts, lastSeen, hot, cold };
  }
  function renderInfo(fresh) {
    const lb = $("#lastBadge");
    if (history.length) {
      const n = history[0];
      lb.className = "badge big " + colorOf(n) + (fresh ? " fresh" : "");
      lb.textContent = n;
      $("#lastDesc").textContent = describe(n).slice(0, 3).join(" · ");
    } else {
      lb.className = "badge big none";
      lb.textContent = "–";
      $("#lastDesc").textContent = "¡Hagan juego!";
    }
    const strip = $("#histStrip");
    const rest = history.slice(1, 12);
    strip.innerHTML = rest.length ? rest.map((n, i) => badge(n, fresh && i === 0 ? "fresh" : "")).join("") : `<span class="empty">${history.length ? "Sin tiradas anteriores" : "Sin tiradas todavía"}</span>`;
    const hc = hotCold();
    const enough = history.length >= 5;
    $("#hot").innerHTML = enough ? hc.hot.slice(0, 3).map((n) => badge(n, "hot")).join("") : '<span class="empty" style="font-size:10px;color:var(--ax-muted)">—</span>';
    $("#cold").innerHTML = enough ? hc.cold.slice(0, 3).map((n) => badge(n, "cold")).join("") : '<span class="empty" style="font-size:10px;color:var(--ax-muted)">—</span>';
    const tot = history.length || 1;
    const nr = history.filter((n) => colorOf(n) === "r").length, nz = history.filter((n) => n === 0).length, nb = history.length - nr - nz;
    const pr = history.length ? (nr / tot) * 100 : 48.6, pz = history.length ? (nz / tot) * 100 : 2.8, pb = history.length ? (nb / tot) * 100 : 48.6;
    $("#rbR").style.width = pr + "%";
    $("#rbZ").style.width = pz + "%";
    $("#rbB").style.width = pb + "%";
    $("#lgR").textContent = "Rojo " + Math.round(history.length ? pr : 0) + "%";
    $("#lgZ").textContent = "0 · " + Math.round(history.length ? pz : 0) + "%";
    $("#lgB").textContent = "Negro " + Math.round(history.length ? pb : 0) + "%";
  }

  function openStats() {
    if (state !== "idle") return;
    S.play("tap");
    const hc = hotCold();
    const h = history;
    const cnt = (f) => h.filter(f).length;
    const pct = (v) => (h.length ? Math.round((v / h.length) * 100) : 0);
    const rows = [
      ["Rojo", cnt((n) => colorOf(n) === "r")],
      ["Negro", cnt((n) => colorOf(n) === "b")],
      ["Cero", cnt((n) => n === 0)],
      ["Par", cnt((n) => n && n % 2 === 0)],
      ["Impar", cnt((n) => n % 2 === 1)],
      ["Falta 1-18", cnt((n) => n >= 1 && n <= 18)],
      ["Pasa 19-36", cnt((n) => n >= 19)],
    ];
    AX.modal({
      title: "Estadísticas",
      html: h.length
        ? `<div class="stats-k">Últimas ${h.length} tiradas</div>
           <div class="stats-grid">${h.map((n) => badge(n)).join("")}</div>
           <div class="stats-k">🔥 Calientes</div>
           <div class="stats-row">${hc.hot.slice(0, 5).map((n) => `<span class="stats-pill">${badge(n, "hot")}×${hc.counts[n]}</span>`).join("")}</div>
           <div class="stats-k">❄️ Fríos (sin salir hace más)</div>
           <div class="stats-row">${hc.cold.slice(0, 5).map((n) => `<span class="stats-pill c">${badge(n, "cold")}${hc.lastSeen[n] === Infinity ? "nunca" : hc.lastSeen[n] + " tiradas"}</span>`).join("")}</div>
           <div class="stats-bars" style="margin-top:12px">${rows.map(([k, v]) => `<span>${k}</span><div class="bar"><i style="width:${pct(v)}%"></i></div><span>${pct(v)}%</span>`).join("")}</div>`
        : "<p>Todavía no hay tiradas. ¡Haz tu primera apuesta!</p>",
      buttons: [{ label: "Cerrar", kind: "gold", value: true }],
    });
  }
  $("#info").addEventListener("click", openStats);

  helpBtn.addEventListener("click", () => {
    S.play("tap");
    AX.modal({
      title: "Ruleta europea",
      html: `<table class="pay-table">
          <tr><td>Pleno (un número, 0-36)</td><td>35 a 1</td></tr>
          <tr><td>Docena (1-12, 13-24, 25-36)</td><td>2 a 1</td></tr>
          <tr><td>Columna (2:1)</td><td>2 a 1</td></tr>
          <tr><td>Rojo / Negro</td><td>1 a 1</td></tr>
          <tr><td>Par / Impar</td><td>1 a 1</td></tr>
          <tr><td>Falta (1-18) / Pasa (19-36)</td><td>1 a 1</td></tr>
        </table>
        <ul class="help-list">
          <li>Elige una ficha abajo y <b>toca la mesa</b> para apostar.</li>
          <li><b>Mantén pulsada</b> una casilla para retirar sus fichas.</li>
          <li>Con el <b>0</b> solo gana el pleno al 0.</li>
          <li>Durante el giro, <b>toca la pantalla</b> para acelerar.</li>
          <li>Toca el panel de historial para ver las estadísticas.</li>
        </ul>`,
      buttons: [{ label: "¡A jugar!", kind: "gold", value: true }],
    });
  });

  /* =====================================================================
     GIRO COMPLETO: cinemática
     ===================================================================== */
  function drawNumber() {
    const keys = Object.keys(bets);
    if (guided && keys.length) {
      guided = false;
      const k = keys[0];
      let cand = [];
      for (let n = 0; n <= 36; n++) if (BETS[k].wins(n) && (n !== 0 || k === "n0")) cand.push(n);
      if (cand.length) return cand[Math.floor(Math.random() * cand.length)];
    }
    return Math.floor(Math.random() * 37) % 37;
  }

  const spinInfo = { bet: $("#siBet"), hint: $("#siHint") };
  backdrop.addEventListener("pointerdown", () => {
    if (run && run.turbo === 1) {
      run.turbo = 2.6;
      document.body.classList.add("turbo");
      spinInfo.hint.textContent = "⏩ Acelerando";
      S.play("whoosh");
    }
  });

  async function spin() {
    if (state !== "idle") return;
    const total = totalOf(bets);
    if (!total) {
      S.play("error");
      AX.haptic("error");
      AX.toast("Coloca tus fichas en la mesa primero", "info");
      const bar = $("#bar");
      bar.classList.remove("nudge");
      void bar.offsetWidth;
      bar.classList.add("nudge");
      return;
    }
    const preBal = AX.getBalance();
    if (!AX.spend(total)) {
      S.play("error");
      AX.toast("Saldo insuficiente para estas apuestas", "error");
      return;
    }
    clearMarks();
    state = "spin";
    const n = drawNumber();
    const roundBets = Object.assign({}, bets);
    const payout = payoutOf(roundBets, n);
    lastBets = Object.assign({}, roundBets);
    store.set(LASTBETS_KEY, lastBets);
    store.set(PENDING_KEY, { n, payout, total, hist: false, t: Date.now() });
    undoStack = [];
    refreshUI(false);
    document.body.classList.add("spinning");
    document.body.classList.remove("turbo");
    spinInfo.bet.textContent = "En juego: " + AX.money(total);
    spinInfo.hint.textContent = "Toca para acelerar";

    // ¡Lanzamiento!
    measure();
    S.play("whoosh");
    sLaunch();
    AX.haptic("medium");
    rollStart();
    backdrop.classList.add("on");
    scene.glowAmt = 0;
    tweenVal(scene, "e", 1, 800, E.inOut);
    const done = startRun(n);
    const bannerT = setTimeout(() => AX.cine.banner("¡NO VA MÁS!", { sub: "Las apuestas están cerradas", color: "rgba(200, 16, 46, 0.92)", sound: "swoosh" }), 1300);
    const b = await done;
    clearTimeout(bannerT);
    rollStop();
    document.body.classList.remove("turbo");

    // La bola se detiene: impacto y casilla iluminada
    scene.glowIdx = b.idx;
    tweenVal(scene, "glowAmt", 1, 300, E.out);
    const bp = ballScreen();
    S.play("impact");
    AX.haptic("heavy");
    AX.fx.glow(bp.x, bp.y, { size: 90, color: "rgba(255,240,180,0.9)", life: 0.5 });
    AX.fx.sparks(bp.x, bp.y, { count: 26, speed: 500, colors: "gold" });
    await sleep(500);

    // Historial
    history.unshift(n);
    history = history.slice(0, MAX_HISTORY);
    saveHistory();
    store.set(PENDING_KEY, { n, payout, total, hist: true, t: Date.now() });

    // Revelación del número
    const rvP = showReveal(n);
    tweenVal(scene.cam, "k", 0, 900, E.inOut);
    await rvP;
    document.body.classList.remove("spinning");
    backdrop.classList.remove("on");
    await tweenVal(scene, "e", 0, 700, E.inOut);
    renderInfo(true);
    state = "result";
    await resolveTable(n, roundBets, payout, total, preBal);
    state = "idle";
    refreshUI(false);
    setTimeout(() => {
      if (!marksOn) return;
      table.classList.remove("result");
      table.querySelectorAll(".lit,.won").forEach((c) => c.classList.remove("lit", "won"));
    }, 2500);
  }

  function showReveal(n) {
    const rv = $("#reveal");
    const c = colorOf(n);
    rv.innerHTML = `<div class="rv-rays"></div><div class="rv-disc">${n}</div><div class="rv-tags">${describe(n)
      .map((t, i) => `<span style="animation-delay:${0.35 + i * 0.08}s">${t}</span>`)
      .join("")}</div>`;
    rv.className = "show " + c;
    const col = c === "r" ? "#ff3b5c" : c === "z" ? "#2bff88" : "#b9a8ff";
    S.play("boom");
    S.play("shimmer");
    AX.haptic("medium");
    setTimeout(() => {
      const p = AX.center(rv.querySelector(".rv-disc"));
      AX.fx.shockwave(p.x, p.y, { color: col, radius: Math.max(W, H) * 0.7, rings: 2, width: 12 });
      AX.fx.sparks(p.x, p.y, { count: 50, speed: 800, colors: c === "r" ? "fire" : c === "z" ? "green" : "ice" });
    }, 300);
    return sleep(1700).then(() => {
      rv.classList.add("out");
      return sleep(380);
    }).then(() => {
      rv.className = "";
      rv.innerHTML = "";
    });
  }

  async function resolveTable(n, roundBets, payout, total, preBal) {
    marksOn = true;
    table.classList.add("result");
    for (const k in cells) if (BETS[k].wins(n)) cells[k].classList.add("lit");
    const hitCell = cells["n" + n];
    hitCell.classList.add("hit");
    const dolly = document.createElement("span");
    dolly.className = "dolly";
    hitCell.appendChild(dolly);
    // asegurar que la casilla ganadora sea visible
    const wrap = $("#tableWrap");
    const hr = hitCell.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    if (hr.top < wr.top || hr.bottom > wr.bottom) wrap.scrollBy({ top: hr.top - wr.top - wr.height / 2 + hr.height / 2, behavior: "smooth" });
    await sleep(250);
    const hc = AX.center(hitCell);
    AX.fx.shockwave(hc.x, hc.y, { color: "#fff3b0", radius: 120, width: 6 });
    S.play("shimmer");

    const winners = Object.keys(roundBets).filter((k) => BETS[k].wins(n));
    const losers = Object.keys(roundBets).filter((k) => !BETS[k].wins(n));
    await sleep(350);
    if (losers.length) {
      S.play("swoosh");
      losers.forEach((k, i) => {
        delete bets[k];
        sweepStack(k, i * 40, slotG);
      });
      refreshUI(false);
      await sleep(winners.length ? 450 : 650);
    }

    if (!winners.length) {
      store.del(PENDING_KEY);
      bets = {};
      const after = AX.getBalance();
      if (after <= 0) {
        await AX.cine.defeat({ title: "¡Sin fichas!", subtitle: "La banca gana esta vez…" });
        AX.toast("Te has quedado sin saldo. ¡Prueba suerte en otros juegos del menú!", "info", 4000);
      } else if (total >= preBal * 0.4) {
        await AX.cine.defeat({ title: "¡La banca gana!", subtitle: "Pierdes " + AX.money(total) });
      } else {
        S.play("lose");
        AX.haptic("error");
        table.classList.remove("lose");
        void table.offsetWidth;
        table.classList.add("lose");
        const c = AX.center($("#tableWrap"));
        AX.fx.floatText(c.x, c.y, "SIN PREMIO", { color: "#ff3b5c", size: 30, duration: 1500 });
      }
      return;
    }

    // Ganadoras: la pila crece con el premio
    let pleno = false;
    S.play("coin");
    winners.forEach((k, i) => {
      const win = roundBets[k] * BETS[k].mult;
      if (BETS[k].type === "number") pleno = true;
      bets[k] = win;
      cells[k].classList.add("won");
      setTimeout(() => {
        renderStack(k, true);
        const c = AX.center(cells[k]);
        AX.fx.floatText(c.x, c.y - 10, "+" + AX.fmt(win), { color: "#ffcc33", size: 22 });
        AX.fx.sparks(c.x, c.y, { count: 22, speed: 420 });
        S.play("chip");
      }, i * 140);
    });
    AX.haptic("win");
    await sleep(700 + winners.length * 140);

    const ratio = payout / total;
    const profit = payout - total;
    if (pleno) {
      // ¡PLENO! momento épico
      const c = AX.center(hitCell);
      AX.fx.flash("#ffffff", 450, 0.75);
      AX.fx.shockwave(c.x, c.y, { color: "#ffcc33", radius: Math.max(W, H), rings: 3, width: 18 });
      AX.fx.sparks(c.x, c.y, { count: 80, speed: 1100 });
      S.play("boom");
      AX.haptic("bigwin");
      await sleep(350);
      await AX.cine.bigWin(payout, { bet: total, tier: ratio >= 20 ? "epic" : "mega", title: "¡PLENO!", label: `Número ${n} · paga 35 a 1` });
    } else if (ratio >= 3) {
      await AX.cine.bigWin(payout, { bet: total, label: winners.map((k) => BETS[k].name).join(" + ") });
    } else if (profit > 0) {
      S.play("win");
      AX.fx.confetti({ count: 70, duration: 500 });
    }

    // Las fichas ganadoras vuelan al saldo
    const to = hud.center();
    winners.forEach((k, i) => {
      setTimeout(() => {
        const c = AX.center(cells[k]);
        sweepStack(k, 0, to);
        AX.fx.coinsTo(c, to, { count: clamp(Math.round(4 + BETS[k].mult / 2.5), 5, 18) });
      }, i * 120);
    });
    await sleep(650);
    store.del(PENDING_KEY);
    AX.addBalance(payout);
    S.play("cash");
    bets = {};
    if (profit < 0) AX.toast(`Recuperas ${AX.money(payout)} de ${AX.money(total)}`, "info");
    else if (profit === 0) AX.toast("Ni ganas ni pierdes", "info");
    await sleep(500);
  }

  /* Cobro de una jugada interrumpida (p.ej. se cerró la página durante el giro) */
  function settlePending() {
    const p = store.get(PENDING_KEY, null);
    if (!p || !Number.isInteger(p.n)) return;
    store.del(PENDING_KEY);
    if (!p.hist) {
      history.unshift(p.n);
      history = history.slice(0, MAX_HISTORY);
      saveHistory();
    }
    if (p.payout > 0) {
      AX.addBalance(p.payout);
      setTimeout(() => AX.toast(`Jugada anterior (${p.n}) cobrada: +${AX.money(p.payout)}`, "gold", 4000), 600);
    }
  }

  /* =====================================================================
     ARRANQUE
     ===================================================================== */
  slotEl.addEventListener("click", () => spin());
  spinBtn.addEventListener("click", () => spin());
  hud.balanceEl.addEventListener("dblclick", () => {
    if (state !== "idle") return;
    guided = !guided;
    AX.toast(guided ? "Modo guiado ACTIVADO" : "Modo guiado DESACTIVADO", guided ? "gold" : "info", 1800);
    S.play(guided ? "powerup" : "tap");
  });
  window.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest(".ax-modal")) return;
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      if (run && run.turbo === 1) backdrop.dispatchEvent(new Event("pointerdown"));
      else spin();
    } else if ((e.key === "z" || e.key === "Backspace") && state === "idle") undoBtn.click();
  });
  window.addEventListener("storage", (e) => {
    if (e.key === AX.KEYS.BALANCE && state === "idle") refreshUI(false);
    if (e.key === HISTORY_KEY && state === "idle") {
      history = loadHistory();
      renderInfo(false);
    }
  });
  window.addEventListener("focus", () => state === "idle" && refreshUI(false));
  let rsT = 0;
  const onResize = () => {
    clearTimeout(rsT);
    rsT = setTimeout(measure, 60);
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(slotEl);
  $("#tableWrap").addEventListener("scroll", () => {}, { passive: true });

  buildTable();
  settlePending();
  if (history.length) {
    scene.ball.psi = IDX[history[0]] * PA;
    scene.glowIdx = IDX[history[0]];
    scene.glowAmt = 0.45;
  }
  renderInfo(false);
  measure();
  refreshUI(false);
  requestAnimationFrame(frame);

  // Re-renderizar la rueda cuando cargue la fuente Bungee
  if (document.fonts && document.fonts.load) {
    Promise.race([document.fonts.load("40px Bungee"), sleep(3000)]).then(() => {
      if (document.fonts.check && document.fonts.check("40px Bungee")) prerender(wantedLayerR());
    });
  }

  // Cinemática de entrada con una miniatura real de la rueda
  let iconHtml = "🎡";
  try {
    const sz = 300, tc = mkCanvas(sz), tg = tc.getContext("2d");
    const s = sz / (2 * M);
    tg.drawImage(layers.bowl, 0, 0, sz, sz);
    tg.save();
    tg.translate(sz / 2, sz / 2);
    tg.rotate(-0.3);
    tg.drawImage(layers.rotor, -sz / 2, -sz / 2, sz, sz);
    tg.restore();
    tg.drawImage(layers.light, 0, 0, sz, sz);
    tg.fillStyle = "#fff";
    tg.beginPath();
    tg.arc(sz / 2 + s * R_POCKET * Math.cos(-1.1), sz / 2 + s * R_POCKET * Math.sin(-1.1), s * R_BALL, 0, TAU);
    tg.fill();
    iconHtml = `<img class="intro-wheel" alt="" src="${tc.toDataURL("image/png")}">`;
  } catch (e) {}
  AX.cine.intro({ title: "Ruleta", subtitle: "Europea · Pleno 35 a 1", icon: iconHtml, color: "#c8102e", once: true });

  // Gancho de depuración/pruebas (solo lectura salvo `place`)
  window.__ruleta = {
    get state() { return state; },
    get bets() { return Object.assign({}, bets); },
    get history() { return history.slice(); },
    ballNumber() {
      if (scene.ball.psi == null) return null;
      return ORDER[Math.round(mod(scene.ball.psi, TAU) / PA) % 37];
    },
    place(key, chip) {
      if (chip) chipValue = chip;
      placeBet(key);
    },
    spin,
  };
})();
</script>
</body>
</html>
