<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Blackjack · Gran Juego</title>
<link rel="stylesheet" href="../shared/arcade.css">
<script src="../shared/arcade.js"></script>
<style>
:root {
  --cw: 76px;
  --ch: 106px;
  --pcw: 76px;
  --bar-h: 140px;
  --chip: 50px;
  --felt1: #13795f;
  --felt2: #0a4c3e;
  --felt3: #052a24;
}

/* ------------------------------------------------------------- FELT */
#felt {
  position: fixed;
  left: 0; right: 0; top: 0;
  bottom: calc(var(--bar-h) + var(--ax-safe-bottom) - 26px);
  border-radius: 0 0 50% 50% / 0 0 70px 70px;
  background:
    radial-gradient(ellipse 70% 42% at 50% 46%, rgba(120, 255, 210, 0.16), transparent 70%),
    repeating-linear-gradient(35deg, rgba(0, 0, 0, 0.045) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(-35deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 4px),
    radial-gradient(ellipse 130% 95% at 50% 32%, var(--felt1) 0%, var(--felt2) 48%, var(--felt3) 82%, #031511 100%);
  box-shadow:
    inset 0 0 110px rgba(0, 0, 0, 0.7),
    inset 0 -18px 30px rgba(0, 0, 0, 0.45),
    0 7px 0 0 #2b170a,
    0 10px 0 0 #6b4210,
    0 12px 0 0 #e0ac43,
    0 14px 0 0 #3a1f08,
    0 18px 50px 6px rgba(139, 92, 255, 0.4),
    0 0 90px 10px rgba(43, 255, 136, 0.12);
  z-index: 0;
  overflow: hidden;
}
#felt::before {
  /* línea dorada interior */
  content: "";
  position: absolute;
  inset: -2px 12px 12px;
  border-radius: 0 0 50% 50% / 0 0 62px 62px;
  border: 1.5px solid rgba(255, 210, 110, 0.32);
  border-top: 0;
  pointer-events: none;
}
#felt::after {
  /* reflejo de lámpara que respira */
  content: "";
  position: absolute;
  left: 50%; top: 40%;
  width: 140vmax; height: 140vmax;
  margin: -70vmax 0 0 -70vmax;
  background: radial-gradient(circle, rgba(255, 245, 200, 0.07), transparent 40%);
  animation: lamp 7s ease-in-out infinite;
  pointer-events: none;
}
@keyframes lamp { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }

/* ------------------------------------------------------------- TABLE */
#table {
  position: fixed;
  z-index: 2;
  top: calc(var(--ax-safe-top) + var(--ax-hud-h));
  bottom: calc(var(--bar-h) + var(--ax-safe-bottom));
  left: 50%;
  width: min(100%, 560px);
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 2px 10px 6px;
}

/* ----- zona del crupier ----- */
#dealerZone {
  position: relative;
  height: calc(var(--ch) + 38px);
  flex: none;
}
#dealer {
  position: absolute;
  left: calc(var(--cw) * 0.82 + 14px);
  right: calc(var(--cw) * 0.82 + 14px);
  top: 4px;
  bottom: 0;
}
#dealer .cards { position: relative; height: calc(var(--ch) + 6px); }
#dealer .score { top: calc(var(--ch) + 10px); }

#shoe, #discard {
  position: absolute;
  top: 6px;
  width: calc(var(--cw) * 0.82);
  height: calc(var(--cw) * 1.25);
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  color: #fff;
}
#shoe { right: 0; }
#discard { left: 0; cursor: default; }
.shoe-body {
  position: absolute;
  inset: 0 0 18px 0;
  border-radius: 10px 10px 14px 14px;
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.18), transparent 40%),
    linear-gradient(180deg, #2a2050 0%, #120c26 70%, #0a0716 100%);
  border: 1px solid rgba(255, 214, 120, 0.55);
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55), inset 0 0 14px rgba(139, 92, 255, 0.35), 0 0 16px rgba(139, 92, 255, 0.35);
  transform: perspective(300px) rotateX(18deg);
  overflow: hidden;
}
.shoe-body::before {
  /* ventana/boca */
  content: "";
  position: absolute;
  left: 12%; right: 12%; bottom: 10%;
  height: 34%;
  border-radius: 6px;
  background: linear-gradient(180deg, #050309, #1a1033);
  box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.9);
}
.shoe-card {
  position: absolute;
  left: 16%; right: 16%; bottom: 16%;
  height: 26%;
  border-radius: 4px 4px 2px 2px;
  font-size: calc(var(--cw) * 0.5);
  overflow: hidden;
  transform: rotate(-4deg);
}
.shoe-mouth { position: absolute; left: 50%; bottom: 22px; width: 2px; height: 2px; }
.shoe-count, .discard-count {
  position: absolute;
  left: 50%; bottom: 0;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.06em;
  white-space: nowrap;
  padding: 2px 7px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: #ffe9a6;
}
.shoe-count b { font-variant-numeric: tabular-nums; }
.shoe-meter {
  position: absolute; left: 14%; right: 14%; top: 14%; height: 4px;
  border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden;
}
.shoe-meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--ax-cyan), var(--ax-green)); box-shadow: 0 0 8px var(--ax-cyan); transition: width 0.4s; }
.shoe-meter.low i { background: linear-gradient(90deg, var(--ax-red), var(--ax-gold)); box-shadow: 0 0 8px var(--ax-red); }
#discard .tray {
  position: absolute;
  inset: 0 6px 18px 6px;
  border-radius: 8px;
  border: 1.5px dashed rgba(255, 214, 120, 0.25);
}
#discard .pile { position: absolute; left: 50%; top: 46%; font-size: calc(var(--cw) * 0.5); }
#discard .pile .cback { position: absolute; left: -0.5em; top: -0.7em; }

/* ----- zona central (textos del tapete) ----- */
#mid {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
#arcs {
  width: 100%;
  max-width: 540px;
  height: auto;
  display: block;
  overflow: visible;
  pointer-events: none;
}
#arcs .a1 { font-family: var(--ax-display); font-size: 25px; letter-spacing: 1.5px; fill: url(#goldg); filter: drop-shadow(0 2px 0 rgba(60, 30, 0, 0.6)); }
#arcs .a2 { font-family: var(--ax-font); font-weight: 800; font-size: 10.5px; letter-spacing: 2.4px; fill: rgba(220, 255, 240, 0.55); }
#arcs .line { fill: none; stroke: rgba(255, 210, 110, 0.35); stroke-width: 1.2; }
#arcs .line2 { fill: none; stroke: rgba(255, 210, 110, 0.18); stroke-width: 1; stroke-dasharray: 3 5; }
#status {
  position: absolute;
  left: 50%; top: 4%;
  transform: translateX(-50%);
  max-width: 78%;
  padding: 5px 14px;
  border-radius: 99px;
  background: rgba(4, 20, 16, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.14);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: #e9fff6;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  z-index: 3;
}
#status.pop { animation: statusPop 0.35s cubic-bezier(0.2, 1.5, 0.4, 1); }
#status.gold { color: #ffe9a6; border-color: rgba(255, 204, 51, 0.6); box-shadow: 0 0 16px rgba(255, 204, 51, 0.35); }
#status.red { color: #ffd0d8; border-color: rgba(255, 59, 92, 0.6); box-shadow: 0 0 16px rgba(255, 59, 92, 0.3); }
#status.green { color: #c8ffe1; border-color: rgba(43, 255, 136, 0.6); box-shadow: 0 0 16px rgba(43, 255, 136, 0.3); }
@keyframes statusPop { 0% { transform: translateX(-50%) scale(0.7); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
#streak {
  position: absolute;
  left: 50%; bottom: 2%;
  transform: translateX(-50%) scale(0);
  padding: 4px 12px;
  border-radius: 99px;
  font-family: var(--ax-display);
  font-size: 12px;
  letter-spacing: 0.05em;
  white-space: nowrap;
  color: #fff3d0;
  background: linear-gradient(180deg, rgba(255, 120, 30, 0.9), rgba(160, 30, 10, 0.9));
  border: 1px solid rgba(255, 220, 140, 0.8);
  box-shadow: 0 0 16px rgba(255, 120, 30, 0.6);
  transition: transform 0.4s cubic-bezier(0.2, 1.5, 0.4, 1);
  z-index: 3;
}
#streak.on { transform: translateX(-50%) scale(1); }
#streak.l3 { background: linear-gradient(180deg, #ff5e7a, #a0105a); box-shadow: 0 0 22px rgba(255, 47, 179, 0.8); animation: streakPulse 1s ease-in-out infinite; }
#streak.l5 { background: linear-gradient(180deg, #b38bff, #3a14a0); box-shadow: 0 0 26px rgba(139, 92, 255, 0.95), 0 0 50px rgba(34, 228, 255, 0.5); animation: streakPulse 0.7s ease-in-out infinite; }
@keyframes streakPulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
#insSpot {
  position: absolute;
  left: 4px; top: 4%;
  display: none;
  align-items: center;
  gap: 6px;
  padding: 3px 9px 3px 4px;
  border-radius: 99px;
  background: rgba(0, 40, 60, 0.6);
  border: 1px solid rgba(34, 228, 255, 0.6);
  font-size: 11px;
  font-weight: 800;
  color: #cff8ff;
  box-shadow: 0 0 12px rgba(34, 228, 255, 0.35);
  z-index: 3;
}
#insSpot.on { display: flex; animation: statusPop2 0.4s cubic-bezier(0.2, 1.5, 0.4, 1); }
#insSpot .chip { --chip: 24px; }
@keyframes statusPop2 { from { transform: scale(0.5); opacity: 0; } to { transform: none; opacity: 1; } }

/* ----- zona del jugador ----- */
#playerZone {
  position: relative;
  flex: none;
  height: calc(var(--pcw) * 1.4 + 90px);
}
#hands {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
#table.split #hands { grid-template-columns: 1fr 1fr; }
.hand.pl {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.hand.pl .score { position: relative; align-self: center; left: auto; top: 0; margin-bottom: 4px; }
.hand.pl .cards { position: relative; height: calc(var(--pcw) * 1.4 + 6px); }
.hand.pl .card { font-size: var(--pcw); }
.cards::before {
  /* aura de mano activa */
  content: "";
  position: absolute;
  top: -7px;
  bottom: -5px;
  left: var(--fanL, 30%);
  width: var(--fanW, 40%);
  border-radius: 14px;
  border: 2px solid rgba(255, 214, 90, 0.85);
  box-shadow: 0 0 18px rgba(255, 204, 51, 0.6), inset 0 0 18px rgba(255, 204, 51, 0.3);
  opacity: 0;
  transform: scale(0.94);
  transition: opacity 0.3s, transform 0.3s, left 0.35s, width 0.35s;
  pointer-events: none;
}
.hand.active .cards::before { opacity: 1; transform: none; animation: activeGlow 1.4s ease-in-out infinite; }
@keyframes activeGlow { 0%, 100% { box-shadow: 0 0 14px rgba(255, 204, 51, 0.45), inset 0 0 14px rgba(255, 204, 51, 0.2); } 50% { box-shadow: 0 0 26px rgba(255, 204, 51, 0.85), inset 0 0 22px rgba(255, 204, 51, 0.35); } }
.hand.pl.waiting .cards { opacity: 0.6; filter: saturate(0.7); transition: opacity 0.3s, filter 0.3s; }

/* Burbuja de puntuación */
.score {
  position: absolute;
  left: 50%;
  transform: translateX(-50%) scale(0);
  min-width: 38px;
  height: 24px;
  padding: 0 10px;
  border-radius: 99px;
  display: grid;
  place-items: center;
  font-family: var(--ax-display);
  font-size: 13px;
  line-height: 1;
  color: #fff;
  white-space: nowrap;
  background: linear-gradient(180deg, #6b45e6, #3b1aa0);
  border: 1px solid rgba(220, 205, 255, 0.6);
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5), 0 0 12px rgba(139, 92, 255, 0.55);
  transition: transform 0.35s cubic-bezier(0.2, 1.6, 0.4, 1), background 0.3s;
  z-index: 40;
}
.hand.pl .score { transform: scale(0); }
.score.on { transform: translateX(-50%) scale(1); }
.hand.pl .score.on { transform: scale(1); }
.score.pop { animation: scorePop 0.4s cubic-bezier(0.2, 1.6, 0.4, 1); }
@keyframes scorePop { 0% { scale: 1; } 40% { scale: 1.45; } 100% { scale: 1; } }
.score.s21 { background: linear-gradient(180deg, #ffe066, #e08a00); color: #3a1d00; border-color: #fff1b0; box-shadow: 0 0 18px rgba(255, 204, 51, 0.9); }
.score.bj { background: linear-gradient(180deg, #fff3b0, #ffcc33 40%, #e08a00); color: #3a1d00; border-color: #fff; box-shadow: 0 0 24px rgba(255, 204, 51, 1); }
.score.bust { background: linear-gradient(180deg, #ff5e7a, #a00a2a); border-color: #ffc2cc; box-shadow: 0 0 16px rgba(255, 59, 92, 0.85); }
.score small { font-family: var(--ax-font); font-weight: 800; font-size: 9px; letter-spacing: 0.12em; margin-right: 5px; opacity: 0.8; }

/* Zona de apuesta */
.spot {
  position: relative;
  height: 56px;
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.5s cubic-bezier(0.3, 1.3, 0.4, 1);
  transform-origin: 50% 50%;
}
.ring {
  position: relative;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 2px dashed rgba(255, 214, 120, 0.55);
  box-shadow: 0 0 14px rgba(255, 204, 51, 0.2), inset 0 0 14px rgba(255, 204, 51, 0.15);
  background: radial-gradient(circle, rgba(0, 0, 0, 0.18), transparent 70%);
}
.stack { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.stack .chip { position: absolute; left: calc(var(--chip) / -2); top: calc(var(--chip) / -2); --chip: 42px; }
.amt {
  position: absolute;
  left: calc(50% + 34px);
  top: 50%;
  transform: translateY(-50%);
  padding: 3px 9px;
  border-radius: 99px;
  font-weight: 900;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  color: #ffe9a6;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid rgba(255, 204, 51, 0.45);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
}
.amt.on { opacity: 1; }
.hint {
  position: absolute;
  left: 50%; top: 100%;
  transform: translateX(-50%);
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.25em;
  color: rgba(255, 233, 166, 0.85);
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s;
  text-shadow: 0 0 8px rgba(255, 204, 51, 0.6);
}
#table.betting .hand.pl .spot { transform: translateY(calc(var(--pcw) * -0.62)) scale(1.65); }
#table.betting .hand.pl .ring { border-color: rgba(255, 214, 120, 0.9); animation: ringGlow 2s ease-in-out infinite; }
#table.betting .hand.pl .ring::before {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 1px solid rgba(255, 214, 120, 0.4);
  border-left-color: transparent;
  border-right-color: transparent;
  animation: ax-spin 6s linear infinite;
}
#table.betting .hand.pl .hint { opacity: 1; }
#table.betting .hand.pl .hint.hide { opacity: 0; }
@keyframes ringGlow { 0%, 100% { box-shadow: 0 0 14px rgba(255, 204, 51, 0.3), inset 0 0 14px rgba(255, 204, 51, 0.2); } 50% { box-shadow: 0 0 26px rgba(255, 204, 51, 0.7), inset 0 0 20px rgba(255, 204, 51, 0.35); } }

/* Resultado por mano */
.tag {
  position: absolute;
  left: 50%;
  top: calc(var(--pcw) * 1.4 - 2px);
  transform: translate(-50%, 0) scale(0);
  padding: 4px 11px;
  border-radius: 8px;
  font-family: var(--ax-display);
  font-size: 12px;
  white-space: nowrap;
  z-index: 60;
  transition: transform 0.4s cubic-bezier(0.2, 1.6, 0.4, 1);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
}
.tag.on { transform: translate(-50%, 0) scale(1); }
.tag.win { background: linear-gradient(180deg, #33f59a, #0aa358); color: #00321a; box-shadow: 0 0 18px rgba(43, 255, 136, 0.7); }
.tag.bj { background: linear-gradient(180deg, #fff3b0, #ffcc33 45%, #e08a00); color: #3a1d00; box-shadow: 0 0 22px rgba(255, 204, 51, 0.9); }
.tag.push { background: linear-gradient(180deg, #d6d3f0, #8a86b0); color: #1d1a3a; }
.tag.lose, .tag.bust { background: linear-gradient(180deg, #5a2030, #2a0a14); color: #ffb3c0; border: 1px solid rgba(255, 59, 92, 0.6); }

.stamp {
  position: absolute;
  left: 50%;
  top: calc(var(--pcw) * 0.7 + 28px);
  z-index: 70;
  font-family: var(--ax-display);
  font-size: clamp(18px, 6.5vw, 30px);
  white-space: nowrap;
  color: #ffd6dd;
  padding: 2px 12px;
  border: 3px solid #ff3b5c;
  border-radius: 10px;
  background: rgba(60, 0, 12, 0.55);
  text-shadow: 0 0 10px #ff3b5c, 0 0 24px #ff3b5c;
  box-shadow: 0 0 20px rgba(255, 59, 92, 0.6), inset 0 0 14px rgba(255, 59, 92, 0.4);
  transform: translate(-50%, -50%) rotate(-10deg) scale(0);
  opacity: 0;
  pointer-events: none;
}
.stamp.on { animation: stamp 0.5s cubic-bezier(0.2, 1.5, 0.4, 1) forwards; }
.stamp.green { color: #d9ffe9; border-color: var(--ax-green); background: rgba(0, 50, 20, 0.6); text-shadow: 0 0 10px var(--ax-green), 0 0 24px var(--ax-green); box-shadow: 0 0 20px rgba(43, 255, 136, 0.6), inset 0 0 14px rgba(43, 255, 136, 0.4); }
.hand.split-hand .stamp { font-size: 16px; }
#dealer .stamp { top: calc(var(--ch) * 0.5); }
@keyframes stamp {
  0% { transform: translate(-50%, -50%) rotate(-10deg) scale(3); opacity: 0; }
  60% { transform: translate(-50%, -50%) rotate(-10deg) scale(0.92); opacity: 1; }
  100% { transform: translate(-50%, -50%) rotate(-10deg) scale(1); opacity: 1; }
}

/* ------------------------------------------------------------- CARDS */
.card {
  position: absolute;
  left: 0; top: 0;
  width: 1em;
  height: 1.4em;
  font-size: var(--cw);
  transition: left 0.38s cubic-bezier(0.3, 0.8, 0.3, 1), top 0.38s ease, rotate 0.38s ease, translate 0.35s ease, scale 0.35s ease, filter 0.4s;
  will-change: transform;
}
.inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.42s cubic-bezier(0.3, 0.8, 0.3, 1);
  transform: perspective(5em) rotateY(0deg);
}
.inner.down { transform: perspective(5em) rotateY(180deg); }
.inner.slow { transition-duration: 0.75s; transition-timing-function: cubic-bezier(0.5, 0, 0.2, 1); }
.face {
  position: absolute;
  inset: 0;
  border-radius: 0.085em;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  overflow: hidden;
  box-shadow: 0 0.03em 0.1em rgba(0, 0, 0, 0.5), 0 0.01em 0.02em rgba(0, 0, 0, 0.4);
}
.front {
  background:
    radial-gradient(ellipse at 30% 0%, rgba(255, 255, 255, 0.9), transparent 60%),
    linear-gradient(165deg, #fffef8 0%, #f6f1e4 60%, #ebe3d0 100%);
  box-shadow: inset 0 0 0 0.008em rgba(0, 0, 0, 0.25), inset 0 0 0 0.03em rgba(255, 255, 255, 0.9), 0 0.03em 0.1em rgba(0, 0, 0, 0.5);
}
.front.red { color: #cc1435; }
.front.blk { color: #15151f; }
.front svg { fill: currentColor; display: block; }
.idx {
  position: absolute;
  left: 0.035em;
  top: 0.04em;
  width: 0.2em;
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
}
.idx b {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 700;
  font-size: 0.21em;
  letter-spacing: -0.03em;
}
.idx b.ten { font-size: 0.18em; letter-spacing: -0.1em; margin-left: -0.1em; }
.idx svg { width: 0.13em; height: 0.13em; margin-top: 0.012em; }
.idx.br { left: auto; top: auto; right: 0.035em; bottom: 0.04em; transform: rotate(180deg); }
.pips { position: absolute; left: 0.33em; right: 0.33em; top: 0.21em; bottom: 0.21em; }
.pip { position: absolute; width: 0.17em; height: 0.17em; transform: translate(-50%, -50%); }
.pip.flip { transform: translate(-50%, -50%) rotate(180deg); }
.ace { position: absolute; inset: 0; display: grid; place-items: center; }
.ace svg { width: 0.44em; height: 0.44em; filter: drop-shadow(0 0.01em 0.01em rgba(0, 0, 0, 0.3)); }
.ace.s svg { width: 0.56em; height: 0.56em; }
.ace::before {
  content: "";
  position: absolute;
  width: 0.7em; height: 0.7em;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 0.012em solid rgba(200, 150, 40, 0.55);
  box-shadow: 0 0 0 0.03em rgba(200, 150, 40, 0.15);
}
.court {
  position: absolute;
  left: 0.24em; right: 0.24em; top: 0.1em; bottom: 0.1em;

  const wait = (ms) => new Promise((r) => setTimeout(r, ms * SPEED));
  const dur = (ms) => Math.max(1, ms * SPEED);
  const $ = (s) => document.querySelector(s);
  const sfx = AX.sfx;

  /* ================================================================ SONIDOS */
  sfx.register("deal", () => sfx.noise(0.14, { type: "bandpass", freq: 1600, to: 5200, q: 0.8, vol: 0.28 }));
  sfx.register("land", () => { sfx.noise(0.05, { type: "lowpass", freq: 1400, vol: 0.22 }); sfx.tone(180, 0.05, { type: "sine", vol: 0.08 }); });
  sfx.register("riffle", () => { for (let i = 0; i < 22; i++) sfx.noise(0.028, { type: "highpass", freq: 2400 + Math.random() * 2600, vol: 0.1 + Math.random() * 0.12, delay: i * 0.034 }); });
  sfx.register("bridge", () => { for (let i = 0; i < 14; i++) sfx.noise(0.03, { type: "bandpass", freq: 3000 + i * 120, q: 2, vol: 0.12, delay: i * 0.025 }); });
  sfx.register("crack", () => {
    sfx.noise(0.06, { type: "highpass", freq: 3200, vol: 0.5 });
    sfx.noise(0.35, { freq: 1300, to: 260, q: 3, vol: 0.32, delay: 0.03 });
    sfx.tone(170, 0.35, { type: "sawtooth", to: 40, vol: 0.14, filter: { freq: 900 } });
    [0.05, 0.09, 0.15, 0.2].forEach((d) => sfx.noise(0.02, { type: "highpass", freq: 5200, vol: 0.28, delay: d }));
  });
  sfx.register("heart", () => { sfx.tone(64, 0.16, { vol: 0.55 }); sfx.tone(54, 0.22, { vol: 0.45, delay: 0.2 }); });
  sfx.register("push", () => { sfx.tone(sfx.note(67), 0.2, { type: "triangle", vol: 0.14 }); sfx.tone(sfx.note(67), 0.32, { type: "triangle", vol: 0.12, delay: 0.16 }); });
  sfx.register("lose2", () => { sfx.tone(sfx.note(62), 0.25, { type: "triangle", vol: 0.16 }); sfx.tone(sfx.note(57), 0.42, { type: "triangle", vol: 0.14, delay: 0.15 }); sfx.tone(80, 0.3, { to: 40, vol: 0.3, delay: 0.15 }); });
  sfx.register("stack", () => { sfx.play("chip"); sfx.noise(0.04, { freq: 2400, q: 5, vol: 0.22, delay: 0.07 }); });
  sfx.register("twentyone", () => { [72, 76, 79, 84].forEach((n, i) => sfx.tone(sfx.note(n), 0.18, { type: "triangle", vol: 0.12, delay: i * 0.05 })); });

  /* ================================================================ CARTAS */
  const rk = (c) => c.slice(0, -1);
  const st = (c) => c.slice(-1);
  const cval = (c) => { const r = rk(c); return r === "A" ? 11 : r === "J" || r === "Q" || r === "K" ? 10 : +r; };
  const validCode = (c) => typeof c === "string" && RANKS.includes(rk(c)) && SUITS.includes(st(c));
  /** Puntuación con ases flexibles: {t: total, soft: hay un as contando 11} */
  function score(cards) {
    let t = 0, a = 0;
    for (const c of cards) { t += cval(c); if (rk(c) === "A") a++; }
    while (t > 21 && a) { t -= 10; a--; }
    return { t, soft: a > 0 };
  }
  function shuffle(a) {
    const rnd = (n) => {
      try { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
    };
    for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function freshDeck(exclude) {
    const d = [];
    for (const s of SUITS) for (const r of RANKS) d.push(r + s);
    if (exclude) for (const c of exclude) { const i = d.indexOf(c); if (i >= 0) d.splice(i, 1); }
    return shuffle(d);
  }

  /* ================================================================ ESTADO
     Todo lo que afecta al dinero se guarda en localStorage en el MISMO tick en que
     se cobra o se paga. Si el jugador sale a mitad de mano, al volver la mano se
     reanuda exactamente donde estaba (con el mismo zapato), sin perder ni duplicar. */
  function newState(prev) {
    return {
      v: 2,
      shoe: freshDeck(),
      discard: 0,
      phase: "bet", // bet | ins | peek | player | dealer
      hands: [],
      dealer: [],
      hole: true,
      active: 0,
      ins: 0,
      base: 0,
      last: (prev && prev.last) || 0,
      pending: 0,
      streak: (prev && prev.streak) || 0,
      best: (prev && prev.best) || 0,
      stats: (prev && prev.stats) || { hands: 0, wins: 0, losses: 0, pushes: 0, bj: 0, biggest: 0 },
      fresh: true,
    };
  }
  function load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(STATE_KEY) || "null"); } catch (e) {}
    const ok =
      s && s.v === 2 && Array.isArray(s.shoe) && s.shoe.every(validCode) && Array.isArray(s.hands) && Array.isArray(s.dealer) &&
      ["bet", "ins", "peek", "player", "dealer"].includes(s.phase) &&
      s.dealer.every(validCode) &&
      s.hands.every((h) => h && Array.isArray(h.cards) && h.cards.every(validCode) && h.bet > 0 && Number.isFinite(h.bet));
    if (!ok) return newState(s && typeof s === "object" ? s : null);
    if (s.phase !== "bet" && (s.hands.length === 0 || s.dealer.length < 2)) s.phase = "bet";
    if (s.phase === "bet") { s.hands = []; s.dealer = []; s.hole = true; s.ins = 0; }
    s.stats = Object.assign({ hands: 0, wins: 0, losses: 0, pushes: 0, bj: 0, biggest: 0 }, s.stats || {});
    s.pending = Math.max(0, Math.floor(+s.pending || 0));
    s.last = Math.max(0, Math.floor(+s.last || 0));
    s.ins = Math.max(0, Math.floor(+s.ins || 0));
    s.discard = Math.max(0, +s.discard || 0);
    s.streak = Math.max(0, +s.streak || 0);
    s.best = Math.max(0, +s.best || 0);
    return s;
  }
  let S = load();
  function save() { try { localStorage.setItem(STATE_KEY, JSON.stringify(S)); } catch (e) {} }

  const rigQ = []; // cola de cartas forzadas (depuración / pruebas)
  function onTableCodes() { return S.dealer.concat(...S.hands.map((h) => h.cards)); }
  function draw() {
    if (rigQ.length) {
      const c = rigQ.shift();
      const i = S.shoe.indexOf(c);
      if (i >= 0) S.shoe.splice(i, 1);
      return c;
    }
    if (!S.shoe.length) { S.shoe = freshDeck(onTableCodes()); S.discard = 0; midShuffle = true; }
    return S.shoe.pop();
  }
  let midShuffle = false;

  /* ================================================================ DOM */
  const table = $("#table");
  const handsEl = $("#hands");
  const shoeEl = $("#shoe");
  const shoeMouth = $(".shoe-mouth");
  const discardEl = $("#discard");
  const statusEl = $("#status");
  const streakEl = $("#streak");
  const insSpot = $("#insSpot");
  const D = { el: $("#dealer"), cards: $("#dealer .cards"), score: $("#dealer .score"), stamp: $("#dealer .stamp"), cardEls: [], dealer: true };
  const HANDS = [];
  let busy = true;
  let mode = "bet";
  let dirty = false; // cartas de la mano anterior aún sobre la mesa

  const hud = AX.hud({ title: "BLACKJACK", back: "../index.html" });

  const PIPS = {
    2: [[0.5, 0], [0.5, 1]],
    3: [[0.5, 0], [0.5, 0.5], [0.5, 1]],
    4: [[0, 0], [1, 0], [0, 1], [1, 1]],
    5: [[0, 0], [1, 0], [0.5, 0.5], [0, 1], [1, 1]],
    6: [[0, 0], [1, 0], [0, 0.5], [1, 0.5], [0, 1], [1, 1]],
    7: [[0, 0], [1, 0], [0.5, 0.25], [0, 0.5], [1, 0.5], [0, 1], [1, 1]],
    8: [[0, 0], [1, 0], [0.5, 0.25], [0, 0.5], [1, 0.5], [0.5, 0.75], [0, 1], [1, 1]],
    9: [[0, 0], [1, 0], [0, 1 / 3], [1, 1 / 3], [0.5, 0.5], [0, 2 / 3], [1, 2 / 3], [0, 1], [1, 1]],
    10: [[0, 0], [1, 0], [0.5, 1 / 6], [0, 1 / 3], [1, 1 / 3], [0, 2 / 3], [1, 2 / 3], [0.5, 5 / 6], [0, 1], [1, 1]],
  };
  const suitSVG = (s, cls) => `<svg${cls ? ` class="${cls}"` : ""} viewBox="0 0 100 100"><use href="#s-${s}"/></svg>`;

  /** Figuras originales (J, Q, K) dibujadas en SVG, de doble cabeza como las cartas clásicas */
  function courtSVG(r, s) {
    const red = !!RED[s];
    const robe = red ? "#c8102e" : "#22307a";
    const robe2 = red ? "#22307a" : "#c8102e";
    const gold = "#e7b232", goldD = "#8a5a00", skin = "#f7d5b0", ink = "#1b1b2a";
    let hair = "", crown = "", extra = "", beard = "";
    if (r === "K") {
      hair = `<path d="M37 36 Q35 20 50 19 Q65 20 63 36 L63 46 L37 46Z" fill="#7a4a1c"/>`;
      beard = `<path d="M38.5 36 Q39 55 50 56 Q61 55 61.5 36 Q58 46 50 46 Q42 46 38.5 36Z" fill="#7a4a1c"/>`;
      crown = `<path d="M36 23 L37.5 6 L44 15 L50 3 L56 15 L62.5 6 L64 23Z" fill="${gold}" stroke="${goldD}" stroke-width="1"/><rect x="36" y="20" width="28" height="4" fill="${goldD}"/><circle cx="50" cy="14" r="2.4" fill="${robe2}"/><circle cx="41.5" cy="17" r="1.5" fill="#fff"/><circle cx="58.5" cy="17" r="1.5" fill="#fff"/>`;
      extra = `<rect x="80" y="14" width="3" height="66" fill="#d8deea" stroke="#8890a8" stroke-width=".6"/><rect x="75" y="68" width="13" height="4" rx="1" fill="${gold}"/><circle cx="81.5" cy="78" r="2.5" fill="${gold}"/>`;
    } else if (r === "Q") {
      hair = `<path d="M34 54 Q31 19 50 18 Q69 19 66 54 Q60 46 60.5 34 Q59 25 50 25 Q41 25 39.5 34 Q40 46 34 54Z" fill="#d79a2b"/>`;
      crown = `<path d="M38.5 24 Q50 7 61.5 24 L58 25 Q50 15 42 25Z" fill="${gold}" stroke="${goldD}" stroke-width=".8"/><circle cx="50" cy="14" r="2.6" fill="${robe2}"/><circle cx="43" cy="19" r="1.2" fill="#fff"/><circle cx="57" cy="19" r="1.2" fill="#fff"/>`;
      extra = `<g transform="translate(79 46)"><path d="M0 4 Q-2 18 -6 30" stroke="#2d7a3a" stroke-width="1.8" fill="none"/><path d="M-1 16 Q-9 12 -10 18 Q-4 19 -1 16Z" fill="#3a9a4a"/><circle r="5" fill="${robe2}"/><circle cx="-3.5" cy="-3" r="3" fill="${robe2}"/><circle cx="3.5" cy="-3" r="3" fill="${robe2}"/><circle r="2.2" fill="${gold}"/></g>`;
    } else {
      hair = `<path d="M38 40 Q35 24 44 23 L56 23 Q65 24 62 40 Q61 31 50 30 Q39 31 38 40Z" fill="#5a3416"/><path d="M37.5 38 Q35 46 39 50 L40 40Z M62.5 38 Q65 46 61 50 L60 40Z" fill="#5a3416"/>`;
      crown = `<path d="M34 26 Q36 9 51 9 Q64 9 67 26Z" fill="${robe2}"/><rect x="33" y="23.5" width="35" height="4" rx="1" fill="${gold}"/><path d="M60 13 Q76 -2 86 8 Q74 8 63 19Z" fill="${gold}" stroke="${goldD}" stroke-width=".7"/><path d="M63 16 Q74 6 82 9" stroke="${goldD}" stroke-width=".6" fill="none"/>`;
      extra = `<rect x="17" y="16" width="2.6" height="70" fill="#8a5a2b"/><path d="M12 18 Q18 4 24.5 18 Q18 26 12 18Z" fill="#d8deea" stroke="#8890a8" stroke-width=".6"/>`;
    }
    const half = `
      ${hair}
      <path d="M5 115 L5 82 Q9 60 30 53 L70 53 Q91 60 95 82 L95 115Z" fill="${robe}"/>
      <path d="M5 98 L95 98 L95 104 L5 104Z" fill="${gold}" opacity=".9"/>
      <path d="M5 92 Q50 84 95 92" stroke="${gold}" stroke-width="1.2" fill="none" opacity=".7"/>
      <path d="M30 53 L50 88 L70 53 L62 53 L50 74 L38 53Z" fill="${gold}"/>
      <path d="M38 53 L50 74 L62 53Z" fill="#fffaf0"/>
      <rect x="45.5" y="44" width="9" height="10" fill="#e9c096"/>
      <ellipse cx="50" cy="36" rx="11" ry="12.5" fill="${skin}"/>
      ${beard}
      <circle cx="45.6" cy="35" r="1.4" fill="${ink}"/><circle cx="54.4" cy="35" r="1.4" fill="${ink}"/>
      <path d="M46.5 42 Q50 44.5 53.5 42" stroke="#b03030" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      ${crown}
      ${extra}
      <use href="#s-${s}" x="64" y="62" width="17" height="17" fill="${red ? "#ffe2e8" : "#e6ebff"}"/>
      <use href="#s-${s}" x="66" y="64" width="13" height="13" fill="${red ? "#c8102e" : ink}"/>`;
    return `<svg viewBox="0 0 100 230" preserveAspectRatio="xMidYMid slice"><rect width="100" height="230" fill="${red ? "#fff1e2" : "#eef1ff"}"/><path d="M0 0 L100 230 M100 0 L0 230" stroke="${gold}" stroke-width=".5" opacity=".25"/><g>${half}</g><g transform="rotate(180 50 115)">${half}</g><path d="M0 115 H100" stroke="${goldD}" stroke-width="1.4"/></svg>`;
  }

  function faceHTML(code) {
    const r = rk(code), s = st(code);
    const b = `<b${r === "10" ? ' class="ten"' : ""}>${r}</b>`;
    let center;
    if (r === "A") center = `<div class="ace ${s}">${suitSVG(s)}</div>`;
    else if (r === "J" || r === "Q" || r === "K") center = `<div class="court">${courtSVG(r, s)}</div>`;
    else center = `<div class="pips">${PIPS[r].map(([x, y]) => `<svg class="pip${y > 0.5 ? " flip" : ""}" style="left:${x * 100}%;top:${y * 100}%" viewBox="0 0 100 100"><use href="#s-${s}"/></svg>`).join("")}</div>`;
    return `<div class="face front ${RED[s] ? "red" : "blk"}"><div class="idx">${b}${suitSVG(s)}</div>${center}<div class="idx br">${b}${suitSVG(s)}</div></div>`;
  }
  function makeCard(code, down) {
    const e = AX.el("div", "card");
    e.innerHTML = `<div class="inner${down ? " down" : ""}">${faceHTML(code)}<div class="face back"></div></div>`;
    return e;
  }

  /* ================================================================ FICHAS */
  const chipLabel = (v) => (v >= 1000 ? v / 1000 + "K" : String(v));
  function chipEl(v, size) {
    const e = AX.el("div", "chip", `<span>${chipLabel(v)}</span>`);
    e.dataset.v = v;
    if (size) e.style.setProperty("--chip", size + "px");
    return e;
  }
  function chipsFor(amount) {
    const out = [];
    let rest = Math.floor(amount);
    const den = [5000, 1000, 500, 100, 50, 10, 5];
    for (const v of den) while (rest >= v && out.length < 60) { out.push(v); rest -= v; }
    return out; // de mayor a menor (abajo → arriba)
  }
  function renderStack(H, amount, popTop) {
    H.stack.innerHTML = "";
    let list = chipsFor(amount);
    if (list.length > 12) list = list.slice(0, 12);
    list.forEach((v, i) => {
      const c = chipEl(v);
      c.style.transform = `translateY(${-i * 5}px) rotate(${(i * 37) % 30 - 15}deg)`;
      c.style.zIndex = i;
      H.stack.appendChild(c);
      if (popTop && i === list.length - 1) c.animate([{ transform: `translateY(${-i * 4 - 14}px) scale(1.2)` }, { transform: c.style.transform }], { duration: 220, easing: "cubic-bezier(.2,1.6,.4,1)" });
    });
    H.amt.textContent = AX.money(amount);
    H.amt.classList.toggle("on", amount > 0);
    if (H.hint) H.hint.classList.toggle("hide", amount > 0);
    H.amount = amount;
  }
  /** Ficha que vuela de un punto a otro con arco */
  function flyChip(from, to, v, opts = {}) {
    const size = opts.size || 42;
    const c = chipEl(v, size);
    c.classList.add("fly");
    document.body.appendChild(c);
    const mx = (from.x + to.x) / 2 + (opts.bend || AX.rand(-30, 30));
    const my = Math.min(from.y, to.y) - (opts.lift == null ? 60 : opts.lift);
    const T = (x, y, s, r) => `translate(${x - size / 2}px,${y - size / 2}px) scale(${s}) rotate(${r}deg)`;
    const a = c.animate(
      [
        { transform: T(from.x, from.y, opts.s0 || 1.05, 0), opacity: opts.o0 == null ? 1 : opts.o0 },
        { transform: T(mx, my, 1.15, 180), opacity: 1, offset: 0.5 },
        { transform: T(to.x, to.y, opts.s1 || 0.95, 360), opacity: opts.o1 == null ? 1 : opts.o1 },
      ],
      { duration: dur(opts.ms || 420), delay: dur(opts.delay || 0), easing: "cubic-bezier(.35,.1,.3,1)", fill: "both" }
    );
    return a.finished.then(() => c.remove(), () => c.remove());
  }
  const spotCenter = (H) => AX.center(H.ring);

  /* ================================================================ MANOS (DOM) */
  function makeHand(i) {
    const el = AX.el("div", "hand pl");
    el.innerHTML = `<div class="score"></div><div class="cards"></div><div class="spot"><div class="ring"><div class="stack"></div></div><div class="amt"></div><div class="hint">HAGA SU APUESTA</div></div><div class="tag"></div><div class="stamp"></div>`;
    const q = (s) => el.querySelector(s);
    const H = { el, cards: q(".cards"), score: q(".score"), spot: q(".spot"), ring: q(".ring"), stack: q(".stack"), amt: q(".amt"), hint: q(".hint"), tag: q(".tag"), stamp: q(".stamp"), cardEls: [], amount: 0 };
    handsEl.appendChild(el);
    HANDS[i] = H;
    return H;
  }
  function resetTableDOM() {
    D.cardEls.forEach((e) => e.remove());
    D.cardEls = [];
    D.score.className = "score";
    D.stamp.className = "stamp";
    handsEl.innerHTML = "";
    HANDS.length = 0;
    makeHand(0);
    table.classList.remove("split");
  }

  /* ================================================================ LAYOUT */
  let CW = 76;
  function layoutAll() {
    const tw = table.clientWidth - 20;
    const th = table.clientHeight;
    const midH = Math.min(tw, 540) * (124 / 400);
    let cw = Math.min(tw / 4.25, (th - midH - 38 - 90 - 14) / 2 / 1.4, 104);
    cw = Math.max(40, Math.floor(cw));
    CW = cw;
    const root = document.documentElement.style;
    root.setProperty("--cw", cw + "px");
    root.setProperty("--ch", Math.round(cw * 1.4) + "px");
    const split = HANDS.length > 1;
    const pcw = split ? Math.round(Math.min(cw * 0.88, (tw / 2 - 5) / 1.9)) : cw;
    root.setProperty("--pcw", pcw + "px");
    const chip = Math.min(52, Math.floor((Math.min(innerWidth, 540) - 20 - 5 * 6) / 6));
    root.setProperty("--chip", chip + "px");
    positionCards(D, cw);
    HANDS.forEach((H) => positionCards(H, pcw));
  }
  function positionCards(H, cw) {
    const n = H.cardEls.length;
    const W = H.cards.clientWidth - 8;
    const ch = cw * 1.4;
    const hasDbl = H.cardEls.some((e) => e.classList.contains("dbl"));
    const extra = hasDbl ? (ch - cw) * 0.7 : 0;
    const off = n > 1 ? Math.max(8, Math.min(cw * 0.6, (W - cw - extra) / (n - 1))) : 0;
    const total = cw + off * (n - 1) + extra;
    const start = (W - total) / 2 + 4;
    H.cardEls.forEach((e, i) => {
      const k = i - (n - 1) / 2;
      const dbl = e.classList.contains("dbl");
      e.style.left = start + i * off + (dbl ? extra * 0.85 : 0) + "px";
      e.style.top = (dbl ? 2 : Math.abs(k) * Math.abs(k) * 0.9) + "px";
      e.style.rotate = dbl ? "90deg" : (H.dealer ? k * 1.5 : k * 2.4) + "deg";
      e.style.zIndex = 10 + i;
    });
    H.cards.style.setProperty("--fanL", start - 7 + "px");
    H.cards.style.setProperty("--fanW", total + 14 + "px");
  }
  addEventListener("resize", () => layoutAll());

  /* ================================================================ ANIMACIÓN DE CARTAS */
  function flyIn(e, reveal, from) {
    const src = from || AX.center(shoeMouth);
    const r = e.getBoundingClientRect();
    const dx = src.x - (r.left + r.width / 2);
    const dy = src.y - (r.top + r.height / 2);
    const T = dur(520);
    sfx.play("deal");
    const a = e.animate(
      [
        { transform: `translate(${dx}px,${dy}px) rotate(-170deg) scale(.42)`, opacity: 0 },
        { opacity: 1, offset: 0.1 },
        { transform: `translate(${dx * 0.42}px,${dy * 0.42 - 46}px) rotate(-55deg) scale(1.16)`, offset: 0.55 },
        { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1 },
      ],
      { duration: T, easing: "cubic-bezier(.22,.7,.3,1)", fill: "backwards" }
    );
    if (reveal) setTimeout(() => e.firstChild.classList.remove("down"), T * 0.42);
    return a.finished.then(
      () => { sfx.play("land"); AX.haptic("light"); },
      () => {}
    );
  }
  /** Añade una carta a una mano (DOM) y la hace volar desde el zapato */
  function addCard(H, code, opts = {}) {
    const e = makeCard(code, true);
    if (opts.dbl) e.classList.add("dbl");
    if (opts.hole) e.classList.add("hole");
    H.cards.appendChild(e);
    H.cardEls.push(e);
    layoutAll();
    renderShoe();
    return flyIn(e, !opts.hole);
  }
  /** Movimiento FLIP para elementos que cambian de contenedor/posición */
  function flipMove(els, mutate) {
    const before = els.map((e) => e.getBoundingClientRect());
    mutate();
    els.forEach((e) => (e.style.transition = "none"));
    layoutAll();
    void document.body.offsetWidth;
    const anims = els.map((e, i) => {
      const a = e.getBoundingClientRect();
      const dx = before[i].left + before[i].width / 2 - (a.left + a.width / 2);
      const dy = before[i].top + before[i].height / 2 - (a.top + a.height / 2);
      const sc = before[i].width / Math.max(1, a.width);
      return e.animate([{ transform: `translate(${dx}px,${dy}px) scale(${sc})` }, { transform: `translate(${dx * 0.4}px,${dy * 0.4 - 30}px) scale(1.1)`, offset: 0.5 }, { transform: "none" }], { duration: dur(480), easing: "cubic-bezier(.3,.8,.3,1)" }).finished.catch(() => {});
    });
    requestAnimationFrame(() => els.forEach((e) => (e.style.transition = "")));
    return Promise.all(anims);
  }

  async function revealHole(suspense) {
    const e = D.cardEls[1];
    if (!e) return;
    const inner = e.firstChild;
    if (!inner.classList.contains("down")) return;
    e.classList.add("lift");
    sfx.play("heart");
    AX.haptic("medium");
    await wait(suspense ? 520 : 260);
    if (suspense) { e.classList.add("wobble"); sfx.play("heart"); await wait(420); e.classList.remove("wobble"); }
    inner.classList.add("slow");
    inner.classList.remove("down");
    sfx.play("flip");
    AX.haptic("tap");
    await wait(420);
    const c = AX.center(e);
    AX.fx.glow(c.x, c.y, { size: CW * 1.2, color: "rgba(255,220,120,0.8)", life: 0.5 });
    AX.fx.sparks(c.x, c.y, { count: 18, speed: 380, colors: "gold", life: 0.5 });
    await wait(330);
    e.classList.remove("lift");
    inner.classList.remove("slow");
    updateDealerScore();
    await wait(200);
  }

  async function peekAnim() {
    const e = D.cardEls[1];
    if (!e) return;
    e.classList.add("peek", "lift");
    sfx.play("heart");
    status("La banca comprueba si tiene Blackjack…");
    await wait(520);
    sfx.play("heart");
    await wait(420);
    e.classList.remove("peek", "lift");
    await wait(220);
  }

  /* ================================================================ PUNTUACIONES */
  function scoreText(cards) {
    const s = score(cards);
    if (s.soft && s.t < 21) return `${s.t - 10}/${s.t}`;
    return String(s.t);
  }
  function setScore(el, text, cls, label) {
    const prev = el.dataset.v;
    el.innerHTML = (label ? `<small>${label}</small>` : "") + text;
    el.dataset.v = text;
    el.className = "score on" + (cls ? " " + cls : "");
    if (prev !== text) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  }
  function updateHandScore(i) {
    const H = HANDS[i], h = S.hands[i] || (lastView && lastView.hands[i]);
    if (!H || !h) return;
    const s = score(h.cards);
    const nat = S.hands.length === 1 && !h.split && h.cards.length === 2 && s.t === 21;
    setScore(H.score, nat ? "BJ" : s.t > 21 ? String(s.t) : scoreText(h.cards), nat ? "bj" : s.t > 21 ? "bust" : s.t === 21 ? "s21" : "");
  }
  function updateDealerScore() {
    const cards = S.dealer.length ? S.dealer : lastView ? lastView.dealer : [];
    if (!cards.length) { D.score.className = "score"; return; }
    const holeDown = D.cardEls[1] && D.cardEls[1].firstChild.classList.contains("down");
    const shown = holeDown ? [cards[0]] : cards.slice(0, D.cardEls.length);
    const s = score(shown);
    const nat = !holeDown && shown.length === 2 && s.t === 21;
    setScore(D.score, nat ? "BJ" : s.t > 21 ? String(s.t) : scoreText(shown), nat ? "bj" : s.t > 21 ? "bust" : s.t === 21 ? "s21" : "", "BANCA");
  }

  /* ================================================================ ESTADO VISUAL */
  function status(text, tone) {
    statusEl.textContent = text;
    statusEl.className = tone || "";
    void statusEl.offsetWidth;
    statusEl.classList.add("pop");
  }
  function renderShoe() {
    const n = S.shoe.length;
    $(".shoe-count").innerHTML = `<b>${n}</b> cartas`;
    const m = $(".shoe-meter");
    m.firstChild.style.width = (n / 52) * 100 + "%";
    m.classList.toggle("low", n < RESHUFFLE_AT);
  }
  function renderDiscard() {
    const pile = discardEl.querySelector(".pile");
    const n = Math.min(10, Math.ceil(S.discard / 3));
    pile.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const b = AX.el("div", "cback cardback");
      b.style.transform = `translate(${(i % 3) - 1}px, ${-i * 1.2}px) rotate(${((i * 47) % 14) - 7}deg)`;
      pile.appendChild(b);
    }
    discardEl.querySelector(".discard-count").textContent = S.discard ? `${S.discard} usadas` : "descartes";
  }
  function renderStreak(bump) {
    const n = S.streak;
    streakEl.textContent = n >= 2 ? `🔥 RACHA ×${n}` : "";
    streakEl.className = n >= 2 ? "on" + (n >= 5 ? " l5" : n >= 3 ? " l3" : "") : "";
    if (bump && n >= 2) streakEl.animate([{ scale: 1 }, { scale: 1.5 }, { scale: 1 }], { duration: 450, easing: "cubic-bezier(.2,1.6,.4,1)" });
  }
  function renderIns() {
    insSpot.classList.toggle("on", S.ins > 0);
    $("#insVal").textContent = AX.fmt(S.ins);
  }
  function setActive(i) {
    HANDS.forEach((H, k) => {
      H.el.classList.toggle("active", k === i);
      H.el.classList.toggle("waiting", i >= 0 && HANDS.length > 1 && k !== i && !(S.hands[k] && S.hands[k].done));
    });
  }

  /** Pinta la mano en curso sin animaciones (al reanudar) */
  function renderStatic() {
    resetTableDOM();
    if (S.phase === "bet") {
      table.classList.add("betting");
      renderStack(HANDS[0], S.pending);
    } else {
      table.classList.remove("betting");
      S.hands.forEach((h, i) => {
        const H = HANDS[i] || makeHand(i);
        if (h.split) H.el.classList.add("split-hand");
        h.cards.forEach((c, j) => {
          const e = makeCard(c, false);
          if (h.doubled && j === 2) e.classList.add("dbl");
          H.cards.appendChild(e);
          H.cardEls.push(e);
        });
        renderStack(H, h.bet);
      });
      if (S.hands.length > 1) table.classList.add("split");
      S.dealer.forEach((c, j) => {
        const e = makeCard(c, j === 1 && S.hole);
        D.cards.appendChild(e);
        D.cardEls.push(e);
      });
    }
    layoutAll();
    if (S.phase !== "bet") {
      S.hands.forEach((h, i) => updateHandScore(i));
      updateDealerScore();
    }
    renderShoe();
    renderDiscard();
    renderStreak();
    renderIns();
  }

  /* ================================================================ BARRA INFERIOR */
  const panels = { bet: $("#pBet"), play: $("#pPlay"), ins: $("#pIns") };
  const chipsRow = $("#chips");
  const chipBtns = CHIPS.map((v) => {
    const b = AX.el("button", "chip-btn");
    b.setAttribute("aria-label", `Ficha de ${v} €`);
    b.appendChild(chipEl(v));
    b.addEventListener("click", () => addChip(v, b));
    chipsRow.appendChild(b);
    return b;
  });
  const bDeal = $("#bDeal"), bClear = $("#bClear"), bX2 = $("#bX2");
  const bHit = $("#bHit"), bStand = $("#bStand"), bDouble = $("#bDouble"), bSplit = $("#bSplit");
  const bIns = $("#bIns"), bNoIns = $("#bNoIns");

  function setMode(m) {
    mode = m;
    for (const k in panels) panels[k].classList.toggle("on", k === m);
    refreshBar();
  }
  function canDouble() {
    const h = S.hands[S.active];
    return S.phase === "player" && h && !h.done && h.cards.length === 2 && AX.getBalance() >= h.bet;
  }
  function canSplit() {
    const h = S.hands[0];
    return S.phase === "player" && S.hands.length === 1 && h && !h.done && h.cards.length === 2 && cval(h.cards[0]) === cval(h.cards[1]) && AX.getBalance() >= h.bet;
  }
  function refreshBar() {
    const bal = AX.getBalance();
    for (const k in panels) panels[k].classList.toggle("locked", busy);
    // apuesta
    chipBtns.forEach((b, i) => (b.disabled = busy || S.pending + CHIPS[i] > bal));
    bClear.disabled = busy || S.pending === 0;
    const base = S.pending || S.last;
    bX2.disabled = busy || !base || base * 2 > bal;
    const l1 = bDeal.querySelector(".l1"), l2 = bDeal.querySelector(".l2");
    if (S.pending >= MIN_BET) { l1.textContent = "REPARTIR"; l2.textContent = AX.money(S.pending); bDeal.disabled = busy; }
    else if (S.pending === 0 && S.last >= MIN_BET && S.last <= bal) { l1.textContent = "REPETIR"; l2.textContent = AX.money(S.last); bDeal.disabled = busy; }
    else { l1.textContent = bal < MIN_BET ? "SIN SALDO" : "APUESTA"; l2.textContent = `mínimo ${MIN_BET} €`; bDeal.disabled = true; }
    bDeal.classList.toggle("ready", !bDeal.disabled && mode === "bet");
    // juego
    const h = S.hands[S.active];
    const playing = S.phase === "player" && h && !h.done;
    bHit.disabled = busy || !playing;
    bStand.disabled = busy || !playing;
    bDouble.disabled = busy || !canDouble();
    bSplit.disabled = busy || !canSplit();
    bDouble.querySelector("small").textContent = h ? "+" + AX.money(h.bet) : "";
    bSplit.querySelector("small").textContent = h ? "+" + AX.money(h.bet) : "";
    // seguro
    bIns.disabled = busy;
    bNoIns.disabled = busy;
  }
  AX.onBalance(() => refreshBar());

  /* ================================================================ APUESTAS */
  async function addChip(v, btn) {
    if (busy || S.phase !== "bet") return;
    const bal = AX.getBalance();
    if (S.pending + v > bal) { sfx.play("error"); AX.haptic("error"); AX.toast("Saldo insuficiente", "error"); return; }
    if (dirty) await sweep();
    S.pending += v;
    save();
    refreshBar();
    sfx.play("chip");
    AX.haptic("tap");
    const H = HANDS[0];
    const target = S.pending;
    await flyChip(AX.center(btn), spotCenter(H), v, { size: 42 * (CW / 76) + 6 });
    if (S.phase !== "bet") return;
    sfx.play("stack");
    renderStack(H, Math.max(target, S.pending), true);
    const c = spotCenter(H);
    AX.fx.sparks(c.x, c.y, { count: 8, speed: 220, life: 0.35 });
  }
  bClear.addEventListener("click", async () => {
    if (busy || !S.pending) return;
    sfx.play("swoosh");
    AX.haptic("light");
    const H = HANDS[0];
    const from = spotCenter(H);
    const list = chipsFor(S.pending).slice(-5);
    S.pending = 0;
    save();
    renderStack(H, 0);
    refreshBar();
    list.forEach((v, i) => {
      const idx = Math.max(0, CHIPS.indexOf(v));
      flyChip(from, AX.center(chipBtns[idx]), v, { delay: i * 50, lift: 30, ms: 360 });
    });
  });
  bX2.addEventListener("click", async () => {
    if (busy) return;
    if (dirty) await sweep();
    const base = S.pending || S.last;
    const bal = AX.getBalance();
    if (!base || base * 2 > bal) { sfx.play("error"); return; }
    const add = base * 2 - S.pending;
    S.pending = base * 2;
    save();
    refreshBar();
    sfx.play("powerup");
    AX.haptic("medium");
    await flyChipsToSpot(HANDS[0], add);
    renderStack(HANDS[0], S.pending, true);
  });
  async function flyChipsToSpot(H, amount, from) {
    const list = chipsFor(amount).slice(0, 6);
    const src = from || AX.center(chipsRow);
    await Promise.all(list.map((v, i) => flyChip({ x: src.x + AX.rand(-40, 40), y: src.y }, spotCenter(H), v, { delay: i * 60, ms: 380 }).then(() => sfx.play("chip"))));
  }

  /* ================================================================ RONDA */
  bDeal.addEventListener("click", () => deal());

  async function deal() {
    if (busy || S.phase !== "bet") return;
    const bal = AX.getBalance();
    let bet = S.pending;
    let repeat = false;
    if (bet < MIN_BET) {
      if (bet === 0 && S.last >= MIN_BET && S.last <= bal) { bet = S.last; repeat = true; }
      else { sfx.play("error"); AX.toast(`La apuesta mínima es ${MIN_BET} €`, "error"); return; }
    }
    if (bet > bal) { sfx.play("error"); AX.toast("Saldo insuficiente", "error"); return; }
    busy = true;
    refreshBar();
    sfx.play("tap");
    AX.haptic("medium");
    if (dirty) await sweep();
    if (repeat) {
      S.pending = bet;
      save();
      await flyChipsToSpot(HANDS[0], bet);
      renderStack(HANDS[0], bet, true);
      sfx.play("stack");
    }
    if (S.shoe.length < RESHUFFLE_AT) {
      S.shoe = freshDeck();
      S.discard = 0;
      save();
      await shuffleCine();
    }
    // ---- cobro y reparto: síncrono y guardado en el mismo tick ----
    if (!AX.spend(bet)) { busy = false; refreshBar(); AX.toast("Saldo insuficiente", "error"); return; }
    const p1 = draw(), d1 = draw(), p2 = draw(), d2 = draw();
    S.hands = [{ cards: [p1, p2], bet, split: false, doubled: false, done: false }];
    S.dealer = [d1, d2];
    S.hole = true;
    S.ins = 0;
    S.base = bet;
    S.last = bet;
    S.pending = 0;
    S.active = 0;
    S.stats.hands++;
    const insAmt = Math.floor(bet / 2);
    S.phase = rk(d1) === "A" && insAmt > 0 && AX.getBalance() >= insAmt ? "ins" : "peek";
    save();
    // ---- visual ----
    setMode("play");
    status("Repartiendo…");
    table.classList.remove("betting");
    renderStack(HANDS[0], bet);
    await wait(380);
    const H = HANDS[0];
    addCard(H, p1);
    await wait(300);
    addCard(D, d1);
    await wait(300);
    addCard(H, p2);
    await wait(300);
    await addCard(D, d2, { hole: true });
    updateHandScore(0);
    updateDealerScore();
    await wait(150);
    await proceed();
  }

  /** Avanza la máquina de estados (idempotente: sirve también para reanudar) */
  async function proceed() {
    busy = true;
    if (S.phase === "ins") {
      $("#insAmt").textContent = AX.money(Math.floor(S.hands[0].bet / 2));
      status("La banca muestra un As", "gold");
      busy = false;
      setMode("ins");
      sfx.play("shimmer");
      return;
    }
    if (S.phase === "peek") {
      setMode("play");
      refreshBar();
      const up = S.dealer[0];
      const peekable = rk(up) === "A" || cval(up) === 10;
      const dBJ = score(S.dealer).t === 21;
      if (peekable) await peekAnim();
      if (peekable && dBJ) {
        S.hole = false;
        save();
        await revealHole(false);
        const c = AX.center(D.cards);
        AX.fx.shockwave(c.x, c.y, { color: "#ff3b5c", radius: 220 });
        AX.cine.banner("BLACKJACK DE LA BANCA", { color: "rgba(196,18,58,.92)", sound: "impact", duration: 1700 });
        await wait(900);
        return settle();
      }
      if (peekable) {
        if (S.ins > 0) {
          const lost = S.ins;
          S.ins = 0;
          save();
          status("Sin Blackjack · seguro perdido", "red");
          const from = AX.center(insSpot);
          flyChip(from, AX.center(D.cards), 500, { size: 26, o1: 0, s1: 0.5 });
          renderIns();
          AX.fx.floatText(from.x + 40, from.y, "−" + AX.money(lost), { color: "#ff3b5c", size: 18 });
        } else status("La banca no tiene Blackjack");
        await wait(500);
      }
      const h = S.hands[0];
      if (score(h.cards).t === 21) {
        // Blackjack natural del jugador
        HANDS[0].cardEls.forEach((e) => e.classList.add("glow"));
        sfx.play("shimmer");
        S.hole = false;
        save();
        await revealHole(true);
        return settle();
      }
      S.phase = "player";
      save();
      return proceed();
    }
    if (S.phase === "player") {
      const i = S.hands.findIndex((h) => !h.done);
      if (i < 0) { S.phase = "dealer"; save(); return proceed(); }
      S.active = i;
      save();
      setActive(i);
      const h = S.hands[i];
      const tt = score(h.cards).t;
      status(S.hands.length > 1 ? `Mano ${i + 1} de ${S.hands.length} · tienes ${tt}` : `Tu turno · tienes ${scoreText(h.cards)}`);
      busy = false;
      setMode("play");
      return;
    }
    if (S.phase === "dealer") return dealerPlay();
  }

  /* ---------- seguro ---------- */
  bIns.addEventListener("click", async () => {
    if (busy || S.phase !== "ins") return;
    const amt = Math.floor(S.hands[0].bet / 2);
    busy = true;
    refreshBar();
    if (!AX.spend(amt)) { AX.toast("Saldo insuficiente", "error"); S.phase = "peek"; save(); return proceed(); }
    S.ins = amt;
    S.phase = "peek";
    save();
    sfx.play("chip");
    AX.haptic("tap");
    setMode("play");
    await flyChip(AX.center(bIns), AX.center(insSpot), 500, { size: 30 });
    renderIns();
    proceed();
  });
  bNoIns.addEventListener("click", () => {
    if (busy || S.phase !== "ins") return;
    sfx.play("tap");
    S.phase = "peek";
    save();
    proceed();
  });

  /* ---------- acciones del jugador ---------- */
  bHit.addEventListener("click", () => hit());
  bStand.addEventListener("click", () => stand());
  bDouble.addEventListener("click", () => doubleDown());
  bSplit.addEventListener("click", () => split());

  async function afterCard(i) {
    const h = S.hands[i];
    const t = score(h.cards).t;
    updateHandScore(i);
    if (t > 21) await bustFX(i);
    else if (t === 21) {
      const c = AX.center(HANDS[i].score);
      AX.fx.stars(c.x, c.y, { count: 14 });
      sfx.play("twentyone");
      AX.haptic("success");
      status("¡21!", "gold");
      await wait(450);
    }
  }

  async function hit() {
    if (busy || S.phase !== "player") return;
    const i = S.active, h = S.hands[i];
    if (!h || h.done) return;
    busy = true;
    refreshBar();
    sfx.play("tap");
    AX.haptic("tap");
    const c = draw();
    h.cards.push(c);
    if (score(h.cards).t >= 21) h.done = true;
    save();
    await addCard(HANDS[i], c);
    await afterCard(i);
    proceed();
  }

  async function stand() {
    if (busy || S.phase !== "player") return;
    const i = S.active, h = S.hands[i];
    if (!h || h.done) return;
    busy = true;
    refreshBar();
    h.done = true;
    save();
    sfx.play("click");
    AX.haptic("light");
    const H = HANDS[i];
    H.cards.animate([{ transform: "none" }, { transform: "translateY(4px) scale(.98)" }, { transform: "none" }], { duration: dur(260) });
    status(`Te plantas con ${score(h.cards).t}`);
    await wait(320);
    proceed();
  }

  async function doubleDown() {
    if (busy || !canDouble()) return;
    const i = S.active, h = S.hands[i];
    const add = h.bet;
    busy = true;
    refreshBar();
    if (!AX.spend(add)) { busy = false; refreshBar(); return; }
    h.bet += add;
    h.doubled = true;
    const c = draw();
    h.cards.push(c);
    h.done = true;
    save();
    const H = HANDS[i];
    sfx.play("powerup");
    AX.haptic("medium");
    status("¡Doblas! Una sola carta…", "gold");
    await flyChipsToSpot(H, add, AX.center(bDouble));
    renderStack(H, h.bet, true);
    sfx.play("stack");
    const sc = spotCenter(H);
    AX.fx.sparks(sc.x, sc.y, { count: 16, speed: 300 });
    await wait(150);
    await addCard(H, c, { dbl: true });
    await afterCard(i);
    await wait(250);
    proceed();
  }

  async function split() {
    if (busy || !canSplit()) return;
    const h = S.hands[0];
    busy = true;
    refreshBar();
    if (!AX.spend(h.bet)) { busy = false; refreshBar(); return; }
    const moved = h.cards.pop();
    const h2 = { cards: [moved], bet: h.bet, split: true, doubled: false, done: false };
    h.split = true;
    const c1 = draw(), c2 = draw();
    h.cards.push(c1);
    h2.cards.push(c2);
    if (score(h.cards).t === 21) h.done = true;
    if (score(h2.cards).t === 21) h2.done = true;
    S.hands.push(h2);
    S.active = 0;
    save();
    // ---- visual ----
    sfx.play("swoosh");
    AX.haptic("medium");
    status("¡Divides tu mano!", "gold");
    const H0 = HANDS[0];
    const movedEl = H0.cardEls[1];
    const keepEl = H0.cardEls[0];
    let H1;
    await flipMove([keepEl, movedEl], () => {
      H1 = makeHand(1);
      H0.el.classList.add("split-hand");
      H1.el.classList.add("split-hand");
      table.classList.add("split");
      H0.cardEls.pop();
      H1.cards.appendChild(movedEl);
      H1.cardEls.push(movedEl);
      renderStack(H0, h.bet);
    });
    await flyChipsToSpot(H1, h2.bet, AX.center(bSplit));
    renderStack(H1, h2.bet, true);
    sfx.play("stack");
    H0.score.className = "score";
    await addCard(H0, c1);
    updateHandScore(0);
    await wait(120);
    await addCard(H1, c2);
    updateHandScore(1);
    for (const k of [0, 1]) if (score(S.hands[k].cards).t === 21) { const c = AX.center(HANDS[k].score); AX.fx.stars(c.x, c.y, { count: 12 }); sfx.play("twentyone"); }
    await wait(200);
    proceed();
  }

  /* ---------- turno de la banca ---------- */
  async function dealerPlay() {
    busy = true;
    setMode("play");
    setActive(-1);
    refreshBar();
    const live = S.hands.some((h) => score(h.cards).t <= 21);
    if (S.hole) {
      S.hole = false;
      save();
      status("La banca descubre su carta…");
      await revealHole(live);
    }
    if (live) {
      while (score(S.dealer).t < 17) {
        status(`La banca tiene ${score(S.dealer).t} y pide carta…`);
        await wait(560);
        const c = draw();
        S.dealer.push(c);
        save();
        await addCard(D, c);
        updateDealerScore();
        if (midShuffle) { midShuffle = false; AX.toast("Zapato agotado: se baraja de nuevo", "info"); }
      }
      const t = score(S.dealer).t;
      if (t <= 21) status(`La banca se planta con ${t}`);
    }
    await wait(250);
    return settle();
  }

  /* ================================================================ LIQUIDACIÓN */
  let lastView = null;
  async function settle() {
    busy = true;
    setMode("play");
    setActive(-1);
    refreshBar();
    const dS = score(S.dealer).t;
    const dBJ = S.dealer.length === 2 && dS === 21;
    const single = S.hands.length === 1;
    const res = S.hands.map((h) => {
      const p = score(h.cards).t;
      const nat = single && !h.split && h.cards.length === 2 && p === 21;
      if (p > 21) return { o: "bust", ret: 0, p };
      if (nat) return dBJ ? { o: "push", ret: h.bet, p } : { o: "bj", ret: h.bet + Math.floor((h.bet * 3) / 2), p };
      if (dBJ) return { o: "lose", ret: 0, p };
      if (dS > 21 || p > dS) return { o: "win", ret: h.bet * 2, p };
      if (p < dS) return { o: "lose", ret: 0, p };
      return { o: "push", ret: h.bet, p };
    });
    const insRet = S.ins > 0 && dBJ ? S.ins * 3 : 0;
    const bets = S.hands.map((h) => h.bet);
    const staked = bets.reduce((a, b) => a + b, 0) + S.ins;
    const totalRet = res.reduce((a, r) => a + r.ret, 0) + insRet;
    const net = totalRet - staked;
    const base = S.base || bets[0];
    const prevStreak = S.streak;
    if (net > 0) { S.streak++; S.stats.wins++; }
    else if (net < 0) { S.streak = 0; S.stats.losses++; }
    else S.stats.pushes++;
    if (res.some((r) => r.o === "bj")) S.stats.bj++;
    S.best = Math.max(S.best, S.streak);
    if (net > S.stats.biggest) S.stats.biggest = net;
    lastView = { hands: S.hands.map((h) => ({ cards: h.cards.slice(), split: h.split })), dealer: S.dealer.slice() };
    const hadIns = S.ins;
    // ---- pago: guardado en el mismo tick que el cierre de la mano ----
    S.phase = "bet";
    S.hands = [];
    S.dealer = [];
    S.hole = true;
    S.ins = 0;
    S.active = 0;
    S.pending = 0;
    const prevBal = AX.getBalance();
    save();
    if (totalRet > 0) {
      AX.addBalance(totalRet, { silent: true });
      hud.setBalance(prevBal, false); // el marcador sube cuando llegan las monedas
    }
    dirty = true;
    try {
      await settleFX({ res, bets, net, base, dS, dBJ, insRet, hadIns, prevStreak, totalRet });
    } catch (e) { console.error(e); }
    hud.setBalance(AX.getBalance(), true);
    busy = false;
    setMode("bet");
    renderStreak();
    const bal = AX.getBalance();
    if (bal < MIN_BET) { status("Sin saldo suficiente para apostar", "red"); AX.toast("Te has quedado sin saldo. ¡Prueba suerte en otros juegos!", "error", 4000); }
    else status(S.last <= bal ? "Pulsa REPETIR o elige nuevas fichas" : "Haz tu apuesta");
  }

  async function settleFX(R) {
    const { res, bets, net, base, dS, dBJ, insRet, hadIns } = R;
    // 1) La banca se pasa
    if (dS > 21) {
      D.cardEls.forEach((e, i) => setTimeout(() => e.classList.add("cracked", "green"), i * 70));
      D.stamp.textContent = "¡SE PASA!";
      D.stamp.className = "stamp green on";
      sfx.play("crack");
      AX.haptic("success");
      const c = AX.center(D.cards);
      AX.fx.burst(c.x, c.y, { colors: "green", count: 40, speed: 500 });
      AX.fx.shake(6, 350, D.cards);
      await wait(650);
    }
    // 2) Seguro cobrado
    if (insRet > 0) {
      const from = AX.center(insSpot);
      AX.fx.floatText(from.x + 30, from.y, "SEGURO +" + AX.money(insRet - hadIns), { color: "#22e4ff", size: 18 });
      sfx.play("coin");
      flyChip(AX.center(D.cards), from, 500, { size: 26 });
      await wait(400);
    }
    // 3) Resultado de cada mano
    await Promise.all(res.map((r, i) => handFX(i, r, bets[i])));
    renderIns();
    // 4) Celebración global
    const hand0 = HANDS[0] ? spotCenter(HANDS[0]) : { x: innerWidth / 2, y: innerHeight / 2 };
    const finalBal = AX.getBalance();
    const coinsHome = async (count) => {
      const srcs = HANDS.filter((H) => H.amount > 0);
      const list = srcs.length ? srcs : [HANDS[0]];
      const ps = list.map((H) => {
        const p = spotCenter(H);
        collectStack(H, hud.center());
        return AX.fx.coinsTo(p, hud.center(), { count: Math.max(4, Math.round(count / list.length)) });
      });
      await Promise.all(ps);
      hud.setBalance(finalBal, true);
      sfx.play("cash");
      AX.haptic("success");
    };
    if (net > 0) {
      const anyBJ = res.some((r) => r.o === "bj");
      const mult = net / base;
      const streak = S.streak;
      if (anyBJ) {
        await blackjackCine(net);
      } else if (mult >= 2 || net >= 20000 || (streak >= 5 && mult >= 1)) {
        const tier = net >= 100000 ? "epic" : mult >= 4 || net >= 25000 ? "mega" : "big";
        const lbl = res.length > 1 ? "Mano dividida ganadora" : bets[0] > base ? "Doblaste y ganaste" : streak >= 5 ? `Racha de ${streak}` : "Blackjack";
        await AX.cine.bigWin(net, { tier, label: lbl });
      } else {
        AX.cine.banner(dS > 21 ? "¡GANAS!" : "¡GANAS!", { sub: "+" + AX.money(net), color: "rgba(10,163,88,.92)", sound: "win", duration: 1500 });
        AX.haptic("win");
        AX.fx.coinBurst(hand0.x, hand0.y, { count: 14 + Math.min(20, streak * 3) });
        AX.fx.stars(hand0.x, hand0.y - 40, { count: 10 + streak * 2 });
        await wait(500);
      }
      await coinsHome(10 + Math.min(20, Math.round(mult * 4) + S.streak * 2));
      await streakFX(true);
    } else if (net === 0 && R.totalRet > 0) {
      if (insRet > 0) AX.cine.banner("¡SEGURO COBRADO!", { sub: "El seguro cubre tu apuesta", color: "rgba(10,143,184,.92)", sound: "coin", duration: 1500 });
      else AX.cine.banner("EMPATE", { sub: "Recuperas tu apuesta", color: "rgba(110,100,170,.92)", sound: "push", duration: 1400 });
      AX.haptic("light");
      await wait(450);
      await coinsHome(6);
    } else {
      const allBust = res.every((r) => r.o === "bust");
      if (R.totalRet > 0) await coinsHome(5);
      if (!allBust && !dBJ) {
        AX.cine.banner("LA BANCA GANA", { sub: "−" + AX.money(-net), color: "rgba(150,14,44,.92)", sound: "lose2", duration: 1400 });
      } else if (allBust) sfx.play("lose2");
      AX.haptic("error");
      if (R.prevStreak >= 3) {
        const c = AX.center(streakEl);
        AX.fx.floatText(c.x, c.y - 10, `Racha de ${R.prevStreak} terminada`, { color: "#a59fc6", size: 16 });
      }
      await wait(700);
    }
  }

  async function handFX(i, r, bet) {
    const H = HANDS[i];
    if (!H) return;
    await wait(i * 260);
    const txt = { bj: "BLACKJACK", win: "GANA +" + AX.fmt(r.ret - bet), push: "EMPATE", lose: "PIERDE", bust: "SE PASA" }[r.o];
    H.tag.textContent = txt;
    H.tag.className = r.o === "bust" ? "tag" : "tag on " + r.o;
    if (r.o === "win" || r.o === "bj") {
      H.cardEls.forEach((e) => e.classList.add("win"));
      // la banca paga: fichas desde el crupier
      const payout = r.ret - bet;
      const list = chipsFor(payout).slice(0, 5);
      await Promise.all(list.map((v, k) => flyChip(AX.center(D.cards), spotCenter(H), v, { delay: k * 70, ms: 420, lift: -20 }).then(() => sfx.play("chip"))));
      renderStack(H, r.ret, true);
      const c = spotCenter(H);
      AX.fx.sparks(c.x, c.y, { count: 20, speed: 420 });
      AX.fx.floatText(c.x, c.y - 40, "+" + AX.money(payout), { color: "#2bff88", size: 24 });
    } else if (r.o === "push") {
      sfx.play("push");
    } else {
      // pierde: las fichas se van a la banca
      H.cardEls.forEach((e) => e.classList.add("dim"));
      collectStack(H, AX.center(D.cards), true);
      if (r.o === "lose") sfx.play("swoosh");
    }
  }
  function collectStack(H, to, lost) {
    const from = spotCenter(H);
    const chips = [...H.stack.children];
    H.amount = 0;
    H.amt.classList.remove("on");
    chips.forEach((c, k) => {
      const dx = to.x - from.x, dy = to.y - from.y;
      c.animate([{ transform: c.style.transform, opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(${lost ? 0.6 : 0.4})`, opacity: 0 }], { duration: dur(520), delay: dur(k * 25), easing: "cubic-bezier(.5,0,.5,1)", fill: "forwards" });
    });
    setTimeout(() => { if (H.stack) H.stack.innerHTML = ""; }, dur(520 + chips.length * 25));
  }

  async function streakFX(won) {
    const n = S.streak;
    renderStreak(true);
    if (!won || n < 2) return;
    const c = AX.center(streakEl);
    AX.fx.floatText(c.x, c.y - 24, `RACHA ×${n}`, { color: n >= 5 ? "#b593ff" : "#ffb020", size: 20 + Math.min(14, n * 2) });
    sfx.play("powerup");
    if (n >= 3) AX.fx.stars(c.x, c.y, { count: 10 + n * 2, colors: n >= 5 ? "ice" : "fire" });
    if (n >= 5) {
      AX.fx.fireworks({ count: Math.min(10, n), duration: 1800 });
      AX.cine.banner(`¡RACHA DE ${n}!`, { sub: n >= 8 ? "Imparable" : "En llamas", color: "rgba(139,92,255,.92)", sound: "shimmer", duration: 1600 });
      await wait(900);
    }
  }

  async function bustFX(i) {
    const H = HANDS[i];
    H.el.classList.add("busted");
    sfx.play("crack");
    AX.haptic("error");
    H.cardEls.forEach((e, k) => setTimeout(() => e.classList.add("cracked"), k * 60));
    AX.fx.shake(10, 450, H.cards);
    const c = AX.center(H.cards);
    AX.fx.burst(c.x, c.y, { colors: "blood", count: 36, speed: 520 });
    AX.fx.flash("#ff0030", 300, 0.22);
    H.stamp.textContent = S.hands.length > 1 ? "¡PASADA!" : "¡TE PASASTE!";
    H.stamp.className = "stamp on";
    status(`Te pasas con ${score(S.hands[i].cards).t}`, "red");
    await wait(800);
  }

  /* ---------- barrido de la mesa ---------- */
  async function sweep() {
    if (!dirty) return;
    dirty = false;
    const all = [...D.cardEls, ...HANDS.flatMap((H) => H.cardEls)];
    const to = AX.center(discardEl.querySelector(".tray"));
    HANDS.forEach((H) => { H.tag.className = "tag"; H.stamp.className = "stamp"; H.score.className = "score"; });
    D.stamp.className = "stamp";
    D.score.className = "score";
    sfx.play("swoosh");
    await Promise.all(
      all.map((e, k) => {
        const r = e.getBoundingClientRect();
        const dx = to.x - (r.left + r.width / 2), dy = to.y - (r.top + r.height / 2);
        e.firstChild.classList.add("down");
        return e.animate([{ transform: "none" }, { transform: `translate(${dx}px,${dy}px) rotate(${-120 + AX.rand(-20, 20)}deg) scale(.45)`, opacity: 0.9 }], { duration: dur(430), delay: dur(k * 35), easing: "cubic-bezier(.5,0,.6,1)", fill: "forwards" }).finished.catch(() => {});
      })
    );
    S.discard += all.length;
    save();
    lastView = null;
    resetTableDOM();
    table.classList.add("betting");
    renderStack(HANDS[0], S.pending);
    renderDiscard();
    layoutAll();
    setMode("bet");
  }

  /* ================================================================ CINEMÁTICAS */
  function blackjackCine(amount) {
    return new Promise((resolve) => {
      const l = AX.el("div", "bj-cine");
      const cards = lastView && lastView.hands[0] ? lastView.hands[0].cards : ["As", "Kh"];
      l.innerHTML = `<div class="ax-rays"></div><div class="bj-cards"></div><div class="bj-title">BLACK<br>JACK!</div><div class="bj-sub">Paga 3 a 2</div><div class="bj-amt">+<span>0</span> €</div><div class="bj-hint">Toca para continuar</div>`;
      const holder = l.querySelector(".bj-cards");
      cards.forEach((c, i) => { const e = makeCard(c, false); e.classList.add("c" + (i + 1)); holder.appendChild(e); });
      document.body.appendChild(l);
      sfx.play("jackpot");
      AX.haptic("bigwin");
      AX.fx.flash("#ffd23f", 500, 0.6);
      setTimeout(() => {
        const c = { x: innerWidth / 2, y: innerHeight * 0.45 };
        AX.fx.shockwave(c.x, c.y, { radius: Math.max(innerWidth, innerHeight) * 0.8, rings: 3, width: 16 });
        AX.fx.sparks(c.x, c.y, { count: 90, speed: 1000 });
        AX.fx.fireworks({ count: 9, duration: 2400 });
        AX.fx.coinRain({ count: 60, duration: 1600 });
        AX.fx.cannons({ count: 50, colors: "gold" });
        AX.fx.shake(12, 500);
      }, dur(300));
      setTimeout(() => {
        let tk = setInterval(() => sfx.play("tick"), 70);
        AX.countUp(l.querySelector(".bj-amt span"), 0, amount, 900).then(() => { clearInterval(tk); sfx.play("cash"); });
        setTimeout(() => clearInterval(tk), 1200);
      }, dur(800));
      let done = false;
      const t0 = Date.now();
      const finish = () => {
        if (done || Date.now() - t0 < 700) return;
        done = true;
        l.classList.add("out");
        setTimeout(() => { l.remove(); resolve(); }, 450);
      };
      setTimeout(finish, dur(3200));
      l.addEventListener("pointerdown", finish);
    });
  }

  async function shuffleCine() {
    const l = AX.el("div", "shuf");
    l.innerHTML = `<div class="shuf-bg"></div><div class="shuf-stage"></div><div class="shuf-title ax-gold-text">BARAJANDO</div><div class="shuf-sub">Zapato nuevo · 52 cartas</div>`;
    document.body.appendChild(l);
    const stage = l.querySelector(".shuf-stage");
    const N = 11;
    const cards = [];
    for (let i = 0; i < N * 2; i++) { const c = AX.el("div", "cback cardback"); stage.appendChild(c); cards.push(c); }
    const tf = (p) => `translate(${p.x}px,${p.y}px) rotate(${p.r}deg) scale(${p.s == null ? 1 : p.s})`;
    const mv = (c, p, o = {}) => {
      const from = c._p || p;
      c._p = p;
      c.style.transform = tf(p);
      const frames = [{ transform: tf(from) }];
      if (o.mid) frames.push({ transform: tf(o.mid), offset: 0.5 });
      frames.push({ transform: tf(p) });
      return c.animate(frames, { duration: dur(o.d || 300), delay: dur(o.delay || 0), easing: o.e || "cubic-bezier(.3,.7,.3,1)", fill: "backwards" }).finished.catch(() => {});
    };
    const Lp = cards.slice(0, N), Rp = cards.slice(N);
    const spread = Math.min(70, innerWidth * 0.17);
    sfx.play("whoosh");
    Lp.forEach((c, i) => { c._p = { x: -innerWidth, y: -40, r: -60 }; mv(c, { x: -spread, y: -i * 1.3, r: -10 }, { d: 420, delay: i * 14 }); c.style.zIndex = i; });
    Rp.forEach((c, i) => { c._p = { x: innerWidth, y: -40, r: 60 }; mv(c, { x: spread, y: -i * 1.3, r: 10 }, { d: 420, delay: i * 14 }); c.style.zIndex = i; });
    await wait(600);
    // inclinación de las mitades (bend)
    Lp.forEach((c, i) => mv(c, { x: -spread + 8, y: -i * 1.3 - 6, r: -18 }, { d: 180 }));
    Rp.forEach((c, i) => mv(c, { x: spread - 8, y: -i * 1.3 - 6, r: 18 }, { d: 180 }));
    await wait(200);
    // riffle: las cartas caen alternando desde lo alto de cada mitad
    sfx.play("riffle");
    AX.haptic("light");
    const order = [];
    for (let i = 0; i < N; i++) order.push(Lp[i], Rp[i]);
    const ps = order.map((c, k) => {
      c.style.zIndex = 100 + k;
      const left = Lp.includes(c);
      return mv(c, { x: AX.rand(-2, 2), y: -k * 0.9, r: AX.rand(-3, 3) }, { d: 260, delay: k * 34, mid: { x: left ? -spread * 0.45 : spread * 0.45, y: -k * 0.9 - 22, r: left ? -8 : 8 } });
    });
    await Promise.all(ps);
    // puente (cascada)
    sfx.play("bridge");
    await Promise.all(order.map((c, k) => mv(c, { x: 0, y: -k * 0.9, r: 0 }, { d: 300, delay: (order.length - k) * 12, mid: { x: 0, y: -60 - k * 1.5, r: 0, s: 1.04 } })));
    AX.haptic("tap");
    sfx.play("chip");
    const c0 = AX.center(stage);
    AX.fx.sparks(c0.x, c0.y, { count: 24, speed: 420 });
    await wait(220);
    // la baraja entra en el zapato
    const sc = AX.center(shoeEl);
    const dx = sc.x - c0.x, dy = sc.y - c0.y;
    l.classList.add("out");
    sfx.play("swoosh");
    await Promise.all(order.map((c, k) => mv(c, { x: dx, y: dy - k * 0.3, r: 0, s: 0.4 }, { d: 420, delay: k * 10, e: "cubic-bezier(.5,0,.3,1)" })));
    renderShoe();
    renderDiscard();
    shoeEl.animate([{ transform: "scale(1)" }, { transform: "scale(1.15)" }, { transform: "scale(1)" }], { duration: 300 });
    AX.fx.glow(sc.x, sc.y, { size: 90, color: "rgba(139,92,255,.8)" });
    sfx.play("land");
    l.remove();
    await wait(150);
  }

  /* ================================================================ INFO */
  shoeEl.addEventListener("click", () => {
    sfx.play("tap");
    const counts = {};
    RANKS.forEach((r) => (counts[r] = 0));
    S.shoe.forEach((c) => counts[rk(c)]++);
    const n = S.shoe.length;
    const st = S.stats;
    AX.modal({
      title: "Zapato y reglas",
      html: `
        <div style="display:flex;justify-content:space-between;font-weight:800"><span>Cartas en el zapato</span><span style="color:var(--ax-gold)">${n} / 52</span></div>
        <div class="info-bar"><i style="width:${(n / 52) * 100}%"></i></div>
        <div style="font-size:12px;color:var(--ax-muted)">Se baraja una baraja nueva cuando quedan menos de ${RESHUFFLE_AT} cartas.</div>
        <div class="info-grid">${RANKS.map((r) => `<div class="${counts[r] ? "" : "zero"}"><b>${r}</b><span>${counts[r]}</span></div>`).join("")}</div>
        <div class="info-stats">
          <div><b>${st.hands}</b><span>Manos</span></div>
          <div><b>${st.wins}</b><span>Ganadas</span></div>
          <div><b>${st.bj}</b><span>Blackjacks</span></div>
          <div><b>${st.pushes}</b><span>Empates</span></div>
          <div><b>${S.best}</b><span>Mejor racha</span></div>
          <div><b>${AX.fmt(st.biggest)}</b><span>Mayor premio</span></div>
        </div>
        <ul class="rules">
          <li>Blackjack paga <b>3 a 2</b>. Resto de victorias 1 a 1.</li>
          <li>La banca pide hasta 16 y se planta en todos los 17.</li>
          <li>Con As o figura visible, la banca comprueba si tiene Blackjack.</li>
          <li>Seguro (con As visible): media apuesta, paga 2 a 1.</li>
          <li>Doblar con 2 cartas (también tras dividir): recibes una sola carta.</li>
          <li>Dividir dos cartas del mismo valor una vez. 21 tras dividir no es Blackjack.</li>
          <li>Apuesta mínima ${MIN_BET} €. Si sales a mitad de mano, se guarda y continúa al volver.</li>
        </ul>`,
      buttons: [{ label: "Cerrar", kind: "gold", value: true }],
    });
  });

  /* ================================================================ DEPURACIÓN (pruebas) */
  window.BJ = {
    clearRig: () => (rigQ.length = 0),
    rig: (...codes) => { codes.flat().forEach((c) => { if (validCode(c)) rigQ.push(c); }); return rigQ.length; },
    state: () => JSON.parse(JSON.stringify(S)),
    busy: () => busy,
    mode: () => mode,
    speed: (f) => (SPEED = f),
    setShoe: (n) => { S.shoe = S.shoe.slice(-n); save(); renderShoe(); },
  };

  /* ================================================================ INICIO */
  function introIcon() {
    const a = makeCard("As", false), k = makeCard("Kh", false);
    a.classList.add("c1");
    k.classList.add("c2");
    return `<div class="intro-cards">${a.outerHTML}${k.outerHTML}</div>`;
  }

  (async function init() {
    if (S.phase === "bet" && S.pending > AX.getBalance()) S.pending = 0;
    renderStatic();
    setMode(S.phase === "bet" ? "bet" : "play");
    busy = true;
    refreshBar();
    await AX.cine.intro({ title: "Blackjack", subtitle: "Vence a la banca sin pasarte de 21", icon: introIcon(), color: "#19c79a", once: true });
    layoutAll();
    if (S.fresh) {
      S.fresh = false;
      save();
      await shuffleCine();
    }
    if (S.phase !== "bet") {
      AX.toast("Mano recuperada: continúa donde la dejaste", "gold");
      await proceed();
    } else {
      busy = false;
      setMode("bet");
      status(AX.getBalance() < MIN_BET ? "Sin saldo suficiente para apostar" : "Haz tu apuesta", AX.getBalance() < MIN_BET ? "red" : "");
    }
  })();
})();
</script>
